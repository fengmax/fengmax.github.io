# ============================================================
# 新闻抓取定时任务（方案 B）
# 每天抓一次科技新闻 → data/news.json → 自动提交
# 支持手动触发（Actions 页面点 Run workflow）
# 需要仓库权限: Settings → Actions → General →
#   Workflow permissions → Read and write permissions
# ============================================================
name: fetch-news

on:
  schedule:
    - cron: '0 0 * * *'      # 每 24 小时一次（UTC 00:00 = 北京时间 08:00）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许提交 news.json

jobs:
  fetch:
    runs-on: ubuntu-24.04       # 固定镜像版本：ubuntu-latest 将迁移到 Ubuntu 26
    timeout-minutes: 10          # 防止抓取卡死占满队列
    steps:
      - uses: actions/checkout@v5   # v5 起运行时为 node24（v4 是 node20，已被弃用）

      - name: 抓取新闻并生成 data/news.json
        run: node .github/scripts/fetch-news.mjs

      - name: 有更新则提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "news.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新科技新闻 $(date -u +%Y-%m-%dT%H:%M)"
            # 推送被拒（期间有人手动推了提交）时，rebase 到远端后重试一次
            if ! git push origin HEAD:main; then
              echo "push 被拒，fetch + rebase 后重试"
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main
              else
                git rebase --abort
                echo "rebase 冲突，本次放弃推送，下次运行会重新生成"
                exit 1
              fi
            fi
          fi

