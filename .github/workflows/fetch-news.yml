# ============================================================
# 新闻抓取定时任务（方案 B）
# 每 5 小时抓一次科技新闻 → data/news.json → 自动提交
# 支持手动触发（Actions 页面点 Run workflow）
# 需要仓库权限: Settings → Actions → General →
#   Workflow permissions → Read and write permissions
# ============================================================
name: fetch-news

on:
  schedule:
    - cron: '0 */5 * * *'    # 每 5 小时（0/5/10/15/20/25 点整各跑一次）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许提交 news.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取新闻并生成 data/news.json
        run: node .github/scripts/fetch-news.mjs

      - name: 有更新则提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "news.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新科技新闻 $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
