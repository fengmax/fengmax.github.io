<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宇宙沙盒 · 3D Solar System</title>
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
      background: #000;
    }
    #main-container {
      width: 100vw;
      height: 100vh;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #9aa4b5;
      font-size: 18px;
      z-index: 999;
      letter-spacing: 2px;
    }
    #title {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 4px;
      z-index: 10;
      text-shadow: 0 0 14px rgba(120, 180, 255, .55);
      pointer-events: none;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      color: #667;
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
    #hint b {
      color: #aac;
    }

    .spacekit__object-label {
      position: absolute;
      font-family: Arial, "PingFang SC", sans-serif;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, .72);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid rgba(160, 200, 255, .55);
      box-shadow: 0 0 8px rgba(0, 0, 0, .6);
      text-shadow: 0 0 6px rgba(100, 160, 255, .8);
      z-index: 15;
      visibility: visible !important;
      pointer-events: auto !important;
      cursor: pointer;
      min-height: 18px;
      line-height: 1.3;
    }
    .spacekit__object-label:hover {
      background: #2850a0 !important;
      border-color: #7fb2ff !important;
    }
    .spacekit__object-label>div {
      pointer-events: none;
    }

    #planet-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0, 0, 0, .8));
    }
    #planet-bar .pb-btn {
      color: #cdd8ec;
      background: rgba(30, 45, 80, .7);
      border: 1px solid rgba(120, 160, 255, .35);
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12.5px;
      letter-spacing: .5px;
      transition: all .15s;
      user-select: none;
      backdrop-filter: blur(2px);
    }
    #planet-bar .pb-btn:hover,
    #planet-bar .pb-btn.active {
      background: #2b62bd;
      color: #fff;
      border-color: #8fc0ff;
      box-shadow: 0 0 10px rgba(80, 140, 255, .5);
    }
    #planethome {
      color: #dde6f4;
      background: rgba(70, 90, 140, .55);
      border: 1px solid rgba(140, 180, 255, .5);
      padding: 5px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12.5px;
      letter-spacing: .5px;
      transition: all .15s;
      user-select: none;
      margin-left: 4px;
      backdrop-filter: blur(2px);
    }
    #planethome:hover {
      background: #3a76d0;
      color: #fff;
      border-color: #9cc4ff;
    }

    #time-ctl {
      position: fixed;
      top: 60px;
      left: 18px;
      z-index: 40;
      width: 210px;
      background: rgba(10, 15, 30, .9);
      border: 1px solid rgba(100, 150, 255, .4);
      border-radius: 10px;
      padding: 12px 14px;
      color: #e8eef7;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
      backdrop-filter: blur(6px);
      user-select: none;
    }
    #time-ctl .ttl {
      font-size: 12px;
      color: #7a89a3;
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #time-ctl .ttl .clock {
      font-size: 13px;
    }
    #time-date {
      font-size: 12px;
      color: #c8d6e8;
      background: rgba(255, 255, 255, .06);
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 8px;
      letter-spacing: .3px;
      font-variant-numeric: tabular-nums;
      border-left: 2px solid #4a8cf0;
    }
    #time-btns {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    #time-btns button {
      flex: 1;
      color: #cdd8ec;
      background: rgba(30, 45, 80, .7);
      border: 1px solid rgba(120, 160, 255, .35);
      padding: 6px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
    }
    #time-btns button.on {
      background: #2b62bd;
      color: #fff;
      border-color: #8fc0ff;
      box-shadow: 0 0 8px rgba(80, 140, 255, .5);
    }
    #time-btns button:hover {
      background: #3a76d0;
      color: #fff;
    }
    .t-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .t-row label {
      font-size: 11px;
      color: #89a;
      min-width: 34px;
    }
    .t-row input[type=range] {
      flex: 1;
      accent-color: #4a8cf0;
      height: 4px;
    }
    .t-row .t-val {
      font-size: 11px;
      color: #9fe2c0;
      font-weight: 600;
      min-width: 64px;
      text-align: right;
    }

    #info-panel {
      position: fixed;
      top: 60px;
      right: 18px;
      z-index: 40;
      width: 240px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      background: rgba(10, 15, 30, .92);
      border: 1px solid rgba(100, 150, 255, .4);
      border-radius: 10px;
      padding: 14px 16px;
      color: #e8eef7;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
      backdrop-filter: blur(6px);
      display: none;
    }
    #info-panel .ip-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #info-panel .ip-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }
    #info-panel .ip-desc {
      font-size: 12.5px;
      color: #aab6c9;
      line-height: 1.6;
      margin: 8px 0 10px;
    }
    #info-panel .ip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }
    #info-panel .ip-cell {
      background: rgba(255, 255, 255, .04);
      border-radius: 6px;
      padding: 6px 8px;
    }
    #info-panel .ip-cell .k {
      font-size: 10.5px;
      color: #7a89a3;
      letter-spacing: .5px;
    }
    #info-panel .ip-cell .v {
      font-size: 13px;
      color: #9fe2c0;
      font-weight: 600;
      margin-top: 1px;
    }
    #info-close {
      position: absolute;
      top: 8px;
      right: 12px;
      cursor: pointer;
      color: #889;
      font-size: 16px;
      background: none;
      border: none;
      line-height: 1;
      z-index: 1;
    }
    #info-close:hover {
      color: #fff;
    }
    @media (max-width:600px) {
      #title {
        font-size: 14px;
      }
      #info-panel {
        width: 200px;
        right: 8px;
      }
      #hint {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="loading">🌌 宇宙沙盒加载中…</div>
  <div id="title">SOLAR SYSTEM · 3D 宇宙沙盒</div>
  <div id="hint"><b>拖动</b>旋转 · <b>滚轮</b>缩放 · <b>点击行星/名字</b>查看信息</div>
  <div id="main-container"></div>
  <div id="planet-bar"><button id="planethome" title="回到全景">🌌 全景</button></div>

  <div id="time-ctl">
    <div class="ttl"><span class="clock">⏱</span> 模拟时间</div>
    <div id="time-date">⏳ 加载中…</div>
    <div id="time-btns">
      <button id="t-realtime" class="on">▸ 实时</button>
      <button id="t-pause">⏸ 暂停</button>
    </div>
    <div class="t-row">
      <label>倍速</label>
      <input type="range" id="t-slider" min="0" max="100" value="0" />
      <span class="t-val" id="t-val">实时</span>
    </div>
    <!-- 移除时间源状态显示 -->
  </div>

  <div id="info-panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name"><span class="ip-dot" id="ip-dot"></span><span id="ip-name">-</span></div>
    <div class="ip-desc" id="ip-desc">-</div>
    <div class="ip-grid">
      <div class="ip-cell"><div class="k">距太阳</div><div class="v" id="ip-dist">-</div></div>
      <div class="ip-cell"><div class="k">距地球</div><div class="v" id="ip-earth">-</div></div>
      <div class="ip-cell"><div class="k">平均温度</div><div class="v" id="ip-temp">-</div></div>
      <div class="ip-cell"><div class="k">公转速度</div><div class="v" id="ip-orb">-</div></div>
      <div class="ip-cell"><div class="k">自转周期</div><div class="v" id="ip-rot">-</div></div>
      <div class="ip-cell"><div class="k">公转周期</div><div class="v" id="ip-per">-</div></div>
    </div>
  </div>

  <script src="./build/spacekit.js"></script>
  <script>
    // ============================================================
    //  1. 时间校准：使用本地系统时间（准确可靠）
    // ============================================================
    // 格式化本地时间（不包含时区文字）
    function formatTime(d) {
      try {
        return d.toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
      } catch (_) {
        var y = d.getFullYear();
        var mo = String(d.getMonth() + 1).padStart(2, '0');
        var da = String(d.getDate()).padStart(2, '0');
        var h = String(d.getHours()).padStart(2, '0');
        var mi = String(d.getMinutes()).padStart(2, '0');
        var s = String(d.getSeconds()).padStart(2, '0');
        return y + '-' + mo + '-' + da + ' ' + h + ':' + mi + ':' + s;
      }
    }

    // 当前真实时间
    function getNow() {
      return new Date();
    }

    // ============================================================
    //  2. 行星数据 (物理参数 + 显示信息)
    // ============================================================
    var PLANETS = [{
      key: 'sun',
      label: '太阳',
      color: '#fdb813',
      au: 0,
      diameter: 1392000,
      desc: '太阳系的中心恒星，占太阳系总质量的99.86%。主要成分为氢和氦，核心温度约1500万℃，通过核聚变释放能量。',
      earthAU: '约1.496亿公里',
      temp: '表面 5500℃ / 核心 1500万℃',
      orb: '—',
      rot: '25.4天(赤道)',
      per: '—',
      diamTxt: '直径 139.2万 km'
    }, {
      key: 'mercury',
      label: '水星',
      color: '#9c9c9c',
      au: 0.39,
      diameter: 4879,
      desc: '太阳系最小的行星，离太阳最近。表面布满陨石坑，昼夜温差极大(白天430℃,夜间-180℃)，几乎没有大气层。',
      earthAU: '约0.61 AU',
      temp: '平均 167℃',
      orb: '47.9 km/s',
      rot: '58.6天',
      per: '88天',
      diamTxt: '直径 4879 km',
      selfrot: 1407.6,
      selfdir: 1
    }, {
      key: 'venus',
      label: '金星',
      color: '#e8c47d',
      au: 0.72,
      diameter: 12104,
      desc: '太阳系最热的行星，被称为地球的"姊妹星"。浓厚二氧化碳大气层产生失控温室效应，地表温度高达465℃。自转逆行。',
      earthAU: '约0.28 AU',
      temp: '平均 464℃',
      orb: '35.0 km/s',
      rot: '243天(逆行)',
      per: '225天',
      diamTxt: '直径 12104 km',
      selfrot: 5832,
      selfdir: -1
    }, {
      key: 'earth',
      label: '地球',
      color: '#3a86ff',
      au: 1.00,
      diameter: 12742,
      desc: '我们的家园，目前已知唯一孕育生命的星球。表面71%被液态水覆盖，拥有适宜的大气层和强大的磁场。',
      earthAU: '1.0 AU',
      temp: '平均 15℃',
      orb: '29.8 km/s',
      rot: '23.9小时',
      per: '365.25天',
      diamTxt: '直径 12742 km',
      selfrot: 23.9,
      selfdir: 1
    }, {
      key: 'moon',
      label: '月球',
      color: '#c9c9c9',
      au: 0.072,
      diameter: 3475,
      desc: '地球唯一的天然卫星，人类唯一踏足过的外星体。因潮汐锁定总是同一面朝向地球，表面布满陨石坑。',
      earthAU: '约 38.4 万 km',
      temp: '白天 127℃ / 夜间 -173℃',
      orb: '绕地球 1.02 km/s',
      rot: '27.3天(潮汐锁定)',
      per: '27.3天(恒星月)',
      diamTxt: '直径 3475 km',
      selfrot: 0,
      selfdir: 1
    }, {
      key: 'mars',
      label: '火星',
      color: '#e05d3f',
      au: 1.52,
      diameter: 6779,
      desc: '红色星球，表面富含氧化铁呈现锈红色。拥有太阳系最高的火山(奥林帕斯山,高2.2万米)和最大的峡谷。',
      earthAU: '约0.52 AU',
      temp: '平均 -63℃',
      orb: '24.1 km/s',
      rot: '24.6小时',
      per: '687天',
      diamTxt: '直径 6779 km',
      selfrot: 24.6,
      selfdir: 1
    }, {
      key: 'jupiter',
      label: '木星',
      color: '#d8a06a',
      au: 5.20,
      diameter: 139820,
      desc: '太阳系最大的行星，质量是其他行星总和的2.5倍。大红斑是持续数百年的巨型风暴。拥有79颗已知卫星。',
      earthAU: '约4.2 AU',
      temp: '平均 -108℃',
      orb: '13.1 km/s',
      rot: '9.9小时(最快)',
      per: '11.9年',
      diamTxt: '直径 139820 km',
      selfrot: 9.9,
      selfdir: 1
    }, {
      key: 'saturn',
      label: '土星',
      color: '#e6c98a',
      au: 9.58,
      diameter: 116460,
      desc: '以壮观的光环闻名，由无数冰块和岩石碎片组成。密度极低，比水还轻，是太阳系"最轻"的行星。',
      earthAU: '约8.6 AU',
      temp: '平均 -139℃',
      orb: '9.7 km/s',
      rot: '10.7小时',
      per: '29.5年',
      diamTxt: '直径 116460 km',
      selfrot: 10.7,
      selfdir: 1
    }, {
      key: 'uranus',
      label: '天王星',
      color: '#7fd6d8',
      au: 19.2,
      diameter: 50724,
      desc: '冰巨星，自转轴几乎"躺平"(倾斜98°)，四季极长且极端。呈蓝绿色，大气含甲烷吸收红光。',
      earthAU: '约18.2 AU',
      temp: '平均 -195℃',
      orb: '6.8 km/s',
      rot: '17.2小时(逆行)',
      per: '84年',
      diamTxt: '直径 50724 km',
      selfrot: 17.2,
      selfdir: -1
    }, {
      key: 'neptune',
      label: '海王星',
      color: '#4a6fe0',
      au: 30.1,
      diameter: 49244,
      desc: '离太阳最远的行星，深蓝色外观因大气中的甲烷。拥有太阳系最快的风速(可达2100km/h)。',
      earthAU: '约29.1 AU',
      temp: '平均 -201℃',
      orb: '5.4 km/s',
      rot: '16.1小时',
      per: '164.8年',
      diamTxt: '直径 49244 km',
      selfrot: 16.1,
      selfdir: 1
    }, ];

    // ============================================================
    //  3. 初始化 3D (SpaceKit)
    // ============================================================
    var viz = null;
    var objects = {};
    var PlanetDist = {
      sun: 120,
      mercury: 45,
      venus: 60,
      earth: 65,
      moon: 68,
      mars: 55,
      jupiter: 120,
      saturn: 110,
      uranus: 85,
      neptune: 85
    };

    function hideLoading() {
      var l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    }
    setTimeout(hideLoading, 600);
    setTimeout(hideLoading, 2000);
    window.addEventListener('load', hideLoading);

    try {
      // 使用当前本地时间作为模拟起点
      var startDate = new Date();

      viz = new Spacekit.Simulation(document.getElementById('main-container'), {
        basePath: './',
        unitsPerAu: 100.0,
        camera: { initialPosition: [150, 110, 220], enableDrift: true },
        startDate: startDate,
      });

      viz.createStars();
      viz.createAmbientLight();
      viz.createLight([0, 0, 0]);
      objects.sun = viz.createObject('sun', Spacekit.SpaceObjectPresets.SUN);

      var SUN_DIAMETER_KM = 1392000,
        SUN_RADIUS = 60,
        BOOST = 3;

      PLANETS.forEach(function(p) {
        if (p.key === 'sun') return;
        var preset = Spacekit.SpaceObjectPresets[p.key.toUpperCase()];
        if (!preset) return;
        var finalRadius = Math.max(SUN_RADIUS * (p.diameter / SUN_DIAMETER_KM) * BOOST, 0.6);
        var radiusToPass = finalRadius / 100;
        var obj = null;

        if (p.key === 'moon') {
          try {
            var earthFinal = Math.max(SUN_RADIUS * (12742 / SUN_DIAMETER_KM) * BOOST, 0.6);
            var moonFinal = earthFinal * (3475 / 12742);
            var moonR = Math.max(moonFinal, 0.5);
            // Use realistic semi-major axis in AU for the Moon (from PLANETS entry) instead
            // of a screen-size-derived value which was far too large.
            var moonOrbitAU = (typeof p !== 'undefined' && p.au) ? p.au : 0.00257;
            // Set ephemeris epoch to simulation start date JD so phase matches visualization
            var moonEpoch = (startDate.getTime() / 86400000) + 2440587.5;
            obj = viz.createSphere(p.key, {
              textureUrl: './assets/textures/moon.jpg',
              radius: moonR / 100,
              ephem: new Spacekit.Ephem({
                GM: 3986e11,
                epoch: moonEpoch,
                a: moonOrbitAU,
                e: 0.05,
                i: 5.1,
                om: 125.08,
                w: 318.15,
                ma: 135.27,
              }, 'deg', true),
              labelText: p.label,
            });
          } catch (e) {
            try { obj = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) { obj =
              null; }
          }
          if (obj && objects.earth && obj.orbitAround) { try { obj.orbitAround(objects.earth); } catch (e) {} }
        } else {
          try {
            obj = viz.createSphere(p.key, {
              textureUrl: './assets/textures/' + p.key + '.jpg',
              radius: radiusToPass,
              ephem: preset.ephem,
              levelsOfDetail: [{ radii: 0, segments: 48 }, { radii: 40, segments: 24 }, { radii: 80, segments: 12 }],
              labelText: p.label,
            });
          } catch (e) {
            try { obj = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) { obj =
              null; }
          }
        }
        if (obj) objects[p.key] = obj;
      });

      try { viz.setJdPerSecond(1 / 86400); } catch (e) {}
      window.THREE = Spacekit.THREE;

    } catch (err) {
      console.error('3D初始化失败:', err);
      hideLoading();
    }

    // ============================================================
    //  4. 交互逻辑 (聚焦/跟随/信息面板/纹理切换)
    // ============================================================
    function iface() {
      try {
        var currentFocus = null;
        var followId = null;
        var flyAnimId = null;
        var moonOrbitRing = null;

        function getObjPos(key) {
          var obj = objects[key];
          if (!obj) return null;
          try {
            var mesh = obj.get3jsObjects()[0];
            if (mesh && mesh.getWorldPosition) { var v = new THREE.Vector3();
              mesh.getWorldPosition(v); return v; }
          } catch (e) {}
          try {
            var p = objects[key].getPosition(viz.getJd ? viz.getJd() : 0);
            return new THREE.Vector3(p[0], p[1], p[2]);
          } catch (e) {}
          return null;
        }

        function stopMotion() {
          currentFocus = null;
          if (followId) { cancelAnimationFrame(followId);

        function fmtDays(dps) {

          var visualEarthRotationOffsetDeg = 0; // 若纹理经线有偏差，可在此调整
          var usePreciseMoonRotation = true; // 是否启用精确的月球朝向（基于时间锚定）

          // 精确地球自转：使用 sim JD -> GMST 计算地球自转角度，并保持倾角
          function applyPreciseEarthRotation(simJd) {
            if (!usePreciseEarthRotation) return;
            try {
              var earthObj = objects.earth;
              if (!earthObj) return;
              var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
              if (!earthMesh) return;

              var gmst = jdToGMST(simJd); // radians
              var obliquity = THREE.MathUtils.degToRad(23.4392911);

              // spin around local Z by GMST (sign tuned to visual expectation)
              var spinAngle = -gmst + THREE.MathUtils.degToRad(visualEarthRotationOffsetDeg);
              var qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), spinAngle);

              // tilt around local X by obliquity
              var qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), obliquity);

              // apply spin then tilt (q = qSpin * qTilt)
              var q = qSpin.multiply(qTilt);
              earthMesh.quaternion.copy(q);
            } catch (e) {
              // ignore
            }
          }

          // 精确月球朝向：基于月球与地球在 simJd 的位置，设置月球朝向使近地面朝向地球（潮汐锁定），并保留月球小倾角
          function applyPreciseMoonRotation(simJd) {
            if (!usePreciseMoonRotation) return;
            try {
              var moonObj = objects.moon;
              var earthObj = objects.earth;
              if (!moonObj || !earthObj) return;
              var moonMesh = moonObj.get3jsObjects && moonObj.get3jsObjects()[0];
              if (!moonMesh) return;

              var mp = null, ep = null;
              try { if (typeof moonObj.getPosition === 'function') mp = moonObj.getPosition(simJd); } catch (e) {}
              try { if (typeof earthObj.getPosition === 'function') ep = earthObj.getPosition(simJd); } catch (e) {}

              var moonPos = new THREE.Vector3();
              var earthPos = new THREE.Vector3();
              if (mp && mp.length >= 3 && ep && ep.length >= 3) {
                moonPos.set(mp[0], mp[1], mp[2]);
                earthPos.set(ep[0], ep[1], ep[2]);
              } else {
                try { moonMesh.getWorldPosition(moonPos); } catch (e) { return; }
                var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
                if (!earthMesh) return;
                try { earthMesh.getWorldPosition(earthPos); } catch (e) { return; }
              }

              var v_me = new THREE.Vector3().subVectors(earthPos, moonPos).normalize();

              // moon texture/noon axis — assume +Z points to sub-earth point on texture
              var textureNoon = new THREE.Vector3(0, 0, 1);
              var qLook = new THREE.Quaternion().setFromUnitVectors(textureNoon.clone().normalize(), v_me);

              // small lunar obliquity (~1.5424°)
              var moonObliquity = THREE.MathUtils.degToRad(1.5424);
              var qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), moonObliquity);

              var q = qLook.multiply(qTilt);
              moonMesh.quaternion.copy(q);
            } catch (e) {
              // ignore
            }
          }

          function applyQuickEarthDayNightFix() {
            if (!visualEarthDayNightFixEnabled) return;
            try {
              var earthObj = objects.earth;
              var sunObj = objects.sun;
              if (!earthObj || !sunObj) return;
              var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
              var sunMesh = sunObj.get3jsObjects && sunObj.get3jsObjects()[0];
              if (!earthMesh || !sunMesh) return;

              var ePos = new THREE.Vector3();
              var sPos = new THREE.Vector3();
              earthMesh.getWorldPosition(ePos);
              sunMesh.getWorldPosition(sPos);

              var sunDir = new THREE.Vector3().subVectors(sPos, ePos).normalize();

              // 本地纹理上的“正午”轴 — 若你的纹理正午不在 +Z，请改为 (1,0,0) 或 (0,0,-1)
              var textureNoon = new THREE.Vector3(0, 0, 1);

              var q = new THREE.Quaternion().setFromUnitVectors(textureNoon.clone().normalize(), sunDir.clone().normalize());

              if (visualEarthRotationOffsetDeg) {
                var rz = THREE.MathUtils.degToRad(visualEarthRotationOffsetDeg);
                var qoff = new THREE.Quaternion();
                qoff.setFromAxisAngle(new THREE.Vector3(0, 0, 1), rz);
                q.multiply(qoff);
              }

              // 视觉覆盖：直接写入四元数以对齐昼夜（非物理修改）
              earthMesh.quaternion.copy(q);
            } catch (e) {
              // 忽略视觉修正错误
            }
          }

          function tick() {
            try { syncSimulationTime(); } catch (e) {}
            try { updateMoonOrbit(); } catch (e) {}
            try { stepSelfRotation(); } catch (e) {}
            try {
              var simJd = null;
              try { if (typeof viz.getJd === 'function') simJd = viz.getJd(); } catch (e) {}
              if (simJd === null || simJd === undefined) simJd = toJd(new Date());
              try { applyPreciseEarthRotation(simJd); } catch (e) {}
              try { applyPreciseMoonRotation(simJd); } catch (e) {}
            } catch (e) {}
            try { if (visualEarthDayNightFixEnabled) applyQuickEarthDayNightFix(); } catch (e) {}
            try { updateTimeDate(); } catch (e) {}
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);

        } catch (e) {}

      } catch (err) {
        console.error('交互失败:', err);
      }
    }

    setTimeout(iface, 500);
  </script>
</body>
</html>
