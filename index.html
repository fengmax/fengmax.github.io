<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>太阳系沙盒 · 3D Solar System</title>
    <style>
    :root {
      --bg: #05070d;
      --glass: rgba(13, 18, 32, .72);
      --glass-strong: rgba(10, 14, 26, .9);
      --border: rgba(120, 160, 255, .16);
      --txt: #e8eef7;
      --txt-dim: #8a9bb5;
      --accent: #4a8cf0;
      --accent-2: #7fb2ff;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--txt);
      -webkit-font-smoothing: antialiased;
    }
    #main-container {
      width: 100vw;
      height: 100vh;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: #9aa4b5;
      font-size: 16px;
      letter-spacing: 3px;
      z-index: 999;
    }
    /* 顶部标题：低调角标 */
    #title {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 10;
      color: #cdd8ec;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      opacity: .7;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(120, 180, 255, .4);
    }
    /* 操作提示：底部居中，数秒后淡出 */
    #hint {
      position: fixed;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      color: #5d6b85;
      font-size: 11px;
      letter-spacing: .5px;
      z-index: 9;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      animation: fadeHint 1s ease 6s forwards;
    }
    #hint b { color: #8aa0c8; font-weight: 600; }
    @keyframes fadeHint { to { opacity: 0; } }

    /* 3D 内行星名字标签（JS 依赖，保留可点） */
    .spacekit__object-label {
      position: absolute;
      font-family: "PingFang SC", Arial, sans-serif;
      font-size: 12px;
      color: #fff;
      background: rgba(8, 12, 22, .75);
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
      cursor: pointer;
      z-index: 15;
    }
    .spacekit__object-label:hover {
      background: var(--accent) !important;
      border-color: var(--accent-2) !important;
    }
    .spacekit__object-label > div { pointer-events: none; }

    /* 月球专用 HTML overlay label（JS 依赖，保留） */
    .moon-overlay-label {
      position: fixed;
      z-index: 16;
      pointer-events: auto;
      cursor: pointer;
      font-family: "PingFang SC", Arial, sans-serif;
      font-size: 12px;
      color: #fff;
      background: rgba(8, 12, 22, .75);
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
      transform: translate(-50%, -100%);
      transition: opacity .18s, left .08s, top .08s;
      user-select: none;
    }
    .moon-overlay-label:hover {
      background: var(--accent) !important;
      border-color: var(--accent-2) !important;
    }
    .moon-overlay-label.hidden { opacity: 0; pointer-events: none; }

    /* 通用玻璃面板 */
    .panel {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
    }

    /* 底部行星栏：横向滚动，触控友好 */
    #planet-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      overflow-x: auto;
      overflow-y: hidden;
      background: linear-gradient(to top, rgba(5, 7, 13, .92), rgba(5, 7, 13, 0));
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #planet-bar::-webkit-scrollbar { display: none; }
    #planet-bar .pb-btn {
      flex: 0 0 auto;
      color: var(--txt-dim);
      background: rgba(30, 42, 72, .55);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: .5px;
      transition: .15s;
      user-select: none;
      white-space: nowrap;
    }
    #planet-bar .pb-btn:hover,
    #planet-bar .pb-btn.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent-2);
      box-shadow: 0 0 12px rgba(74, 140, 240, .5);
    }
    #planethome {
      flex: 0 0 auto;
      color: #dde6f4;
      background: rgba(70, 90, 140, .5);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: .5px;
      transition: .15s;
      user-select: none;
      white-space: nowrap;
    }
    #planethome:hover { background: #3a76d0; color: #fff; }

    /* 时间控制面板（桌面常驻左上） */
    #time-ctl {
      position: fixed;
      top: 54px;
      left: 16px;
      z-index: 40;
      width: 220px;
      padding: 14px 16px;
      color: var(--txt);
      user-select: none;
    }
    #time-ctl .ttl {
      font-size: 11px;
      color: var(--txt-dim);
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #time-ctl .ttl .clock { font-size: 14px; }
    #time-date {
      font-size: 12px;
      color: #c8d6e8;
      background: rgba(255, 255, 255, .05);
      border-left: 2px solid var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    #time-btns { display: flex; gap: 8px; margin-bottom: 10px; }
    #time-btns button {
      flex: 1;
      color: var(--txt-dim);
      background: rgba(30, 42, 72, .55);
      border: 1px solid var(--border);
      padding: 7px 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
      transition: .15s;
    }
    #time-btns button.on { background: var(--accent); color: #fff; border-color: var(--accent-2); }
    #time-btns button:hover { color: #fff; }
    .t-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .t-row label { font-size: 11px; color: var(--txt-dim); min-width: 32px; }
    .t-row input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
    .t-row .t-val { font-size: 11px; color: #9fe2c0; font-weight: 600; min-width: 62px; text-align: right; }

    /* 移动端时间开关按钮（桌面隐藏） */
    #time-toggle {
      display: none;
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 41;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
    }

    /* 信息面板（桌面右侧） */
    #info-panel {
      position: fixed;
      top: 54px;
      right: 16px;
      z-index: 40;
      width: 250px;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 16px 18px;
      color: var(--txt);
      display: none;
    }
    #info-panel .ip-name {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #info-panel .ip-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }
    #info-panel .ip-desc {
      font-size: 12.5px;
      color: var(--txt-dim);
      line-height: 1.65;
      margin: 8px 0 12px;
    }
    #info-panel .ip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
    }
    #info-panel .ip-cell {
      background: rgba(255, 255, 255, .04);
      border-radius: 8px;
      padding: 8px 10px;
    }
    #info-panel .ip-cell .k { font-size: 10px; color: var(--txt-dim); letter-spacing: .5px; }
    #info-panel .ip-cell .v { font-size: 13px; color: #9fe2c0; font-weight: 600; margin-top: 2px; }
    #info-close {
      position: absolute;
      top: 10px;
      right: 14px;
      cursor: pointer;
      color: #889;
      font-size: 18px;
      background: none;
      border: none;
      line-height: 1;
      z-index: 1;
    }
    #info-close:hover { color: #fff; }

    /* ===== 移动端适配（≤768px） ===== */
    @media (max-width: 768px) {
      #hint { bottom: 62px; font-size: 10px; }
      #time-toggle { display: flex; }
      #time-ctl { display: none; top: 64px; left: 12px; right: 12px; width: auto; }
      #time-ctl.open { display: block; animation: dropIn .22s ease; }
      #info-panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 62px;
        width: auto;
        max-height: 60vh;
        border-radius: 18px 18px 0 0;
        border-bottom: none;
        animation: sheetUp .28s ease;
      }
      #planet-bar { padding: 9px 12px; gap: 6px; }
      #planet-bar .pb-btn, #planethome { padding: 8px 12px; font-size: 12px; }
      #title { font-size: 12px; }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: .6; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes dropIn {
      from { transform: translateY(-12px); opacity: .5; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">🌌 太阳系沙盒加载中…</div>
  <div id="main-container"></div>

  <div id="title">SOLAR SYSTEM · 太阳系</div>
  <div id="hint"><b>拖动</b>旋转 · <b>滚轮</b>缩放 · <b>点击</b>行星查看信息</div>

  <!-- 移动端：时间控制开关 -->
  <button id="time-toggle" class="panel" title="时间控制">⏱</button>

  <!-- 时间控制面板 -->
  <div id="time-ctl" class="panel">
    <div class="ttl"><span class="clock">⏱</span> 模拟时间</div>
    <div id="time-date">⏳ 加载中…</div>
    <div id="time-btns">
      <button id="t-realtime" class="on">▸ 实时</button>
      <button id="t-pause">⏸ 暂停</button>
    </div>
    <div class="t-row">
      <label>倍速</label>
      <input type="range" id="t-slider" min="0" max="100" value="0" />
      <span class="t-val" id="t-val">实时</span>
    </div>
  </div>

  <!-- 信息面板 -->
  <div id="info-panel" class="panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name"><span class="ip-dot" id="ip-dot"></span><span id="ip-name">-</span></div>
    <div class="ip-desc" id="ip-desc">-</div>
    <div class="ip-grid">
      <div class="ip-cell"><div class="k">距太阳</div><div class="v" id="ip-dist">-</div></div>
      <div class="ip-cell"><div class="k">距地球</div><div class="v" id="ip-earth">-</div></div>
      <div class="ip-cell"><div class="k">平均温度</div><div class="v" id="ip-temp">-</div></div>
      <div class="ip-cell"><div class="k">公转速度</div><div class="v" id="ip-orb">-</div></div>
      <div class="ip-cell"><div class="k">自转周期</div><div class="v" id="ip-rot">-</div></div>
      <div class="ip-cell"><div class="k">公转周期</div><div class="v" id="ip-per">-</div></div>
    </div>
  </div>

  <div class="moon-overlay-label hidden" id="moon-overlay-label" title="点击聚焦月球">月球</div>

  <div id="planet-bar"><button id="planethome" title="回到全景">🌌 全景</button></div>

  <script src="./build/spacekit.js"></script>
  <script>
    // ============================================================
    //  1. 时间校准：使用本地系统时间（准确可靠）
    // ============================================================
    // 格式化本地时间（不包含时区文字）
    function formatTime(d) {
      try {
        return d.toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
      } catch (_) {
        var y = d.getFullYear();
        var mo = String(d.getMonth() + 1).padStart(2, '0');
        var da = String(d.getDate()).padStart(2, '0');
        var h = String(d.getHours()).padStart(2, '0');
        var mi = String(d.getMinutes()).padStart(2, '0');
        var s = String(d.getSeconds()).padStart(2, '0');
        return y + '-' + mo + '-' + da + ' ' + h + ':' + mi + ':' + s;
      }
    }

    // 当前真实时间
    function getNow() {
      return new Date();
    }

    // ============================================================
    //  2. 行星数据 (物理参数 + 显示信息)
    // ============================================================
    var PLANETS = [{

      earthAU: '约0.61 AU',
      temp: '平均 167℃',

      rot: '58.6天',

    }, {

      desc: '太阳系最热的行星，被称为地球的"姊妹星"。浓厚二氧化碳大气层产生失控温室效应，地表温度高达465℃。自转逆行。',

      temp: '平均 464℃',
      orb: '35.0 km/s',

    }, {

      label: '地球',
      color: '#3a86ff',

      desc: '我们的家园，目前已知唯一孕育生命的星球。表面71%被液态水覆盖，拥有适宜的大气层和强大的磁场。',
      earthAU: '1.0 AU',
      temp: '平均 15℃',
      orb: '29.8 km/s',
      rot: '23.9小时',
      per: '365.25天',
      diamTxt: '直径 12742 km',
      selfrot: 23.9,

    }, {
      key: 'moon',
      label: '月球',
      color: '#c9c9c9',

      diameter: 3475,
      desc: '地球唯一的天然卫星，人类唯一踏足过的外星体。因潮汐锁定总是同一面朝向地球，表面布满陨石坑。',
      earthAU: '约 38.4 万 km',

      selfrot: 24.6,
      selfdir: 1
    }, {
      key: 'jupiter',
      label: '木星',
      color: '#d8a06a',
      au: 5.20,
      diameter: 139820,
      desc: '太阳系最大的行星，质量是其他行星总和的2.5倍。大红斑是持续数百年的巨型风暴。拥有79颗已知卫星。',
      earthAU: '约4.2 AU',

    }, {
      key: 'saturn',

      desc: '以壮观的光环闻名，由无数冰块和岩石碎片组成。密度极低，比水还轻，是太阳系"最轻"的行星。',

    }, {
      key: 'uranus',
      label: '天王星',
      color: '#7fd6d8',
      au: 19.2,
      diameter: 50724,
      desc: '冰巨星，自转轴几乎"躺平"(倾斜98°)，四季极长且极端。呈蓝绿色，大气含甲烷吸收红光。',

      temp: '平均 -195℃',

    }, {

      label: '海王星',
      color: '#4a6fe0',
      au: 30.1,
      diameter: 49244,
      desc: '离太阳最远的行星，深蓝色外观因大气中的甲烷。拥有太阳系最快的风速(可达2100km/h)。',

      temp: '平均 -201℃',
      orb: '5.4 km/s',
      rot: '16.1小时',
      per: '164.8年',
      diamTxt: '直径 49244 km',
      selfrot: 16.1,
      selfdir: 1
    }, ];

    // ============================================================
    //  3. 初始化 3D (SpaceKit)
    // ============================================================
    var viz = null;
    var objects = {};
    var PlanetDist = {
      sun: 120,
      mercury: 45,
      venus: 60,
      earth: 22,    // 原 65 → 22:聚焦地球时让相机贴近,月球轨道环(半径≈8)能在屏幕上清晰成环
      moon: 5,      // 原 68 → 5 :聚焦月球时让月球(R≈0.45)可见,而不是几像素的点
      mars: 55,
      jupiter: 120,
      saturn: 110,
      uranus: 85,
      neptune: 85
    };

    // ============================================================
    //  2.5 月球轨道 (Schlyter 截断月球理论,地心黄道坐标)
    // ============================================================
    //  说明: 真实月球轨道偏心率/倾角/近拱点/升交点都随时间变化。
    //  月球轨道模型: Schlyter 截断月球理论(12 黄经摄动项 + 5 黄纬项 + 2 距离项)。
    //  2026-08-16 起替换旧的"线性进动 + 开普勒"简化模型——旧模型对月球误差可达 50°
    //  (月球受太阳摄动剧烈,月缩/出差/二均差等主项幅度就超过 1°,线性模型必然漂移)。
    //  新模型经 JPL DE421 星历在 2026-2027 年 9 个日期验证,黄经最大误差 0.044°。
    //  可视化基准: 半长轴 8 个场景单位 = 60.2666 地球半径(真实值)。
    var MOON_VIS_A = 8;        // 半长轴(可视化单位)
    var MOON_A_ER = 60.2666;   // 真实半长轴(地球半径)

    // 解开普勒方程: M = E - e * sin(E)   (牛顿迭代)
    function solveKeplerEquation(M, e) {
      var E = M;
      for (var i = 0; i < 12; i++) {
        var f = E - e * Math.sin(E) - M;
        var fp = 1 - e * Math.cos(E);
        var dE = f / fp;
        E = E - dE;
        if (Math.abs(dE) < 1e-12) break;
      }
      return E;
    }

    // 计算月球相对地球的位置 + 当时轨道几何 (Schlyter 截断月球理论)
    //  返回坐标为 J2000 黄道系、可视化单位(MOON_VIS_A=8 对应 60.2666 地球半径);
    //  与 JPL DE421 对比,2026-2027 年黄经误差 < 0.05°,月相/照明方向随之正确。
    function computeMoonOrbitState(simJd) {
      var D2R = Math.PI / 180;
      var d = simJd - 2451543.5;                    // Schlyter 日数(2000 Jan 0.0)
      // 当日吻切根数(度)
      var Ndeg = (125.1228 - 0.0529538083 * d) % 360;
      var inclDeg = 5.1454;
      var wDeg = (318.0634 + 0.1643573223 * d) % 360;
      var e = 0.054900;
      var Mdeg = ((115.3654 + 13.0649929509 * d) % 360 + 360) % 360;
      // 太阳平位置(摄动角 D 需要)
      var wsDeg = (282.9404 + 4.70935e-5 * d) % 360;
      var MsDeg = ((356.0470 + 0.9856002585 * d) % 360 + 360) % 360;
      var LsDeg = (MsDeg + wsDeg) % 360;

      // 开普勒方程 → 真近点角 ν 与向径 r(地球半径)
      var M = Mdeg * D2R;
      var E = solveKeplerEquation(M, e);
      var xv = Math.cos(E) - e;
      var yv = Math.sqrt(1 - e * e) * Math.sin(E);
      var nu = Math.atan2(yv, xv);
      var rER = Math.sqrt(xv * xv + yv * yv);

      // 轨道面 → 地心黄道(当日春分点)
      var u = nu + wDeg * D2R;
      var N = Ndeg * D2R, incl = inclDeg * D2R;
      var xh = rER * (Math.cos(u) * Math.cos(N) - Math.sin(u) * Math.sin(N) * Math.cos(incl));
      var yh = rER * (Math.sin(u) * Math.cos(N) + Math.cos(u) * Math.sin(N) * Math.cos(incl));
      var zh = rER * Math.sin(u) * Math.sin(incl);
      var lon = Math.atan2(yh, xh) / D2R;
      var lat = Math.atan2(zh, Math.sqrt(xh * xh + yh * yh)) / D2R;

      // 摄动角: Lm 平黄经, D 平距角, F 升交距角
      var Lm = (Ndeg + wDeg + Mdeg) % 360;
      var D = ((Lm - LsDeg) % 360 + 360) % 360;
      var F = ((Lm - Ndeg) % 360 + 360) % 360;
      var Dr = D * D2R, Fr = F * D2R, Msr = MsDeg * D2R;

      // 主摄动项(月缩/出差/二均差等,度 / 地球半径)
      lon += -1.274 * Math.sin(M - 2 * Dr)      // 出差 (evection)
           + 0.658 * Math.sin(2 * Dr)           // 二均差 (variation)
           - 0.186 * Math.sin(Msr)              // 周年差
           - 0.059 * Math.sin(2 * M - 2 * Dr)
           - 0.057 * Math.sin(M - 2 * Dr + Msr)
           + 0.053 * Math.sin(M + 2 * Dr)
           + 0.046 * Math.sin(2 * Dr - Msr)
           + 0.041 * Math.sin(M - Msr)
           - 0.035 * Math.sin(Dr)               // 月缩 (parallactic eq.)
           - 0.031 * Math.sin(M + Msr)
           - 0.015 * Math.sin(2 * Fr - 2 * Dr)
           + 0.011 * Math.sin(M - 4 * Dr);
      lat += -0.173 * Math.sin(Fr - 2 * Dr)
           - 0.055 * Math.sin(M - Fr - 2 * Dr)
           - 0.046 * Math.sin(M + Fr - 2 * Dr)
           + 0.033 * Math.sin(Fr + 2 * Dr)
           + 0.017 * Math.sin(2 * M + Fr);
      // 距离摄动项单位是地球半径;开普勒向径 rER 是"半长轴倍数"(≈1.0),
      // 必须先乘 MOON_A_ER 换算成地球半径再加摄动项,否则月球会陷进地球里
      rER = rER * MOON_A_ER - 0.58 * Math.cos(M - 2 * Dr) - 0.46 * Math.cos(2 * Dr);

      // 当日春分点 → J2000 岁差修正(行星场景是 J2000 框架)
      var T = (simJd - 2451545.0) / 36525.0;
      lon -= (5029.0966 * T + 1.11161 * T * T) / 3600.0;

      // 可视化缩放 + 球坐标 → 直角坐标
      var scale = MOON_VIS_A / MOON_A_ER;
      var r = rER * scale;
      var lonR = lon * D2R, latR = lat * D2R;
      var relX = r * Math.cos(latR) * Math.cos(lonR);
      var relY = r * Math.cos(latR) * Math.sin(lonR);
      var relZ = r * Math.sin(latR);

      return {
        relX: relX, relY: relY, relZ: relZ,
        r: r,
        nu: nu, u: u,
        node: N, incl: incl, argPeri: wDeg * D2R,   // 吻切根数(供轨道环绘制)
        cosO: Math.cos(N), sinO: Math.sin(N),
        cosI: Math.cos(incl), sinI: Math.sin(incl),
        a: MOON_VIS_A, e: e, sqrtOneMinusE2: Math.sqrt(1 - e * e)
      };
    }

    function hideLoading() {
      var l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    }
    setTimeout(hideLoading, 600);
    setTimeout(hideLoading, 2000);
    window.addEventListener('load', hideLoading);

    try {
      // 使用当前本地时间作为模拟起点
      var startDate = new Date();

      viz = new Spacekit.Simulation(document.getElementById('main-container'), {
        basePath: './',
        unitsPerAu: 100.0,
        camera: { initialPosition: [150, 110, 220], enableDrift: true },
        startDate: startDate,
      });

      viz.createStars();
      viz.createAmbientLight();
      viz.createLight([0, 0, 0]);
      objects.sun = viz.createObject('sun', Spacekit.SpaceObjectPresets.SUN);

      var SUN_DIAMETER_KM = 1392000,
        SUN_RADIUS = 60,
        BOOST = 3;

      PLANETS.forEach(function(p) {
        if (p.key === 'sun') return;
        var preset = Spacekit.SpaceObjectPresets[p.key.toUpperCase()];
        if (!preset) return;
        var finalRadius = Math.max(SUN_RADIUS * (p.diameter / SUN_DIAMETER_KM) * BOOST, 0.6);
        var radiusToPass = finalRadius / 100;
        var obj = null;

        if (p.key === 'moon') {
          try {
            var earthFinal = Math.max(SUN_RADIUS * (12742 / SUN_DIAMETER_KM) * BOOST, 0.6);
            // 月球半径严格按真实比例: 3475/12742 ≈ 0.2727(月球直径 / 地球直径)。
            // 即 月球半径 = 地球半径(earthFinal/100) × 0.2727,与真实地月大小比一致。
            // 去掉之前人工下限 0.10,回归"参照地球大小"的真实比例。
            var moonRadiusScaled = (earthFinal / 100) * (3475 / 12742);
            var moonR = Math.max(moonRadiusScaled, 0.003);  // 真实比例 ≈0.0045,保留极小下限防退化
            // Create moon as simple sphere WITHOUT ephemeris - orbit will be managed by updateMoonOrbit().
            // 不传 labelText,也不挂 HTML overlay —— 月球不带任何名字标签(按需求移除)。
            obj = viz.createSphere(p.key, {
              textureUrl: './assets/textures/moon.jpg',
              radius: moonR,
            });
            // 初始位置留 0 — updateMoonOrbit 在第一个 tick 立即接管,不会出现 (12,0,0) 闪烁
            if (obj) {
              try {
                var meshes = obj.get3jsObjects && obj.get3jsObjects();
                if (meshes && meshes[0]) {
                  meshes[0].position.set(0, 0, 0);
                }
              } catch (e) {}
            }
          } catch (e) {
            try { obj = viz.createObject(p.key, preset); } catch (e2) { obj = null; }
          }
        } else {
          try {
            obj = viz.createSphere(p.key, {
              textureUrl: './assets/textures/' + p.key + '.jpg',
              radius: radiusToPass,
              ephem: preset.ephem,
              levelsOfDetail: [{ radii: 0, segments: 48 }, { radii: 40, segments: 24 }, { radii: 80, segments: 12 }],
              labelText: p.label,
            });
          } catch (e) {
            try { obj = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) { obj =
              null; }
          }
        }
        if (obj) objects[p.key] = obj;
      });

      try { viz.setJdPerSecond(1 / 86400); } catch (e) {}
      window.THREE = Spacekit.THREE;

      // ===== 行星视觉增强：法线贴图 + 地球云层 + 大气辉光 =====
      // 仅依赖已暴露的 window.THREE, 不改动 SpaceKit 任何内部逻辑
      function enhancePlanets() {
        var T = window.THREE;
        if (!T || !viz || !objects) return;
        var loader = new T.TextureLoader();

        // 1x 法线强度
        var NSTR = 0.85;

        // 有大气的行星 -> 加 Fresnel 辉光(颜色/强度/放大比)
        var ATM = {
          earth:   { color: 0x5b9bff, power: 3.2, coeff: 0.88, scale: 1.025 },
          venus:   { color: 0xe8c27a, power: 3.0, coeff: 0.88, scale: 1.030 },
          mars:    { color: 0xff7a4a, power: 4.0, coeff: 0.82, scale: 1.030 },
          jupiter: { color: 0xd8b48a, power: 3.6, coeff: 0.85, scale: 1.020 },
          saturn:  { color: 0xe8d6a8, power: 3.6, coeff: 0.85, scale: 1.020 },
          uranus:  { color: 0x9fe6e6, power: 3.6, coeff: 0.85, scale: 1.030 },
          neptune: { color: 0x5a7bff, power: 3.6, coeff: 0.85, scale: 1.030 }
        };

        // SpaceKit 行星用的是自带 Lambert 着色器(je): 仅 sphereTexture + lightPos 两个 uniform,
        // 没有法线/镜面。我们不改库, 给该材质注入法线扰动 + 海洋镜面, 光照模型保持不变(仍是太阳 Lambert, 夜面仍为黑)。
        var AUG_FRAG = [
          'uniform sampler2D sphereTexture;',
          'uniform sampler2D normalMap;',
          'uniform float useNormal;',
          'uniform float normalScale;',
          'uniform sampler2D specularMap;',
          'uniform float useSpec;',
          'uniform float specStrength;',
          'uniform float shininess;',
          'varying vec2 vUv;',
          'varying vec3 vViewPosition;',
          'varying vec3 vViewLightPos;',
          'varying vec3 vNormal;',
          'vec3 perturbNormal(vec3 N, vec3 V, vec2 uv, vec3 mapN){',
          '  vec3 dp1 = dFdx(V); vec3 dp2 = dFdy(V);',
          '  vec2 duv1 = dFdx(uv); vec2 duv2 = dFdy(uv);',
          '  vec3 dp2perp = cross(dp2, N); vec3 dp1perp = cross(N, dp1);',
          '  vec3 T = dp2perp * duv1.x + dp1perp * duv2.x;',
          '  vec3 B = dp2perp * duv1.y + dp1perp * duv2.y;',
          '  float invmax = inversesqrt(max(dot(T,T), dot(B,B)));',
          '  mat3 TBN = mat3(T * invmax, B * invmax, N);',
          '  return normalize(TBN * mapN);',
          '}',
          'void main() {',
          '  vec3 N = normalize(vNormal);',
          '  if (useNormal > 0.5) {',
          '    vec3 mapN = texture2D(normalMap, vUv).xyz * 2.0 - 1.0;',
          '    mapN.xy *= normalScale;',
          '    N = perturbNormal(N, -vViewPosition, vUv, mapN);',
          '  }',
          '  vec3 L = normalize(vViewLightPos - vViewPosition);',
          '  float lambertian = max(dot(N, L), 0.0);',
          '  vec3 color = texture2D(sphereTexture, vUv).rgb * lambertian;',
          '  if (useSpec > 0.5) {',
          '    float specMask = texture2D(specularMap, vUv).r;',
          '    vec3 V = normalize(-vViewPosition);',
          '    vec3 H = normalize(L + V);',
          '    float s = pow(max(dot(N, H), 0.0), shininess) * specStrength * specMask;',
          '    color += vec3(s);',
          '  }',
          '  gl_FragColor = vec4(color, 1.0);',
          '}'
        ].join('\n');

        // 避免 null sampler 警告用的占位贴图
        var dummyNormal = new T.DataTexture(new Uint8Array([128,128,255,255]), 1, 1, T.RGBAFormat);
        dummyNormal.needsUpdate = true;
        var dummySpec = new T.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, T.RGBAFormat);
        dummySpec.needsUpdate = true;

        // get3jsObjects()[0] 是 LOD/group, 不是带材质的网格 -> 用 traverse 收集真实网格
        function getRoot(key) {
          try {
            var o = objects[key];
            if (!o || !o.get3jsObjects) return null;
            var arr = o.get3jsObjects();
            return (arr && arr[0]) ? arr[0] : null;
          } catch (e) { return null; }
        }
        function collectMeshes(root) {
          var out = [];
          if (!root || !root.traverse) return out;
          root.traverse(function (c) { if (c.isMesh && c.material) out.push(c); });
          return out;
        }
        function loadTex(url, cb) {
          loader.load(url, function (tex) { try { cb(tex); } catch (e) {} },
                             undefined, function () {});
        }

        function makeAtmosphere(radius, opt) {
          var geo = new T.SphereGeometry(radius * opt.scale, 48, 32);
          var mat = new T.ShaderMaterial({
            uniforms: {
              glowColor: { value: new T.Color(opt.color) },
              coefficient: { value: opt.coeff },
              power: { value: opt.power }
            },
            vertexShader: [
              'varying vec3 vNormal;',
              'varying vec3 vView;',
              'void main() {',
              '  vNormal = normalize(normalMatrix * normal);',
              '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
              '  vView = -mv.xyz;',
              '  gl_Position = projectionMatrix * mv;',
              '}'
            ].join('\n'),
            fragmentShader: [
              'uniform vec3 glowColor;',
              'uniform float coefficient;',
              'uniform float power;',
              'varying vec3 vNormal;',
              'varying vec3 vView;',
              'void main() {',
              '  vec3 viewDir = normalize(vView);',
              '  float d = dot(normalize(vNormal), viewDir);',
              '  float intensity = pow(max(coefficient - d, 0.0), power);',
              '  gl_FragColor = vec4(glowColor, 1.0) * intensity;',
              '}'
            ].join('\n'),
            side: T.FrontSide,
            blending: T.AdditiveBlending,
            transparent: true,
            depthWrite: false
          });
          return new T.Mesh(geo, mat);
        }

        var cloudMeshes = [];

        Object.keys(objects).forEach(function (key) {
          if (key === 'sun') return;
          var root = getRoot(key);
          var meshes = collectMeshes(root);
          if (!meshes.length) return;

          meshes.forEach(function (mesh) {
            var g = mesh.geometry;
            if (g && !g.boundingSphere) { try { g.computeBoundingSphere(); } catch (e) {} }
            var radius = (g && g.boundingSphere && g.boundingSphere.radius) ||
                         (g && g.parameters && g.parameters.radius) || 0.01;
            var mat = mesh.material;

            // A) 注入法线 / 镜面 uniform 到 SpaceKit 自带 Lambert 着色器
            if (mat && mat.uniforms && mat.uniforms.sphereTexture) {
              try {
                mat.uniforms.normalMap = { value: dummyNormal };
                mat.uniforms.useNormal = { value: 0 };
                mat.uniforms.normalScale = { value: NSTR };
                mat.uniforms.specularMap = { value: dummySpec };
                mat.uniforms.useSpec = { value: 0 };
                mat.uniforms.specStrength = { value: 0.35 };
                mat.uniforms.shininess = { value: 20.0 };
                mat.fragmentShader = AUG_FRAG;
                mat.extensions = Object.assign({}, mat.extensions, { derivatives: true });
                mat.needsUpdate = true;
              } catch (e) {}
            }

            // B) 法线贴图(异步加载, 两种材质路径都覆盖)
            loadTex('./assets/textures/' + key + '-normal.jpg', function (tex) {
              try {
                if (T.NoColorSpace) tex.colorSpace = T.NoColorSpace;
                else if (T.LinearSRGBColorSpace) tex.colorSpace = T.LinearSRGBColorSpace;
                var m = mesh.material;
                if (m && m.uniforms && m.uniforms.normalMap) {
                  m.uniforms.normalMap.value = tex;
                  m.uniforms.useNormal.value = 1;
                  m.needsUpdate = true;
                } else if (m && m.normalMap !== undefined) {
                  m.normalMap = tex;
                  if (m.normalScale && m.normalScale.set) m.normalScale.set(NSTR, NSTR);
                  m.needsUpdate = true;
                }
              } catch (e) {}
            });

            // C) 大气辉光: 作为子网格挂到真实网格上(跟随行星移动, 每个 LOD 级别都生效)
            if (ATM[key]) {
              try {
                var atm = makeAtmosphere(radius, ATM[key]);
                atm.name = key + '-atmosphere';
                mesh.add(atm);
              } catch (e) {}
            }
          });

          // 地球专属: 海洋镜面高光 + 云层
          if (key === 'earth') {
            // 取地球真实网格的半径，只加一次云层到根对象（避免 LOD 多级重复）
            var earthMesh = meshes[0];
            if (earthMesh) {
              var m = earthMesh.material;
              if (m && m.uniforms && m.uniforms.specularMap) {
                loadTex('./assets/textures/earth-specular.jpg', function (tex) {
                  try {
                    if (T.NoColorSpace) tex.colorSpace = T.NoColorSpace;
                    else if (T.LinearSRGBColorSpace) tex.colorSpace = T.LinearSRGBColorSpace;
                    var mm = earthMesh.material;
                    if (mm && mm.uniforms && mm.uniforms.specularMap) {
                      mm.uniforms.specularMap.value = tex;
                      mm.uniforms.useSpec.value = 1;
                      mm.needsUpdate = true;
                    }
                  } catch (e) {}
                });
              }
              // 云层: 用半径 1.06 明显浮出地表，alphaTest 让边缘锐利
              try {
                var g = earthMesh.geometry;
                if (g && !g.boundingSphere) { try { g.computeBoundingSphere(); } catch (e) {} }
                var r = (g && g.boundingSphere && g.boundingSphere.radius) ||
                        (g && g.parameters && g.parameters.radius) || 0.01;
                var cloudGeo = new T.SphereGeometry(r * 1.06, 64, 48);
                var cloudMat = new T.MeshBasicMaterial({
                  color: 0xffffff,
                  transparent: true,
                  depthWrite: false,
                  opacity: 0.75,
                  alphaTest: 0.06,
                  side: T.DoubleSide
                });
                loadTex('./assets/textures/earth-clouds.png', function (tex) {
                  try {
                    if (T.NoColorSpace) tex.colorSpace = T.NoColorSpace;
                    else if (T.LinearSRGBColorSpace) tex.colorSpace = T.LinearSRGBColorSpace;
                    cloudMat.alphaMap = tex;
                    cloudMat.needsUpdate = true;
                  } catch (e) {}
                });
                var cloudMesh = new T.Mesh(cloudGeo, cloudMat);
                cloudMesh.name = 'earth-clouds';
                // 挂到行星根对象，跟随自转且不随 LOD 切换而丢失
                if (root) root.add(cloudMesh);
                else earthMesh.add(cloudMesh);
                cloudMeshes.push(cloudMesh);
              } catch (e) {}
            }
          }
        });

        // 云层缓慢自转(独立 rAF, 不影响 SpaceKit 主循环)
        if (cloudMeshes.length) {
          window.__cloudMeshes = cloudMeshes;
          (function spin() {
            try {
              for (var i = 0; i < cloudMeshes.length; i++) {
                if (cloudMeshes[i]) cloudMeshes[i].rotation.y += 0.0015;
              }
            } catch (e) {}
            requestAnimationFrame(spin);
          })();
        }
      }
      try { enhancePlanets(); } catch (e) { console.error('enhancePlanets failed:', e); }

    } catch (err) {
      console.error('3D初始化失败:', err);
      hideLoading();
    }

    // ============================================================
    //  4. 交互逻辑 (聚焦/跟随/信息面板/纹理切换)
    // ============================================================
    function iface() {
      try {
        var currentFocus = null;
        var followId = null;
        var flyAnimId = null;
        var moonOrbitRing = null;
        var moonOverlayEl = null;         // 月球 HTML overlay label 引用
        // 初始化月球 overlay label:取 DOM 并绑定点击 → 聚焦月球(纯文字「月球」,无 emoji)
        try {
          moonOverlayEl = document.getElementById('moon-overlay-label');
          if (moonOverlayEl) {
            moonOverlayEl.addEventListener('click', function(e) {
              e.stopPropagation();
              try { focusPlanet('moon'); } catch (er) {}
            });
          }
        } catch (e) {}

        function getObjPos(key) {
          var obj = objects[key];
          if (!obj) return null;
          try {
            var mesh = obj.get3jsObjects()[0];
            if (mesh && mesh.getWorldPosition) { var v = new THREE.Vector3();
              mesh.getWorldPosition(v); return v; }
          } catch (e) {}
          try {
            var p = objects[key].getPosition(viz.getJd ? viz.getJd() : 0);
            return new THREE.Vector3(p[0], p[1], p[2]);
          } catch (e) {}
          return null;
        }

        function stopMotion() {
          currentFocus = null;
          if (followId) { cancelAnimationFrame(followId);
            followId = null; }
          if (flyAnimId) { cancelAnimationFrame(flyAnimId);
            flyAnimId = null; }
          try { if (viz && viz.getViewer) viz.getViewer().stopFollowingObject(); } catch (e) {}
          // 关闭相机漂移:否则 SpaceKit 内部会在每帧把 cam.position 重置回漂移轨道,
          // 导致 animateTo 飞过去后立刻被拉回。聚焦行星 / 跟随时必须关漂移。
          try { if (viz && typeof viz.setCameraDrift === 'function') viz.setCameraDrift(false); } catch (e) {}
        }

        function animateTo(endPos, endTgt, dur, done) {
          var cam = viz.getViewer().get3jsCamera();
          var controls = viz.getViewer().get3jsCameraControls();
          var startPos = cam.position.clone();
          var startTgt = controls.target.clone();
          var t0 = Date.now();
          if (flyAnimId) cancelAnimationFrame(flyAnimId);

          function step() {
            var t = Math.min(1, (Date.now() - t0) / dur);
            var e = 1 - Math.pow(1 - t, 3);
            cam.position.lerpVectors(startPos, endPos, e);
            controls.target.lerpVectors(startTgt, endTgt, e);
            if (t < 1) flyAnimId = requestAnimationFrame(step);
            else if (done) done();
          }
          step();
        }

        // 绘制/更新月球轨道环 (跟随地球 + 当前轨道平面方向)
        //   state 由 computeMoonOrbitState(simJd) 给出,内含 ω/i/Ω/a/e 等根数
        //   earthPos 为地球当前的世界坐标(THREE.Vector3)
        //   环用 LineLoop 沿轨道平面真椭圆采样绘制,与实际月球轨道共面
        function ensureMoonOrbitRing(state, earthPos) {
          try {
            if (!viz || !state || !earthPos) return;
            var sceneRoot = null;
            // 本地 build/spacekit.js 的 Viewer 没有 get3jsScene(),场景挂在 Simulation.getScene() 上
            try {
              if (typeof viz.getScene === 'function') sceneRoot = viz.getScene();
            } catch (e) {}
            if (!sceneRoot) {
              try {
                var viewer = viz.getViewer && viz.getViewer();
                if (viewer && typeof viewer.get3jsScene === 'function') sceneRoot = viewer.get3jsScene();
              } catch (e) {}
            }
            if (!sceneRoot) return;

            var N = 128;                                  // 轨道环采样点数
            if (!moonOrbitRing || !moonOrbitRing.geometry || !moonOrbitRing.geometry.attributes) {
              // 首次创建:顶点用动态数组,LineLoop 头尾由 LineLoop 自身处理,我们预留 N+1 个点首尾重合
              var positions = new Float32Array((N + 1) * 3);
              var geo = new THREE.BufferGeometry();
              geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
              var mat = new THREE.LineBasicMaterial({
                color: 0x444444,        // 与 SpaceKit 行星轨道环默认色一致(spacekit.js generateAndCacheOrbitShape: 4473924 = 0x444444)
                transparent: false,     // 行星轨道环不透明,保持一致
                opacity: 1,
                depthWrite: false
              });
              moonOrbitRing = new THREE.LineLoop(geo, mat);
              moonOrbitRing.renderOrder = 5;
              moonOrbitRing.frustumCulled = false;
              sceneRoot.add(moonOrbitRing);
            }

            // 抽取根数,按当前轨道平面绘制椭圆
            var argPeri = state.argPeri;
            var node = state.node;
            var incl = state.incl;
            var a = state.a, e = state.e, sqrtOneMinusE2 = state.sqrtOneMinusE2;
            var cosO = Math.cos(node), sinO = Math.sin(node);
            var cosI = Math.cos(incl), sinI = Math.sin(incl);

            var pos = moonOrbitRing.geometry.attributes.position.array;
            for (var i = 0; i <= N; i++) {
              // 用真近点角 ν ∈ [0, 2π] 沿椭圆线积分
              var nu = (i / N) * Math.PI * 2;
              var cosNu = Math.cos(nu), sinNu = Math.sin(nu);
              // 椭圆轨道上从焦点出发: xF = a(cosE − e), yF = a√(1-e²) sinE
              // 为绘制整圈椭圆,直接用 ν 得 r = a(1-e²)/(1+e cos ν)
              var rRing = a * (1 - e * e) / (1 + e * cosNu);
              // u = ω + ν(从升交点起算)
              var uRing = nu + argPeri;
              var cosURing = Math.cos(uRing), sinURing = Math.sin(uRing);
              // Meeus 公式 → 地球参考系下相对地球的坐标
              var dx = rRing * (cosURing * cosO - sinURing * sinO * cosI);
              var dy = rRing * (sinURing * cosO + cosURing * sinO * cosI);
              var dz = rRing * (sinURing * sinI);
              pos[i * 3 + 0] = earthPos.x + dx;
              pos[i * 3 + 1] = earthPos.y + dy;
              pos[i * 3 + 2] = earthPos.z + dz;
            }
            // 最后一点重合到首点,确保闭环(虽然 LineLoop 会自动闭合,但显式合上以防万一)
            pos[N * 3 + 0] = pos[0];
            pos[N * 3 + 1] = pos[1];
            pos[N * 3 + 2] = pos[2];
            moonOrbitRing.geometry.attributes.position.needsUpdate = true;
            moonOrbitRing.geometry.computeBoundingSphere();
          } catch (e) {
            console.warn('Moon orbit ring update failed:', e);
          }
        }

        function planetRadius(key) {
          var DIAM = { mercury: 4879, venus: 12104, earth: 12742, moon: 3475, mars: 6779, jupiter: 139820, saturn: 116460,
            uranus: 50724, neptune: 49244 };
          if (key === 'sun') return 60;
          return Math.max(60 * ((DIAM[key] || 10000) / 1392000) * 3, 0.6);
        }

        function setMinDistFor(key) {
          try {
            var controls = viz.getViewer().get3jsCameraControls();
            var r = planetRadius(key);
            controls.minDistance = r * 1.18 + 1.5;
            controls.update();
          } catch (e) {}
        }

        function resetMinDist() {
          try {
            var controls = viz.getViewer().get3jsCameraControls();
            controls.minDistance = 2;
            controls.update();
          } catch (e) {}
        }

        function focusPlanet(key) {
          var obj = objects[key];
          if (!obj) return;
          stopMotion();
          currentFocus = key;
          var dist = Math.max(20, (PlanetDist[key] || 40));
          setMinDistFor(key);
          forceHiRes(key);
          showInfo(key);
          try {
            var cam = viz.getViewer().get3jsCamera();
            var controls = viz.getViewer().get3jsCameraControls();
            var pos = getObjPos(key);
            if (!pos) return;
            var dir = new THREE.Vector3(dist, dist * 0.5, dist * 0.8).normalize();
            var dest = pos.clone().add(dir.clone().multiplyScalar(dist));
            var followStart = function() { startFollow(key, dist); };
            animateTo(dest, pos.clone(), 800, followStart);
          } catch (e) {}
        }

        function startFollow(key, dist) {
          currentFocus = key;

          function loop() {
            if (currentFocus !== key) return;
            try {
              var cam = viz.getViewer().get3jsCamera();
              var controls = viz.getViewer().get3jsCameraControls();
              var pos = getObjPos(key);
              if (pos && cam && controls) {
                var delta = cam.position.clone().sub(controls.target);
                if (delta.length() < 1) { delta.set(dist, dist * 0.5, dist * 0.8); }
                controls.target.copy(pos);
                cam.position.copy(pos).add(delta);
                controls.update();
              }
            } catch (e) {}
            followId = requestAnimationFrame(loop);
          }
          loop();
        }

        function goHome() {
          stopMotion();
          resetMinDist();
          try {
            var home = new THREE.Vector3(150, 110, 220);

        // 底部行星栏
        var bar = document.getElementById('planet-bar');

        // 绑定 label 点击
        function bindLabels() {

        // 纹理切换 (远低清/近高清)
        var texCache = {};

        function preloadTextures() {
          try {
            var loader = new THREE.TextureLoader();
            PLANETS.forEach(function(p) {
              if (p.key === 'sun') return;
              // 只预载低清: 加快首页加载。高清(-hi)不预载,
              // 由 checkTextures 在镜头拉近时按需加载(2026-08-16 起不再全量预载高清)
              var url = './assets/textures/' + p.key + '.jpg';
              if (texCache[url]) return;
              loader.load(url, function(tex) { tex.anisotropy = 4;
                texCache[url] = tex; });
            });
          } catch (e) {}
        }
        preloadTextures();

        function setTexture(key, url, onDone) {
          var obj = objects[key];
          if (!obj) return;
          var roots = [];
          try { roots.push(obj.get3jsObjects()[0]); } catch (e) {}
          roots = roots.filter(function(r) { return r && typeof r.traverse === 'function'; });
          if (roots.length === 0) return;

          function applyTex(tex) {
            tex.anisotropy = 4;
            var replaced = 0;
            roots.forEach(function(root) {
              if (!root) return;
              try {
                root.traverse(function(n) {
                  if (!n || !n.material) return;
                  var mm = Array.isArray(n.material) ? n.material : [n.material];
                  mm.forEach(function(mi) {
                    if (!mi) return;
                    try {
                      if (typeof mi.map !== 'undefined') { mi.map = tex; }
                      if (mi.uniforms && mi.uniforms.sphereTexture) { mi.uniforms.sphereTexture
                          .value = tex;
                        replaced++; }
                      mi.needsUpdate = true;
                    } catch (e) {}
                  });
                });
              } catch (e) {}
            });
            if (onDone) onDone();
          }
          if (texCache[url]) { applyTex(texCache[url]); return; }
          try { new THREE.TextureLoader().load(url, applyTex); } catch (e) {}
        }

        var texLoaded = {};

        function forceHiRes(key) {
          if (key === 'sun') return;
          var HI = './assets/textures/' + key + '-hi.jpg';
          setTexture(key, HI, function() { texLoaded[key] = HI; });
        }

        function checkTextures() {
          if (!viz || !viz.getViewer) return;
          var cam,
            camPos = null;
          try { cam = viz.getViewer().get3jsCamera();
            camPos = cam.position; } catch (e) { return; }
          if (!camPos) return;
          PLANETS.forEach(function(p) {
            if (p.key === 'sun') return;
            var pos = getObjPos(p.key);
            if (!pos) return;
            var d = camPos.distanceTo(pos);
            var r = planetRadius(p.key);
            var HI = './assets/textures/' + p.key + '-hi.jpg';
            var LO = './assets/textures/' + p.key + '.jpg';
            var hiThresh = Math.max(40, r * 20);
            if (d < hiThresh && texLoaded[p.key] !== HI) {
              setTexture(p.key, HI, function() { texLoaded[p.key] = HI; });
            } else if (d >= hiThresh && texLoaded[p.key] !== LO) {
              setTexture(p.key, LO, function() { texLoaded[p.key] = LO; });
            }
          });
        }
        setInterval(checkTextures, 500);

        // 信息面板
        function showInfo(key) {
          var info = null;
          for (var i = 0; i < PLANETS.length; i++) {
            if (PLANETS[i].key === key) { info = PLANETS[i]; break; }

          document.getElementById('ip-dot').style.background = info.color;
          document.getElementById('ip-dot').style.color = info.color;

          document.getElementById('ip-desc').textContent = info.desc;
          document.getElementById('ip-dist').textContent = (key === 'sun') ? '中心' : (key === 'moon' ? '绕地球运行' : info.au +
            ' AU（' + (info.au * 1.496) + '亿km）');
          document.getElementById('ip-earth').textContent = info.earthAU;
          document.getElementById('ip-temp').textContent = info.temp;
          document.getElementById('ip-orb').textContent = info.orb;

        }
        document.getElementById('info-close').addEventListener('click', function(e) {

        });

        // ============================================================
        //  5. 时间控制：实时/暂停/倍速  + 自转
        // ============================================================
        var currentMode = 'realtime';
        var lastJd = null;
        var timeController = {
          mode: 'realtime',
          speedDaysPerSecond: 1 / 86400,
          anchorJd: null,
          lastWallMs: Date.now()
        };

        function toJd(date) {
          return (date.getTime() / 86400000) + 2440587.5;
        }

        function jdToDate(jd) {
          return new Date((jd - 2440587.5) * 86400000);
        }

        // 将 Julian Date 转为 GMST（格林尼治恒星时，弧度）
        function jdToGMST(jd) {
          // Approximate GMST in degrees using IAU 1982 expression
          var T = (jd - 2451545.0) / 36525.0;
          var gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000.0;
          gmst = ((gmst % 360) + 360) % 360;
          return THREE.MathUtils.degToRad(gmst);
        }

        function syncSimulationTime() {
          if (!viz) return null;
          var now = new Date();
          var anchorJd = timeController.anchorJd !== null ? timeController.anchorJd : toJd(now);
          var targetJd = anchorJd;

          if (timeController.mode !== 'pause') {
            var elapsedSeconds = (Date.now() - timeController.lastWallMs) / 1000;
            targetJd = anchorJd + elapsedSeconds * timeController.speedDaysPerSecond;
          }

          try {
            // Always update the viz to the target JD if possible so object ephemerides align
            if (typeof viz.setJd === 'function') {
              try { viz.setJd(targetJd); } catch (e) {}
            }
            // Also inform viz about the current simulation rate so it can animate between JD updates.
            if (typeof viz.setJdPerSecond === 'function') {
              try { viz.setJdPerSecond(timeController.mode === 'pause' ? 0 : timeController.speedDaysPerSecond); } catch (e) {}
            } else if (typeof viz.setDate === 'function') {
              try { viz.setDate(jdToDate(targetJd)); } catch (e) {}
            }
          } catch (e) {}

          return targetJd;
        }

        // 更新模拟时间显示（始终同步真实时间）
        function updateTimeDate() {
          var el = document.getElementById('time-date');
          if (!el) return;
          el.textContent = formatTime(new Date());
        }

        function updateMoonOrbit() {
          if (!viz || !objects.earth || !objects.moon) return;
          try {
            // 优先使用 viz 的当前 JD(由 syncSimulationTime 持续同步)
            var simJd = null;
            try {
              if (typeof viz.getJd === 'function') simJd = viz.getJd();
            } catch (e) {}
            if (simJd === null || simJd === undefined) {
              try { simJd = syncSimulationTime(); } catch (e) {}
            }
            if (simJd === null || simJd === undefined) simJd = toJd(new Date());

            var moonObj = objects.moon;
            var earthObj = objects.earth;
            var moonMesh = moonObj.get3jsObjects && moonObj.get3jsObjects()[0];
            var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
            if (!moonMesh || !earthMesh) return;

            // 地球当前世界位置
            var earthPos = new THREE.Vector3();
            try { earthMesh.getWorldPosition(earthPos); } catch (e) { earthPos.set(0, 0, 0); }

            // 计算月球轨道状态(开普勒根数 → 相对地球坐标 + 轨道几何)
            var state = computeMoonOrbitState(simJd);

            // 确保月球 mesh 是 scene root 的直接子节点,
            // 这样 moonMesh.position 即世界坐标,与父变换无关
            try {
              var sceneRoot = null;
              // 优先用 Simulation.getScene()(本版 spacekit 没有 viewer.get3jsScene)
              try {
                if (viz && typeof viz.getScene === 'function') sceneRoot = viz.getScene();
              } catch (e) {}
              if (!sceneRoot) {
                try {
                  var viewer = viz && viz.getViewer();
                  if (viewer && typeof viewer.get3jsScene === 'function') sceneRoot = viewer.get3jsScene();
                } catch (e) {}
              }
              if (sceneRoot && moonMesh.parent && moonMesh.parent !== sceneRoot &&
                  typeof moonMesh.parent.remove === 'function' &&
                  typeof sceneRoot.add === 'function') {
                try { moonMesh.parent.remove(moonMesh); } catch (e) {}
                try { sceneRoot.add(moonMesh); } catch (e) {}
              }
            } catch (e) {}

            // 设置月球世界位置 = 地球世界位置 + (relX, relY, relZ)
            var moonWorld = new THREE.Vector3(
              earthPos.x + state.relX,
              earthPos.y + state.relY,
              earthPos.z + state.relZ
            );
            try { moonMesh.position.copy(moonWorld); } catch (e) {
              try { moonMesh.position.set(moonWorld.x, moonWorld.y, moonWorld.z); } catch (e) {}
            }

            // 同步更新月球轨道环 (state 驱动)
            ensureMoonOrbitRing(state, earthPos);

            // 确保月球可见
            try {
              moonMesh.visible = true;
              if (moonMesh.material) {
                try { moonMesh.material.opacity = 1; moonMesh.material.transparent = false; } catch (e) {}
              }
            } catch (e) {}

            // 潮汐锁定: 让月球近地面朝向地球 (applyPreciseMoonRotation 会接管更精确的版本)
            try {
              if (!usePreciseMoonRotation && moonMesh && typeof moonMesh.lookAt === 'function') {
                moonMesh.lookAt(earthPos);
              }
            } catch (e) {}

            // 月球 HTML overlay label 屏幕投影(纯文字「月球」,无 emoji)
            // 把月球 mesh 的世界坐标投影到屏幕,然后把 label 摆到月球上方若干像素处
            // 月球在相机背面(z > 1 或 < -1)时隐藏,避免 label 穿到不该去的地方
            try {
              if (moonOverlayEl) {
                var cam = null;
                try { cam = viz && viz.getViewer && viz.getViewer().get3jsCamera(); } catch (e) {}
                if (cam && moonMesh) {
                  var projV = new THREE.Vector3();
                  try { moonMesh.getWorldPosition(projV); } catch (e) {}
                  projV.project(cam);
                  // 在相机背后 → 隐藏;否则放到月球上方一点点(避免压到月面)
                  if (projV.z > 1 || projV.z < -1) {
                    moonOverlayEl.classList.add('hidden');
                  } else {
                    var halfW = window.innerWidth * 0.5;
                    var halfH = window.innerHeight * 0.5;
                    var sx = projV.x * halfW + halfW;
                    var sy = -projV.y * halfH + halfH;
                    moonOverlayEl.style.left = sx.toFixed(1) + 'px';
                    moonOverlayEl.style.top = (sy - 22).toFixed(1) + 'px';
                    moonOverlayEl.classList.remove('hidden');
                  }
                }
              }
            } catch (e) {}
          } catch (e) {
            // ignore
          }
        }

        // IAU 行星北极指向(J2000 赤经/赤纬,度) — 用于各行星的黄赤倾角
        // 场景是 J2000 黄道系: 极点先按赤道坐标取单位向量,再绕 +X 转 -ε 到黄道系
        var PLANET_POLES = {
          mercury: [281.01, 61.45],   // 倾角(对黄道)≈7.0°
          venus: [272.76, 67.16],     // IAU 北极几乎指黄极,配合 selfdir=-1 逆行自转
          mars: [317.68, 52.89],      // ≈26.7°
          jupiter: [268.06, 64.50],   // ≈2.2°
          saturn: [40.60, 83.54],     // ≈28.1°
          uranus: [257.31, -15.18],   // 几乎躺在黄道面上(≈82°/"躺着转")
          neptune: [299.36, 42.95]    // ≈28.5°
        };
        var planetSpinAngles = {};   // 各行星累计自转角(弧度)
        var planetTiltQuats = {};    // 各行星倾角四元数缓存

        // 由 IAU 极点计算该行星"从竖直(+Z)到真实极轴指向"的倾角四元数
        function getPlanetTiltQuat(key) {
          if (planetTiltQuats[key]) return planetTiltQuats[key];
          var q = new THREE.Quaternion();
          var p = PLANET_POLES[key];
          if (p) {
            var a = THREE.MathUtils.degToRad(p[0]), d = THREE.MathUtils.degToRad(p[1]);
            var eps = THREE.MathUtils.degToRad(23.4392911);
            var x = Math.cos(a) * Math.cos(d), y = Math.sin(a) * Math.cos(d), z = Math.sin(d);
            // 赤道 → 黄道: 绕 +X 转 -ε(与地球修正同一约定)
            var y2 = y * Math.cos(eps) + z * Math.sin(eps);
            var z2 = -y * Math.sin(eps) + z * Math.cos(eps);
            var pole = new THREE.Vector3(x, y2, z2).normalize();
            q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), pole);
          }
          planetTiltQuats[key] = q;
          return q;
        }

        // 自转步进
        function stepSelfRotation() {
          if (!viz || !viz.getJd) return;
          var jd;
          try { jd = viz.getJd(); } catch (e) { return; }
          if (jd == null) return;
          if (lastJd == null) { lastJd = jd; return; }
          var deltaJd = jd - lastJd;
          lastJd = jd;
          if (!deltaJd || Math.abs(deltaJd) < 1e-12) return;
          PLANETS.forEach(function(p) {
            // skip sun, moon and earth here — earth rotation is handled by precise GMST when enabled
            if (p.key === 'sun' || p.key === 'moon' || p.key === 'earth') return;
            var o = objects[p.key];
            if (!o) return;
            var r = p.selfrot || 0;
            if (!r) return;
            try {
              var days = r / 24;
              var dAng = (2 * Math.PI) * deltaJd / days * (p.selfdir || 1);
              var mesh = o.get3jsObjects()[0];
              if (mesh && mesh.quaternion) {
                // 累计自转角,四元数合成: q = qTilt * qSpin(先自转后倾角)
                // 倾角在外层 → 极轴指向在空间中固定,不会像旧代码那样所有行星都"竖直自转"
                planetSpinAngles[p.key] = ((planetSpinAngles[p.key] || 0) + dAng) % (2 * Math.PI);
                var qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), planetSpinAngles[p.key]);
                var q = getPlanetTiltQuat(p.key).clone().multiply(qSpin);
                mesh.quaternion.copy(q);
              }
            } catch (e) {}
          });
        }

        function setTimeMode(mode) {
          currentMode = mode;
          timeController.mode = mode;
          var slider = document.getElementById('t-slider');
          var now = new Date();

          if (mode === 'pause') {
            timeController.speedDaysPerSecond = 0;
            timeController.anchorJd = timeController.anchorJd !== null ? timeController.anchorJd : toJd(now);
            timeController.lastWallMs = Date.now();
            if (viz && viz.setJdPerSecond) {
              try { viz.setJdPerSecond(0); } catch (e) {}
            }
          } else if (mode === 'realtime') {
            timeController.speedDaysPerSecond = 1 / 86400;
            timeController.anchorJd = toJd(now);
            timeController.lastWallMs = Date.now();
            if (slider) slider.value = 0;
            document.getElementById('t-val').textContent = '实时';
            if (viz && viz.setJdPerSecond) {
              try { viz.setJdPerSecond(1 / 86400); } catch (e) {}
            }
          }

          if (timeController.mode !== 'pause' && timeController.mode !== 'realtime') {
            timeController.anchorJd = (viz && typeof viz.getJd === 'function') ? viz.getJd() : toJd(now);
            timeController.lastWallMs = Date.now();
          }

          document.getElementById('t-realtime').classList.toggle('on', mode === 'realtime');
          document.getElementById('t-pause').classList.toggle('on', mode === 'pause');
          syncSimulationTime();
        }

        function applySpeed(daysPerSec) {
          if (!viz) return;
          currentMode = 'slider';
          timeController.mode = 'slider';
          timeController.speedDaysPerSecond = daysPerSec;
          timeController.anchorJd = (typeof viz.getJd === 'function') ? viz.getJd() : toJd(new Date());
          timeController.lastWallMs = Date.now();
          document.getElementById('t-realtime').classList.remove('on');
          document.getElementById('t-pause').classList.remove('on');
          try {
            if (viz.setJdPerSecond) viz.setJdPerSecond(daysPerSec);
          } catch (e) {}
          syncSimulationTime();
        }

        function fmtDays(dps) {
          if (dps >= 36525) return '每秒' + (dps / 36525).toFixed(1) + '世纪';
          if (dps >= 365.25) return '每秒' + (dps / 365.25).toFixed(1) + '年';
          if (dps >= 1) return '每秒' + (dps >= 30 ? Math.round(dps) : dps.toFixed(1)) + '天';
          var h = dps * 24;
          if (h >= 1) return '每秒' + (h >= 30 ? Math.round(h) : h.toFixed(1)) + '小时';
          var m = h * 60;
          if (m >= 1) return '每秒' + (m >= 30 ? Math.round(m) : m.toFixed(1)) + '分钟';
          return '每秒' + (m * 60).toFixed(1) + '秒';
        }

        try {
          var slider = document.getElementById('t-slider');
          if (slider) {
            slider.addEventListener('input', function() {
              var v = parseFloat(slider.value);
              if (v <= 0) { setTimeMode('realtime'); return; }
              var dps = Math.pow(10000, v / 100);
              document.getElementById('t-val').textContent = fmtDays(dps);
              applySpeed(dps);
            });
          }
          var rb = document.getElementById('t-realtime');
          if (rb) rb.addEventListener('click', function() { setTimeMode('realtime'); });
          var pb = document.getElementById('t-pause');
          if (pb) pb.addEventListener('click', function() { setTimeMode('pause'); });

          // 默认实时：以当前真实时间为锚点，不再回到初始化默认位置
          timeController.anchorJd = toJd(new Date());
          timeController.lastWallMs = Date.now();
          setTimeMode('realtime');

          // 使用逐帧循环（requestAnimationFrame）持续同步仿真时间并更新场景。
          // 这样 viz 能连续接收 JD / 速度信息，带 ephem 的物体（如月球）会随仿真时间正常运动。
          // 快速视觉日夜修正：对地球进行视觉对齐，使纹理的“正午”面朝向太阳（仅视觉，不改变历表）。
          var usePreciseEarthRotation = true; // 切换为精确 GMST 自转实现
          var visualEarthDayNightFixEnabled = !usePreciseEarthRotation;
          var visualEarthRotationOffsetDeg = 0; // 若纹理经线有偏差，可在此调整
          var usePreciseMoonRotation = true; // 是否启用精确的月球朝向（基于时间锚定）

          // 精确地球自转：使用 sim JD -> GMST 计算地球自转角度，并保持倾角
          function applyPreciseEarthRotation(simJd) {
            if (!usePreciseEarthRotation) return;
            try {
              var earthObj = objects.earth;
              if (!earthObj) return;
              var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
              if (!earthMesh) return;

              var gmst = jdToGMST(simJd); // radians
              var obliquity = THREE.MathUtils.degToRad(23.4392911);

              // 物理正确的合成顺序: 先绕地轴(Z)自转 GMST,再整体绕 +X 倾斜 -ε(黄赤交角)。
              // 倾角在外层 → 地轴指向在空间中固定(北黄极附近),不会随自转每天扫一圈;
              // 且赤道→黄道必须用 -ε 旋转(Sun RA 90°/Dec +23.44° ↔ 黄经 90°/黄纬 0° 可互相验证)。
              // 2026-08-16 前为 Rz(spin)*Rx(+ε),太阳直射点错到 147°W(太平洋),且地轴每日进动。
              var spinAngle = gmst + THREE.MathUtils.degToRad(visualEarthRotationOffsetDeg);
              var qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), spinAngle);
              var qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -obliquity);

              // apply spin then tilt (q = qTilt * qSpin)
              var q = qTilt.multiply(qSpin);
              earthMesh.quaternion.copy(q);
            } catch (e) {
              // ignore
            }
          }

          // 精确月球朝向：基于月球与地球在 simJd 的位置，设置月球朝向使近地面朝向地球（潮汐锁定），并保留月球小倾角
          function applyPreciseMoonRotation(simJd) {
            if (!usePreciseMoonRotation) return;
            try {
              var moonObj = objects.moon;
              var earthObj = objects.earth;
              if (!moonObj || !earthObj) return;
              var moonMesh = moonObj.get3jsObjects && moonObj.get3jsObjects()[0];
              if (!moonMesh) return;

              var mp = null, ep = null;
              try { if (typeof moonObj.getPosition === 'function') mp = moonObj.getPosition(simJd); } catch (e) {}
              try { if (typeof earthObj.getPosition === 'function') ep = earthObj.getPosition(simJd); } catch (e) {}

              var moonPos = new THREE.Vector3();
              var earthPos = new THREE.Vector3();
              if (mp && mp.length >= 3 && ep && ep.length >= 3) {
                moonPos.set(mp[0], mp[1], mp[2]);
                earthPos.set(ep[0], ep[1], ep[2]);
              } else {
                try { moonMesh.getWorldPosition(moonPos); } catch (e) { return; }
                var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
                if (!earthMesh) return;
                try { earthMesh.getWorldPosition(earthPos); } catch (e) { return; }
              }

              var v_me = new THREE.Vector3().subVectors(earthPos, moonPos).normalize();

              // moon texture/noon axis — assume +Z points to sub-earth point on texture
              var textureNoon = new THREE.Vector3(0, 0, 1);
              var qLook = new THREE.Quaternion().setFromUnitVectors(textureNoon.clone().normalize(), v_me);

              // small lunar obliquity (~1.5424°)
              var moonObliquity = THREE.MathUtils.degToRad(1.5424);
              var qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), moonObliquity);

              var q = qLook.multiply(qTilt);
              moonMesh.quaternion.copy(q);
            } catch (e) {
              // ignore
            }
          }

          function applyQuickEarthDayNightFix() {
            if (!visualEarthDayNightFixEnabled) return;
            try {
              var earthObj = objects.earth;
              var sunObj = objects.sun;
              if (!earthObj || !sunObj) return;
              var earthMesh = earthObj.get3jsObjects && earthObj.get3jsObjects()[0];
              var sunMesh = sunObj.get3jsObjects && sunObj.get3jsObjects()[0];
              if (!earthMesh || !sunMesh) return;

              var ePos = new THREE.Vector3();
              var sPos = new THREE.Vector3();
              earthMesh.getWorldPosition(ePos);
              sunMesh.getWorldPosition(sPos);

              var sunDir = new THREE.Vector3().subVectors(sPos, ePos).normalize();

              // 本地纹理上的“正午”轴 — 若你的纹理正午不在 +Z，请改为 (1,0,0) 或 (0,0,-1)
              var textureNoon = new THREE.Vector3(0, 0, 1);

              var q = new THREE.Quaternion().setFromUnitVectors(textureNoon.clone().normalize(), sunDir.clone().normalize());

              if (visualEarthRotationOffsetDeg) {
                var rz = THREE.MathUtils.degToRad(visualEarthRotationOffsetDeg);
                var qoff = new THREE.Quaternion();
                qoff.setFromAxisAngle(new THREE.Vector3(0, 0, 1), rz);
                q.multiply(qoff);
              }

              // 视觉覆盖：直接写入四元数以对齐昼夜（非物理修改）
              earthMesh.quaternion.copy(q);
            } catch (e) {
              // 忽略视觉修正错误
            }
          }

          function tick() {
            try { syncSimulationTime(); } catch (e) {}
            try { updateMoonOrbit(); } catch (e) {}
            try { stepSelfRotation(); } catch (e) {}
            try {
              var simJd = null;
              try { if (typeof viz.getJd === 'function') simJd = viz.getJd(); } catch (e) {}
              if (simJd === null || simJd === undefined) simJd = toJd(new Date());
              try { applyPreciseEarthRotation(simJd); } catch (e) {}
              try { applyPreciseMoonRotation(simJd); } catch (e) {}
            } catch (e) {}
            try { if (visualEarthDayNightFixEnabled) applyQuickEarthDayNightFix(); } catch (e) {}
            try { updateTimeDate(); } catch (e) {}
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);

        } catch (e) {}

      } catch (err) {
        console.error('交互失败:', err);
      }
    }

    setTimeout(iface, 500);
  </script>
  <script>
    // 移动端：时间控制面板开合（不改动上方 3D 逻辑）
    (function () {
      var t = document.getElementById('time-toggle');
      var c = document.getElementById('time-ctl');
      if (t && c) {
        t.addEventListener('click', function (e) {
          e.stopPropagation();
          c.classList.toggle('open');
        });
        document.addEventListener('click', function (e) {
          if (window.innerWidth <= 768 && c.classList.contains('open')) {
            if (!c.contains(e.target) && e.target !== t) c.classList.remove('open');
          }
        });
      }
    })();
  </script>
