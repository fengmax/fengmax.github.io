<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D宇宙沙盒 · 真实行星 / 月球 / 星空</title>
    <style>
        :root {
            --bg: #020210;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(8, 10, 24, 0.72);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.3) 75%,
                    rgba(0, 0, 0, 0.6) 100%);
        }

        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            transition: all 0.4s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.7rem;
            text-align: center;
        }

        #info-panel {
            left: 1.5rem;
            bottom: 2rem;
            width: 280px;
            min-height: 120px;
            cursor: default;
        }
        #info-panel .body-name {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        #info-panel .body-detail {
            font-size: 0.65rem;
            color: var(--text-faint);
            line-height: 1.6;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }
        #info-panel .body-stats {
            border-top: 1px solid var(--hairline);
            padding-top: 0.6rem;
            font-size: 0.62rem;
            color: var(--text-secondary);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem 1rem;
            letter-spacing: 0.06em;
        }
        #info-panel .body-stats .stat-item {
            display: flex;
            flex-direction: column;
        }
        #info-panel .body-stats .stat-label {
            color: var(--text-faint);
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #info-panel .body-stats .stat-value {
            font-family: var(--font-serif);
            color: rgba(200, 220, 255, 0.9);
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
        }
        #info-panel .hint-click {
            font-size: 0.55rem;
            color: var(--text-faint);
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        .hint-bar {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 0.58rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            backdrop-filter: blur(4px);
        }

        /* ---------- 时间控制面板 ---------- */
        #time-panel {
            top: 3.4rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            white-space: nowrap;
        }
        #time-panel .time-date {
            font-family: var(--font-serif);
            font-size: 0.72rem;
            color: rgba(200, 220, 255, 0.9);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.08em;
        }
        #time-panel .time-label {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        .time-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .speed-btn {
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--text-secondary);
            font-size: 0.58rem;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.6rem;
            border-radius: 14px;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.25s ease;
        }
        .speed-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .speed-btn.active {
            background: rgba(140, 180, 255, 0.18);
            border-color: rgba(160, 200, 255, 0.5);
            color: rgba(220, 235, 255, 1);
            box-shadow: 0 0 12px rgba(140, 180, 255, 0.15);
        }

        @media (max-width: 768px) {
            .panel {
                font-size: 0.62rem;
                padding: 0.7rem;
            }
            #info-panel {
                left: 0.6rem;
                bottom: 1.2rem;
                width: 200px;
            }
            #info-panel .body-stats {
                grid-template-columns: 1fr;
            }
            .hint-bar {
                font-size: 0.5rem;
                letter-spacing: 0.25em;
            }
            #time-panel {
                top: 3rem;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem;
                max-width: 94vw;
            }
            #time-panel .time-date {
                font-size: 0.6rem;
            }
            .speed-btn {
                padding: 0.25rem 0.45rem;
                font-size: 0.52rem;
            }
        }
        @media (max-width: 480px) {
            #info-panel {
                display: none;
            }
            .hint-bar {
                font-size: 0.45rem;
                letter-spacing: 0.2em;
                top: 0.6rem;
            }
            #time-panel {
                top: 2.4rem;
                padding: 0.35rem 0.6rem;
                gap: 0.3rem;
            }
            #time-panel .time-date {
                font-size: 0.55rem;
            }
            #time-panel .time-label {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="hint-bar">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击天体</div>

    <div class="panel" id="time-panel">
        <span class="time-label">模拟时间</span>
        <span class="time-date" id="sim-date">--</span>
        <div class="time-controls">
            <button class="speed-btn" data-mode="real">实时</button>
            <button class="speed-btn" data-mode="pause">暂停</button>
            <button class="speed-btn" data-mode="speed" data-days="1">1天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="10">10天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="30">30天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="365">1年/秒</button>
        </div>
    </div>

    <div class="panel" id="info-panel">
        <div class="body-name" id="body-name">太阳系</div>
        <div class="body-detail" id="body-detail">点击任意行星查看详细信息</div>
        <div class="body-stats" id="body-stats"></div>
        <div class="hint-click">✦ 点击天体交互 ✦</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- 常量 ----------
        const AU_KM = 149597870.7; // 1天文单位 = 公里
        const AU_SCALE = 10; // 场景单位：1 AU = 10 单位

        // 视觉放大因子（真实比例在太阳系尺度下不可见）：
        // 月球轨道实际约 0.026 场景单位，几乎贴着地球表面。为了可见性放大，
        // 但信息面板仍显示真实数据。
        const MOON_ORBIT_SCENE = 1.6;     // 月球轨道"可见半径"（场景单位）

        // ---------- 视角焦点状态 ----------
        let selectedObject = null;           // 当前选中的天体（视角围绕它旋转/平移）
        const tmpTarget = new THREE.Vector3(); // 临时向量
        let focusAnim = null;                // 平滑聚焦动画状态

        // ---------- 初始化场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);

        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(70, 45, 95);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 5;
        controls.maxDistance = 500;
        controls.maxPolarAngle = Math.PI;
        controls.target.set(0, 0, 0);
        controls.update();

        // 用户手动操作视角时，取消平滑聚焦动画
        controls.addEventListener('start', () => { focusAnim = null; });

        // ---------- 光照 ----------
        const ambientLight = new THREE.AmbientLight(0x111122, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5e6, 3.0, 200, 1);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899cc, 0.4);
        fillLight.position.set(10, 15, 10);
        scene.add(fillLight);

        // ---------- 星空背景粒子 ----------
        function createStarfield() {
            const starCount = 12000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 400 + Math.random() * 200;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const temp = Math.random();
                if (temp > 0.7) {
                    colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.8;
                } else if (temp > 0.3) {
                    colors[i * 3] = 0.85; colors[i * 3 + 1] = 0.88; colors[i * 3 + 2] = 0.95;
                } else {
                    colors[i * 3] = 0.7; colors[i * 3 + 1] = 0.75; colors[i * 3 + 2] = 0.9;
                }
                sizes[i] = Math.random() * 2.0 + 0.5;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            return stars;
        }
        const starField = createStarfield();

        // ---------- 太阳 ----------
        function createSun() {
            const sunGeo = new THREE.SphereGeometry(2.2, 64, 64);
            const sunTex = createSunTexture();
            // 太阳自发光：用 MeshBasicMaterial 直接显示亮黄表面纹理，
            // 不依赖点光源照亮，避免在光源处算光照导致的黑面/黑框。
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTex });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.castShadow = false;
            sunMesh.userData = { name: '太阳', detail: 'G型主序星 · 太阳系中心恒星', type: 'star' };
            scene.add(sunMesh);

            const glowTexture = createGlowTexture();
            // 两层柔和光晕。关键：depthWrite:false —— 否则这些大 Sprite 的
            // 透明区域会把深度写进缓冲，把身后更远的星空背景遮挡成“大黑框”。
            const layers = [
                { scale: 5.4, opacity: 0.55, color: 0xffe0a0 },
                { scale: 9.0, opacity: 0.24, color: 0xffaa55 },
            ];
            for (const layer of layers) {
                const spriteMat = new THREE.SpriteMaterial({
                    map: glowTexture,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false,
                    depthTest: true,
                    opacity: layer.opacity,
                    color: new THREE.Color(layer.color),
                });
                const sprite = new THREE.Sprite(spriteMat);
                const baseScale = layer.scale;
                sprite.userData = { isGlow: true, baseScale: baseScale };
                sprite.scale.set(baseScale, baseScale, 1);
                sunMesh.add(sprite);
            }
            return sunMesh;
        }

        function createGlowTexture() {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 232, 176, 0.55)');
            gradient.addColorStop(0.55, 'rgba(255, 170, 80, 0.18)');
            gradient.addColorStop(0.85, 'rgba(255, 120, 40, 0.05)');
            gradient.addColorStop(1, 'rgba(255, 120, 40, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const sun = createSun();

        // ---------- 程序化纹理生成（基于分形噪声）----------
        function mulberry32(a) {
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // 2D 值噪声 + 分形布朗运动（fbm），用固定种子保证同一颗星每次加载纹理一致
        function makeNoise2D(seed) {
            const rand = mulberry32(seed);
            const base = [];
            for (let i = 0; i < 256; i++) base[i] = i;
            for (let i = 255; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const t = base[i]; base[i] = base[j]; base[j] = t;
            }
            const perm = new Uint8Array(512);
            for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
            const grad = (h, x, y) => {
                switch (h & 3) {
                    case 0: return x + y;
                    case 1: return -x + y;
                    case 2: return x - y;
                    default: return -x - y;
                }
            };
            const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
            function noise(x, y) {
                const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
                const xf = x - Math.floor(x), yf = y - Math.floor(y);
                const u = fade(xf), v = fade(yf);
                const a = perm[xi] + yi, b = perm[xi + 1] + yi;
                const n00 = grad(perm[a], xf, yf);
                const n10 = grad(perm[b], xf - 1, yf);
                const n01 = grad(perm[a + 1], xf, yf - 1);
                const n11 = grad(perm[b + 1], xf - 1, yf - 1);
                return (n00 * (1 - u) + n10 * u) * (1 - v) + (n01 * (1 - u) + n11 * u) * v;
            }
            function fbm(x, y, oct, lacunarity, gain) {
                lacunarity = lacunarity || 2; gain = gain || 0.5;
                let amp = 0.5, freq = 1, sum = 0, norm = 0;
                for (let i = 0; i < oct; i++) {
                    sum += noise(x * freq, y * freq) * amp;
                    norm += amp; amp *= gain; freq *= lacunarity;
                }
                return sum / norm;
            }
            return { noise, fbm };
        }

        function mix3(a, b, t) {
            return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t,
            ];
        }

        // 生成程序化纹理：pixelFn 填充 RGBA 像素数组
        function proceduralTexture(width, height, pixelFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(width, height);
            pixelFn(img.data, width, height);
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // 太阳表面：亮黄白 + 米粒组织（高频噪声）+ 黑子
        function createSunTexture() {
            const W = 512, H = 256;
            const n = makeNoise2D(7);
            const spots = [];
            const rng = mulberry32(701);
            for (let i = 0; i < 24; i++) {
                spots.push({ x: rng() * W, y: rng() * H, r: rng() * W * 0.03 + 3, k: rng() * 0.35 + 0.3 });
            }
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        const g = n.fbm(x / w * 26, y / h * 13, 5);
                        const t = g * 0.5 + 0.5;
                        let r = 255, gg = 205 + t * 50, b = 130 + t * 110;
                        for (const s of spots) {
                            const dx = x - s.x, dy = y - s.y, rr = s.r * s.r;
                            if (dx * dx + dy * dy < rr) {
                                const m = 1 - s.k * 0.3;
                                r *= m; gg *= m; b *= m;
                            }
                        }
                        d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
                    }
                }
            });
        }

        function createPlanetTexture(name) {
            const W = 640, H = 320;
            switch (name) {
                case '水星': return mercuryTexture(W, H);
                case '金星': return venusTexture(W, H);
                case '地球': return earthTexture(W, H);
                case '火星': return marsTexture(W, H);
                case '木星': return jupiterTexture(W, H);
                case '土星': return saturnTexture(W, H);
                case '天王星': return uranusTexture(W, H);
                case '海王星': return neptuneTexture(W, H);
                case '月球': return moonTexture(W, H);
                default: return proceduralTexture(W, H, (d, w, h) => {
                    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        d[i] = 150; d[i + 1] = 150; d[i + 2] = 150; d[i + 3] = 255;
                    }
                });
            }
        }

        // 水星：灰褐 + 密布陨石坑
        function mercuryTexture(W, H) {
            const n = makeNoise2D(21);
            const craters = [];
            const rng = mulberry32(221);
            for (let i = 0; i < 150; i++) {
                craters.push({ x: rng() * W, y: rng() * H, r: rng() * W * 0.014 + 1.5 });
            }
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const v = n.fbm(x / w * 8, y / h * 4, 4);
                    let base = 96 + v * 44;
                    for (const c of craters) {
                        const dx = x - c.x, dy = y - c.y, dd = dx * dx + dy * dy, rr = c.r * c.r;
                        if (dd < rr) base *= 0.6;
                    }
                    d[i] = base; d[i + 1] = base * 0.97; d[i + 2] = base * 1.03; d[i + 3] = 255;
                }
            });
        }

        // 金星：奶油黄 + 模糊云带
        function venusTexture(W, H) {
            const n = makeNoise2D(31);
            const base = [226, 192, 124];
            const bright = [255, 226, 162];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const v = n.fbm(x / w * 5 + y / h * 2, y / h * 3, 3);
                    const band = Math.sin(y / h * Math.PI * 5) * 0.06;
                    const c = mix3(base, bright, v * 0.5 + 0.25 + band);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 地球：海洋/大陆 + 极地冰盖 + 云层
        function earthTexture(W, H) {
            const nLand = makeNoise2D(41);
            const nTer = makeNoise2D(42);
            const nCl = makeNoise2D(43);
            const ocean = [24, 60, 128];
            const shallow = [34, 100, 180];
            const landDark = [34, 96, 50];
            const landLight = [150, 130, 80];
            const snow = [240, 244, 248];
            const cloud = [255, 255, 255];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const lat = (y / h - 0.5) * Math.PI;
                    const u = x / w * 2, v = y / h;
                    const land = nLand.fbm(u * 2.2 + 1.3, v * 1.15, 5);
                    const terr = nTer.fbm(u * 3.0, v * 1.5, 3);
                    let c;
                    if (land > 0.5) {
                        const t = Math.max(0, Math.min(1, (land - 0.5) * 3.2 + (terr - 0.5) * 0.8));
                        c = mix3(landDark, landLight, t);
                    } else {
                        const dep = (0.5 - land) * 3;
                        c = mix3(ocean, shallow, Math.min(1, dep));
                    }
                    const pole = Math.max(0, Math.abs(lat) - 1.05);
                    if (pole > 0) c = mix3(c, snow, Math.min(1, pole * 6));
                    const cl = nCl.fbm(u * 3.5, v * 1.8, 4);
                    if (cl > 0.62) c = mix3(c, cloud, Math.min(0.85, (cl - 0.62) * 2.5));
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 火星：红色表面 + 暗斑 + 极冠
        function marsTexture(W, H) {
            const n = makeNoise2D(51);
            const n2 = makeNoise2D(52);
            const red = [194, 90, 40];
            const dark = [120, 55, 30];
            const light = [226, 152, 98];
            const cap = [246, 240, 236];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const lat = (y / h - 0.5) * Math.PI;
                    const u = x / w * 2, v = y / h;
                    const vv = n.fbm(u * 2.6, v * 1.3, 4);
                    const dd = n2.fbm(u * 4 + 5, v * 2, 3);
                    let c = mix3(dark, red, vv * 0.6 + 0.3);
                    if (dd > 0.55) c = mix3(c, light, Math.min(0.6, (dd - 0.55) * 2));
                    const pole = Math.max(0, Math.abs(lat) - 1.15);
                    if (pole > 0) c = mix3(c, cap, Math.min(1, pole * 8));
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 木星：横向云带 + 湍流 + 大红斑
        function jupiterTexture(W, H) {
            const n = makeNoise2D(61);
            const bandCols = [
                [216, 172, 124], [196, 144, 100], [232, 198, 152],
                [176, 122, 84], [240, 210, 168], [188, 138, 92],
            ];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const bandPos = v * 12;
                    const bandIdx = Math.floor(bandPos) % bandCols.length;
                    const turb = n.fbm(u * 3 + Math.sin(bandPos) * 0.5, v * 6, 3);
                    let c = mix3(bandCols[bandIdx], bandCols[(bandIdx + 2) % bandCols.length], turb * 0.5 + 0.2);
                    const gx = (x - W * 0.72) / (W * 0.09);
                    const gy = (y - H * 0.62) / (H * 0.05);
                    if (gx * gx + gy * gy < 1) {
                        const e = 1 - (gx * gx + gy * gy);
                        c = mix3(c, [198, 76, 50], e * 0.9);
                    }
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 土星：柔和云带
        function saturnTexture(W, H) {
            const n = makeNoise2D(71);
            const a = [228, 208, 168];
            const b = [196, 168, 128];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 8) * 0.5 + 0.5;
                    const turb = n.fbm(u * 2.5, v * 5, 3) * 0.5 + 0.5;
                    const c = mix3(b, a, band * 0.6 + turb * 0.3);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 天王星：淡青 + 微弱带
        function uranusTexture(W, H) {
            const n = makeNoise2D(81);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 4) * 0.5 + 0.5;
                    const t = n.fbm(u * 2, v * 3, 3) * 0.5 + 0.5;
                    const c = mix3([112, 192, 200], [150, 224, 226], band * 0.4 + t * 0.3);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 海王星：深蓝 + 亮云带 + 大暗斑
        function neptuneTexture(W, H) {
            const n = makeNoise2D(91);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 7) * 0.5 + 0.5;
                    const t = n.fbm(u * 2.5, v * 4, 3) * 0.5 + 0.5;
                    let c = mix3([34, 58, 150], [66, 110, 222], band * 0.5 + t * 0.25);
                    const gx = (x - W * 0.55) / (W * 0.1);
                    const gy = (y - H * 0.6) / (H * 0.06);
                    if (gx * gx + gy * gy < 1) {
                        const e = 1 - (gx * gx + gy * gy);
                        c = mix3(c, [20, 30, 90], e * 0.8);
                    }
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 月球：灰 + 陨石坑
        function moonTexture(W, H) {
            const n = makeNoise2D(101);
            const craters = [];
            const rng = mulberry32(333);
            for (let i = 0; i < 140; i++) {
                craters.push({ x: rng() * W, y: rng() * H, r: rng() * W * 0.02 + 1.5 });
            }
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const v = n.fbm(x / w * 6, y / h * 3, 4);
                    let base = 150 + v * 34;
                    for (const c of craters) {
                        const dx = x - c.x, dy = y - c.y, dd = dx * dx + dy * dy, rr = c.r * c.r;
                        if (dd < rr) base *= 0.55;
                    }
                    d[i] = base; d[i + 1] = base; d[i + 2] = base * 1.01; d[i + 3] = 255;
                }
            });
        }

        // ---------- 行星配置（含公转周期）----------
        const planetConfigs = [
            { name: '水星', body: Astronomy.Body.Mercury, color: 0x8c8c8c, radius: 0.35, orbitAU: 0.39, detail: '最小的行星 · 表面布满陨石坑', periodDays: 87.97, texture: () => createPlanetTexture('水星') },
            { name: '金星', body: Astronomy.Body.Venus, color: 0xe6c87a, radius: 0.55, orbitAU: 0.72, detail: '最亮的行星 · 浓厚二氧化碳大气', periodDays: 224.7, texture: () => createPlanetTexture('金星') },
            { name: '地球', body: Astronomy.Body.Earth, color: 0x4a7eb5, radius: 0.58, orbitAU: 1.0, detail: '我们的家园 · 唯一已知存在生命的星球', periodDays: 365.25, texture: () => createPlanetTexture('地球') },
            { name: '火星', body: Astronomy.Body.Mars, color: 0xc1440e, radius: 0.42, orbitAU: 1.52, detail: '红色星球 · 拥有太阳系最高的火山', periodDays: 686.98, texture: () => createPlanetTexture('火星') },
            { name: '木星', body: Astronomy.Body.Jupiter, color: 0xd8a27a, radius: 1.4, orbitAU: 5.2, detail: '气态巨行星 · 太阳系最大的行星', periodDays: 4332.59, texture: () => createPlanetTexture('木星') },
            { name: '土星', body: Astronomy.Body.Saturn, color: 0xead6a6, radius: 1.15, orbitAU: 9.58, detail: '壮丽的光环 · 密度低于水', periodDays: 10759.22, texture: () => createPlanetTexture('土星') },
            { name: '天王星', body: Astronomy.Body.Uranus, color: 0x6fd4d4, radius: 0.8, orbitAU: 19.2, detail: '冰巨星 · 自转轴倾斜97.77°', periodDays: 30688.5, texture: () => createPlanetTexture('天王星') },
            { name: '海王星', body: Astronomy.Body.Neptune, color: 0x4166f5, radius: 0.8, orbitAU: 30.1, detail: '最远的行星 · 风速可达2100km/h', periodDays: 60182.0, texture: () => createPlanetTexture('海王星') },
        ];

        const planetMeshes = [];
        const orbitLines = [];
        const planetLabels = [];

        // ---------- 真实椭圆轨道线 ----------
        // 用 HelioVector 在“一个完整轨道周期”的时间窗口内采样真实位置，
        // 画出的就是行星的真实椭圆轨道（而非示意正圆），与行星当前位置完全自洽。
        function createOrbitLine(config) {
            const segments = 512;
            const periodMs = config.periodDays * 86400000;
            const halfPeriodMs = periodMs / 2;
            const center = new Date(); // 以当前真实时间为采样中心
            const points = [];
            for (let i = 0; i < segments; i++) {
                const t = new Date(center.getTime() - halfPeriodMs + (i / segments) * periodMs);
                let vec;
                try {
                    vec = Astronomy.HelioVector(config.body, t);
                } catch (e) {
                    vec = { x: 0, y: 0, z: 0 };
                }
                points.push(new THREE.Vector3(vec.x * AU_SCALE, vec.y * AU_SCALE, vec.z * AU_SCALE));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: config.color,
                transparent: true,
                opacity: 0.22,
                depthWrite: false,
            });
            const line = new THREE.LineLoop(geometry, material);
            scene.add(line);
            orbitLines.push(line);
            return line;
        }

        function createPlanet(config) {
            // 不绘制地球自身的轨道环（月球轨道环已随地球显示）
            if (config.name !== '地球') {
                createOrbitLine(config);
            }

            const geo = new THREE.SphereGeometry(config.radius, 64, 64);
            const texture = config.texture();
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.7,
                metalness: 0.1,
                emissive: new THREE.Color(config.color).multiplyScalar(0.1),
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                name: config.name,
                detail: config.detail,
                type: 'planet',
                body: config.body,
                orbitAU: config.orbitAU,
                periodDays: config.periodDays,
            };
            scene.add(mesh);
            planetMeshes.push(mesh);

            if (config.name === '土星') {
                const ringGeo = new THREE.TorusGeometry(config.radius * 1.6, 0.12, 16, 200);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xd4c09a,
                    roughness: 0.6,
                    metalness: 0.0,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                ring.userData = { isRing: true };
                mesh.add(ring);

                const ring2Geo = new THREE.TorusGeometry(config.radius * 1.9, 0.06, 16, 200);
                const ring2 = new THREE.Mesh(ring2Geo, ringMat.clone());
                ring2.material.opacity = 0.4;
                ring2.rotation.x = Math.PI / 2.5;
                ring2.userData = { isRing: true };
                mesh.add(ring2);
            }

            const labelDiv = document.createElement('div');
            labelDiv.textContent = config.name;
            labelDiv.style.color = 'rgba(255,255,255,0.7)';
            labelDiv.style.fontSize = '11px';
            labelDiv.style.letterSpacing = '0.1em';
            labelDiv.style.fontFamily = "'Georgia', serif";
            labelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, config.radius + 0.6, 0);
            mesh.add(label);
            planetLabels.push(label);

            return mesh;
        }

        planetConfigs.forEach(config => createPlanet(config));

        // ---------- 月球 ----------
        function createMoon() {
            const geo = new THREE.SphereGeometry(0.18, 32, 32);
            const texture = createPlanetTexture('月球');
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.9,
                metalness: 0.0,
            });
            const moon = new THREE.Mesh(geo, mat);
            moon.castShadow = true;
            moon.receiveShadow = true;
            moon.userData = {
                name: '月球',
                detail: '地球唯一的天然卫星',
                type: 'moon',
                periodDays: 27.32,
            };

            // 月球文字标注（原版本遗漏）
            const moonLabelDiv = document.createElement('div');
            moonLabelDiv.textContent = '月球';
            moonLabelDiv.style.color = 'rgba(255,255,255,0.7)';
            moonLabelDiv.style.fontSize = '11px';
            moonLabelDiv.style.letterSpacing = '0.1em';
            moonLabelDiv.style.fontFamily = "'Georgia', serif";
            moonLabelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
            moonLabelDiv.style.pointerEvents = 'none';
            const moonLabel = new CSS2DObject(moonLabelDiv);
            moonLabel.position.set(0, 0.4, 0);
            moon.add(moonLabel);

            scene.add(moon);
            return moon;
        }
        const moon = createMoon();
        let moonParent = planetMeshes.find(m => m.userData.name === '地球');

        // 月球轨道环（视觉放大半径，跟随地球）
        function createMoonOrbitRing() {
            const segments = 128;
            const points = [];
            for (let i = 0; i < segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(a) * MOON_ORBIT_SCENE, 0, Math.sin(a) * MOON_ORBIT_SCENE));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0xaaaaaa,
                transparent: true,
                opacity: 0.2,
                depthWrite: false,
            });
            return new THREE.LineLoop(geometry, material);
        }
        if (moonParent) {
            moonParent.add(createMoonOrbitRing());
        }

        // ---------- 点击交互 & 信息计算 ----------
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const targets = [...planetMeshes, moon];
            return raycaster.intersectObjects(targets, true);
        }

        function formatDistanceAU(au) {
            return `${au.toFixed(2)} AU`;
        }
        function formatDistanceKM(km) {
            if (km >= 1e6) return `${(km / 1e6).toFixed(2)}M km`;
            if (km >= 1e3) return `${(km / 1e3).toFixed(2)}k km`;
            return `${km.toFixed(0)} km`;
        }

        function computeHelioSpeed(body, now, deltaSeconds = 3600) {
            const vec1 = Astronomy.HelioVector(body, now);
            const vec2 = Astronomy.HelioVector(body, new Date(now.getTime() + deltaSeconds * 1000));
            const dx = (vec2.x - vec1.x) * AU_KM;
            const dy = (vec2.y - vec1.y) * AU_KM;
            const dz = (vec2.z - vec1.z) * AU_KM;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            return dist / deltaSeconds; // km/s
        }

        function updateInfoPanel(hitObject) {
            const nameEl = document.getElementById('body-name');
            const detailEl = document.getElementById('body-detail');
            const statsEl = document.getElementById('body-stats');

            if (!hitObject || !hitObject.userData || !hitObject.userData.name) {
                nameEl.textContent = '太阳系';
                detailEl.textContent = '点击任意行星查看详细信息';
                statsEl.innerHTML = '';
                return;
            }

            const ud = hitObject.userData;
            nameEl.textContent = ud.name;
            detailEl.textContent = ud.detail || '';

            const now = simTime; // 用模拟时间，跟随时间加速/暂停
            const earthVec = Astronomy.HelioVector(Astronomy.Body.Earth, now);

            let distanceToSunAU = 0;
            let distanceToEarthAU = 0;
            let speedKmS = 0;
            let periodDisplay = '--';

            if (ud.type === 'star') {
                distanceToSunAU = 0;
                distanceToEarthAU = Math.sqrt(earthVec.x*earthVec.x + earthVec.y*earthVec.y + earthVec.z*earthVec.z);
                periodDisplay = '--';
                speedKmS = 0;
            } else if (ud.type === 'planet') {
                const vec = Astronomy.HelioVector(ud.body, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(ud.body, now);
                if (ud.periodDays) {
                    periodDisplay = ud.periodDays >= 365 ? `${(ud.periodDays/365.25).toFixed(1)} 年` : `${ud.periodDays.toFixed(1)} 天`;
                }
            } else if (ud.type === 'moon') {
                const vec = Astronomy.HelioVector(Astronomy.Body.Moon, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(Astronomy.Body.Moon, now);
                if (ud.periodDays) periodDisplay = `${ud.periodDays.toFixed(1)} 天`;
            }

            const distSunKM = distanceToSunAU * AU_KM;
            const distEarthKM = distanceToEarthAU * AU_KM;

            statsEl.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">距太阳</span>
                    <span class="stat-value">${formatDistanceAU(distanceToSunAU)}</span>
                    <span class="stat-value" style="font-size:0.55rem;color:var(--text-faint)">${formatDistanceKM(distSunKM)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">距地球</span>
                    <span class="stat-value">${formatDistanceAU(distanceToEarthAU)}</span>
                    <span class="stat-value" style="font-size:0.55rem;color:var(--text-faint)">${formatDistanceKM(distEarthKM)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">公转周期</span>
                    <span class="stat-value">${periodDisplay}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">速度</span>
                    <span class="stat-value">${speedKmS.toFixed(2)} km/s</span>
                </div>
            `;
        }

        // 平滑地把视角中心移到指定天体，保持当前缩放距离
        function focusOn(obj) {
            if (!obj || typeof obj.getWorldPosition !== 'function') return;
            obj.getWorldPosition(tmpTarget);
            const dir = camera.position.clone().sub(controls.target);
            if (dir.lengthSq() === 0) dir.set(0, 0, 1);
            const dist = Math.max(camera.position.distanceTo(controls.target), 3);
            focusAnim = {
                start: performance.now(),
                dur: 700,
                fromCam: camera.position.clone(),
                fromTgt: controls.target.clone(),
                toCam: tmpTarget.clone().add(dir.normalize().multiplyScalar(dist)),
                toTgt: tmpTarget.clone(),
            };
        }

        renderer.domElement.addEventListener('click', (event) => {
            const intersects = getIntersects(event);
            if (intersects.length > 0) {
                let hitObject = null;
                for (const intersect of intersects) {
                    let obj = intersect.object;
                    while (obj) {
                        if (obj.userData && obj.userData.name && obj.userData.type !== 'glow') {
                            hitObject = obj;
                            break;
                        }
                        obj = obj.parent;
                    }
                    if (hitObject) break;
                }
                updateInfoPanel(hitObject);
                selectedObject = hitObject;
                focusOn(hitObject);
            } else {
                updateInfoPanel(null);
                selectedObject = null;
                focusAnim = null;
            }
        });

        renderer.domElement.addEventListener('mousemove', (event) => {
            const intersects = getIntersects(event);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        // ---------- 时间控制 ----------
        let simTime = new Date();          // 模拟时间
        let timeMode = 'real';             // 'real' 实时 | 'pause' 暂停 | 'speed' 加速
        let speedDaysPerSec = 1;           // 加速档位（天/秒）

        function setTimeMode(mode, days) {
            timeMode = mode;
            if (mode === 'speed') speedDaysPerSec = days;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                const isActive = btn.dataset.mode === mode &&
                    (mode !== 'speed' || parseFloat(btn.dataset.days) === days);
                btn.classList.toggle('active', isActive);
            });
        }

        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                if (mode === 'real') setTimeMode('real');
                else if (mode === 'pause') setTimeMode('pause');
                else setTimeMode('speed', parseFloat(btn.dataset.days));
            });
        });
        setTimeMode('real');

        function formatSimDate(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function updateTimeDisplay() {
            document.getElementById('sim-date').textContent = formatSimDate(simTime);
        }

        // ---------- 更新行星位置 ----------
        function updatePlanetPositions(simTime, dtSec) {
            if (!window.Astronomy) return;
            const now = simTime;

            // 自转速度：加速档位越高，自转也越快
            const spinFactor = timeMode === 'speed' ? Math.max(speedDaysPerSec, 1) : 1;

            for (const mesh of planetMeshes) {
                const body = mesh.userData.body;
                if (!body) continue;
                try {
                    const vec = Astronomy.HelioVector(body, now);
                    mesh.position.set(vec.x * AU_SCALE, vec.y * AU_SCALE, vec.z * AU_SCALE);
                    if (mesh.userData.name === '地球') {
                        moonParent = mesh;
                    }
                    mesh.rotation.y += dtSec * 0.2 * spinFactor;
                } catch (e) {
                    console.warn('计算行星位置失败', mesh.userData.name, e);
                }
            }

            // 月球位置（轨道距离用视觉放大值，黄道经纬度来自天文引擎）
            if (moonParent) {
                try {
                    const moonVec = Astronomy.EclipticGeoMoon(now);
                    const lat = moonVec.lat;
                    const lon = moonVec.lon;
                    const x = MOON_ORBIT_SCENE * Math.cos(lat) * Math.cos(lon);
                    const y = MOON_ORBIT_SCENE * Math.sin(lat);
                    const z = MOON_ORBIT_SCENE * Math.cos(lat) * Math.sin(lon);
                    moon.position.copy(moonParent.position).add(new THREE.Vector3(x, y, z));
                    moon.rotation.y += dtSec * 0.5 * spinFactor;
                } catch (e) {
                    console.warn('计算月球位置失败', e);
                }
            }
        }

        // ---------- 动画循环 ----------
        let lastFrameTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const nowMs = performance.now();
            const dtSec = Math.min((nowMs - lastFrameTime) / 1000, 0.5); // 防止切后台后 dt 过大
            lastFrameTime = nowMs;

            // 推进模拟时间
            if (timeMode === 'real') {
                simTime = new Date();
            } else if (timeMode === 'speed') {
                simTime = new Date(simTime.getTime() + dtSec * speedDaysPerSec * 86400000);
            }
            // 'pause'：时间静止

            updatePlanetPositions(simTime, dtSec);
            updateTimeDisplay();

            // 视角中心：选中天体则围绕它旋转/平移，否则围绕太阳（原点）
            if (selectedObject && typeof selectedObject.getWorldPosition === 'function') {
                if (focusAnim) {
                    // 平滑聚焦过渡（缓动）
                    const t = Math.min((performance.now() - focusAnim.start) / focusAnim.dur, 1);
                    const e = t * t * (3 - 2 * t);
                    camera.position.lerpVectors(focusAnim.fromCam, focusAnim.toCam, e);
                    controls.target.lerpVectors(focusAnim.fromTgt, focusAnim.toTgt, e);
                    if (t >= 1) focusAnim = null;
                } else {
                    // 天体在动（尤其加速模式），每帧跟随它，确保始终围绕该天体
                    selectedObject.getWorldPosition(controls.target);
                }
            } else {
                // 未选中任何天体：保持自由视角。不再强制把旋转/平移中心
                // 拉回太阳（否则右键平移会被立刻重置，感觉“默认锁定太阳”）。
                focusAnim = null;
            }

            starField.rotation.y += 0.0001;
            starField.rotation.x += 0.00003;

            sun.children.forEach(child => {
                if (child.isSprite && child.userData.isGlow) {
                    const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.05;
                    const s = child.userData.baseScale * pulse;
                    child.scale.set(s, s, 1);
                }
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- 窗口调整 ----------
        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }
        window.addEventListener('resize', onResize);

        // ---------- 启动 ----------
        animate();
        onResize();
        updatePlanetPositions(simTime, 0);

        console.log('🌌 3D宇宙沙盒已启动 (精确天体位置 + 时间控制 + 真实轨道线)');
        console.log('🖱️ 拖拽旋转 | 滚轮缩放 | 右键平移 | 点击天体');
        console.log('⏱️ 顶部面板可切换 实时 / 暂停 / 加速');
    </script>
</body>
</html>
