<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式宇宙 · 星空 / 行星 / ISS</title>
    <style>
        :root {
            --bg: #050510;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(10, 12, 28, 0.55);
            --panel-border: rgba(255, 255, 255, 0.08);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        body.dragging {
            cursor: grabbing;
        }

        /* 星空背景 Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* 交互由整个body处理 */
        }

        /* 暗角遮罩 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 30%,
                    rgba(0, 0, 0, 0.35) 70%,
                    rgba(0, 0, 0, 0.7) 100%);
        }

        /* 面板通用样式 */
        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.8rem;
            text-align: center;
        }

        /* 太阳系面板 (左下) */
        #solar-panel {
            left: 1.5rem;
            bottom: 2rem;
            width: 260px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
        }
        #solar-canvas {
            width: 100%;
            height: 220px;
            display: block;
            cursor: crosshair;
        }
        #solar-info {
            margin-top: 0.5rem;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--text-faint);
            min-height: 1.5em;
            text-align: center;
        }

        /* ISS 面板 (右下) */
        #iss-panel {
            right: 1.5rem;
            bottom: 2rem;
            width: 260px;
            cursor: default;
        }
        .iss-coord {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .iss-coord span:first-child {
            color: var(--text-faint);
            letter-spacing: 0.1em;
        }
        .iss-coord span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(200, 220, 255, 0.9);
        }
        .iss-map-container {
            width: 100%;
            height: 90px;
            margin-top: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }
        #iss-map-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .iss-detail {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--text-faint);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* 提示文字 */
        .hint {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.7;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .panel {
                font-size: 0.65rem;
                padding: 0.8rem;
            }
            #solar-panel {
                left: 0.8rem;
                bottom: 1.5rem;
                width: 200px;
                height: auto;
            }
            #solar-canvas {
                height: 160px;
            }
            #iss-panel {
                right: 0.8rem;
                bottom: 1.5rem;
                width: 200px;
                padding: 0.8rem;
            }
            .iss-map-container {
                height: 60px;
            }
        }
        @media (max-width: 480px) {
            #solar-panel {
                width: 160px;
                left: 0.3rem;
                bottom: 1rem;
            }
            #solar-canvas {
                height: 120px;
            }
            #iss-panel {
                width: 160px;
                right: 0.3rem;
                bottom: 1rem;
            }
            .iss-map-container {
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- 星空背景 Canvas -->
    <canvas id="starfield"></canvas>

    <!-- 暗角遮罩 -->
    <div class="vignette"></div>

    <!-- 提示文字 -->
    <div class="hint">拖拽旋转 · 滚轮缩放 · 点击天体查看</div>

    <!-- 太阳系面板 -->
    <div class="panel" id="solar-panel">
        <h3>Solar System</h3>
        <canvas id="solar-canvas"></canvas>
        <div id="solar-info">点击行星查看信息</div>
    </div>

    <!-- ISS 面板 -->
    <div class="panel" id="iss-panel">
        <h3>ISS · Live</h3>
        <div class="iss-coord">
            <span>纬度</span>
            <span id="iss-lat">--</span>
        </div>
        <div class="iss-coord">
            <span>经度</span>
            <span id="iss-lon">--</span>
        </div>
        <div class="iss-coord">
            <span>高度</span>
            <span id="iss-alt">--</span>
        </div>
        <div class="iss-map-container">
            <canvas id="iss-map-canvas"></canvas>
        </div>
        <div class="iss-detail" id="iss-detail">等待数据...</div>
    </div>

    <!-- 外部库: astronomy-engine 用于计算太阳系天体位置 -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <script>
        (function() {
            'use strict';

            /* ==========================================
               1. 交互式星空背景 (Canvas 2D)
               纯恒星背景，无银河螺旋，支持拖拽旋转和滚轮缩放
               ========================================== */
            const starCanvas = document.getElementById('starfield');
            const sctx = starCanvas.getContext('2d');
            let W, H, dpr, centerX, centerY;

            // 视角状态
            let viewRotation = 0; // 弧度
            let viewScale = 1;   // 缩放因子

            // 恒星集合
            let stars = [];
            const STAR_COUNT = 1800;

            // 星座数据 (真实星图坐标，归一化到0-1，基于赤经赤纬投影)
            const constellations = [
                { name: '北斗七星', points: [[0.72, 0.20], [0.74, 0.23], [0.76, 0.27], [0.78, 0.31], [0.80, 0.35], [0.83, 0.33], [0.80, 0.29]] },
                { name: '猎户座', points: [[0.30, 0.45], [0.32, 0.43], [0.31, 0.40], [0.34, 0.38], [0.36, 0.42], [0.38, 0.40], [0.37, 0.44]] },
                { name: '仙后座', points: [[0.22, 0.25], [0.24, 0.27], [0.26, 0.23], [0.28, 0.26], [0.30, 0.24]] },
                { name: '天鹅座', points: [[0.55, 0.30], [0.57, 0.28], [0.60, 0.26], [0.63, 0.28], [0.65, 0.31], [0.63, 0.33], [0.60, 0.34]] },
                { name: '飞马座', points: [[0.42, 0.38], [0.45, 0.36], [0.48, 0.38], [0.50, 0.40], [0.48, 0.42], [0.45, 0.43], [0.42, 0.42]] },
            ];

            function rand(min, max) { return Math.random() * (max - min) + min; }

            function resizeStarfield() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                starCanvas.width = W * dpr;
                starCanvas.height = H * dpr;
                starCanvas.style.width = W + 'px';
                starCanvas.style.height = H + 'px';
                sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                centerX = W / 2;
                centerY = H / 2;
                generateStars();
            }

            function generateStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    // 使用均匀分布，但加入一些亮度变化
                    const x = Math.random() * W;
                    const y = Math.random() * H;
                    const size = rand(0.3, 2.2);
                    const brightness = rand(0.2, 1.0);
                    // 颜色从冷白到暖白
                    const warm = Math.random() > 0.7;
                    const color = warm ? [255, 230, 200] : [220, 225, 245];
                    const twinkleSpeed = rand(0.003, 0.02);
                    const twinkleOffset = rand(0, Math.PI * 2);
                    stars.push({
                        baseX: x,
                        baseY: y,
                        size,
                        brightness,
                        color,
                        twinkleSpeed,
                        twinkleOffset,
                    });
                }
            }

            // 旋转并缩放坐标
            function transformPoint(x, y) {
                const dx = x - centerX;
                const dy = y - centerY;
                const cosA = Math.cos(viewRotation);
                const sinA = Math.sin(viewRotation);
                const rx = dx * cosA - dy * sinA;
                const ry = dx * sinA + dy * cosA;
                const scaleX = rx * viewScale + centerX;
                const scaleY = ry * viewScale + centerY;
                return [scaleX, scaleY];
            }

            function drawStarfield(now) {
                sctx.clearRect(0, 0, W, H);

                // 深空背景
                const bgGrad = sctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.9);
                bgGrad.addColorStop(0, '#08081a');
                bgGrad.addColorStop(0.5, '#050510');
                bgGrad.addColorStop(1, '#020208');
                sctx.fillStyle = bgGrad;
                sctx.fillRect(0, 0, W, H);

                // 绘制恒星
                for (const star of stars) {
                    const [sx, sy] = transformPoint(star.baseX, star.baseY);
                    // 超出屏幕跳过
                    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
                    const twinkle = 0.75 + 0.25 * Math.sin(now * star.twinkleSpeed + star.twinkleOffset);
                    const alpha = star.brightness * twinkle;
                    const [r, g, b] = star.color;
                    sctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    sctx.beginPath();
                    sctx.arc(sx, sy, star.size * viewScale, 0, Math.PI * 2);
                    sctx.fill();
                }

                // 绘制星座连线（同样旋转缩放）
                sctx.lineWidth = 0.8 * viewScale;
                sctx.strokeStyle = 'rgba(180, 200, 255, 0.3)';
                sctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                for (const cons of constellations) {
                    const pts = cons.points.map(p => transformPoint(p[0] * W, p[1] * H));
                    sctx.beginPath();
                    sctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) {
                        sctx.lineTo(pts[i][0], pts[i][1]);
                    }
                    sctx.stroke();
                    for (const [px, py] of pts) {
                        sctx.beginPath();
                        sctx.arc(px, py, 1.5 * viewScale, 0, Math.PI * 2);
                        sctx.fill();
                    }
                }

                // 星座名称标签（可悬停交互）
                sctx.font = `${Math.max(10, 10 * viewScale)}px sans-serif`;
                sctx.textAlign = 'center';
                for (const cons of constellations) {
                    const avgX = cons.points.reduce((s, p) => s + p[0], 0) / cons.points.length;
                    const avgY = cons.points.reduce((s, p) => s + p[1], 0) / cons.points.length;
                    const [tx, ty] = transformPoint(avgX * W, avgY * H);
                    sctx.fillStyle = 'rgba(200, 220, 255, 0.25)';
                    sctx.fillText(cons.name, tx, ty - 15 * viewScale);
                }
            }

            /* ==========================================
               2. 太阳系面板 (交互式)
               ========================================== */
            const solarCanvas = document.getElementById('solar-canvas');
            const solarCtx = solarCanvas.getContext('2d');
            const solarInfo = document.getElementById('solar-info');
            let solarWidth, solarHeight, solarDPR;

            // 行星数据
            const planetsData = [
                { name: '水星', body: Astronomy.Body.Mercury, color: '#b5b5b5', orbitR: 0.28, radius: 3, info: '水星 · 最小的行星' },
                { name: '金星', body: Astronomy.Body.Venus, color: '#e6c87a', orbitR: 0.42, radius: 5, info: '金星 · 最亮的行星' },
                { name: '地球', body: Astronomy.Body.Earth, color: '#6b93d6', orbitR: 0.56, radius: 5, info: '地球 · 我们的家园' },
                { name: '火星', body: Astronomy.Body.Mars, color: '#c1440e', orbitR: 0.70, radius: 4, info: '火星 · 红色星球' },
                { name: '木星', body: Astronomy.Body.Jupiter, color: '#d8a27a', orbitR: 0.85, radius: 7, info: '木星 · 气态巨行星' },
                { name: '土星', body: Astronomy.Body.Saturn, color: '#ead6a6', orbitR: 1.05, radius: 6, info: '土星 · 壮丽的光环' },
            ];

            // 存储行星屏幕坐标用于点击检测
            let planetScreenPositions = [];

            function resizeSolarCanvas() {
                const rect = solarCanvas.parentElement.getBoundingClientRect();
                solarWidth = solarCanvas.clientWidth || 240;
                solarHeight = solarCanvas.clientHeight || 200;
                solarDPR = Math.min(window.devicePixelRatio || 1, 2);
                solarCanvas.width = solarWidth * solarDPR;
                solarCanvas.height = solarHeight * solarDPR;
                solarCanvas.style.width = solarWidth + 'px';
                solarCanvas.style.height = solarHeight + 'px';
                solarCtx.setTransform(solarDPR, 0, 0, solarDPR, 0, 0);
            }

            function drawSolarSystem() {
                if (!window.Astronomy) return;
                const now = new Date();
                const cx = solarWidth / 2;
                const cy = solarHeight / 2;
                const maxOrbitR = Math.min(cx, cy) * 0.92;
                planetScreenPositions = [];

                solarCtx.clearRect(0, 0, solarWidth, solarHeight);

                // 轨道圆
                solarCtx.strokeStyle = 'rgba(255,255,255,0.1)';
                solarCtx.lineWidth = 0.5;
                for (const p of planetsData) {
                    const r = p.orbitR * maxOrbitR;
                    solarCtx.beginPath();
                    solarCtx.arc(cx, cy, r, 0, Math.PI * 2);
                    solarCtx.stroke();
                }

                // 太阳
                solarCtx.fillStyle = '#fff3d6';
                solarCtx.shadowColor = 'rgba(255, 240, 200, 0.8)';
                solarCtx.shadowBlur = 20;
                solarCtx.beginPath();
                solarCtx.arc(cx, cy, 8, 0, Math.PI * 2);
                solarCtx.fill();
                solarCtx.shadowBlur = 0;

                // 行星
                for (const p of planetsData) {
                    try {
                        const vec = Astronomy.HelioVector(p.body, now);
                        const scale = maxOrbitR / 5.8; // 天文单位缩放
                        const px = cx + vec.x * scale;
                        const py = cy - vec.y * scale;
                        if (px < -10 || px > solarWidth + 10 || py < -10 || py > solarHeight + 10) continue;
                        solarCtx.fillStyle = p.color;
                        solarCtx.beginPath();
                        solarCtx.arc(px, py, p.radius, 0, Math.PI * 2);
                        solarCtx.fill();
                        solarCtx.fillStyle = 'rgba(255,255,255,0.7)';
                        solarCtx.font = '8px sans-serif';
                        solarCtx.textAlign = 'center';
                        solarCtx.fillText(p.name, px, py - 10);
                        planetScreenPositions.push({ name: p.name, x: px, y: py, radius: p.radius + 4, info: p.info });
                    } catch (e) {
                        console.warn('计算行星位置失败', p.name, e);
                    }
                }
            }

            // 太阳系点击交互
            solarCanvas.addEventListener('click', (e) => {
                const rect = solarCanvas.getBoundingClientRect();
                const scaleX = solarWidth / rect.width;
                const scaleY = solarHeight / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                for (const pos of planetScreenPositions) {
                    const dx = mouseX - pos.x;
                    const dy = mouseY - pos.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= pos.radius) {
                        solarInfo.textContent = pos.info;
                        return;
                    }
                }
                solarInfo.textContent = '点击行星查看信息';
            });

            /* ==========================================
               3. ISS 面板 (实时数据)
               ========================================== */
            const issLatEl = document.getElementById('iss-lat');
            const issLonEl = document.getElementById('iss-lon');
            const issAltEl = document.getElementById('iss-alt');
            const issDetailEl = document.getElementById('iss-detail');
            const issMapCanvas = document.getElementById('iss-map-canvas');
            const issMapCtx = issMapCanvas.getContext('2d');
            let issData = null;
            let issMapWidth, issMapHeight, issMapDPR;

            function resizeIssMap() {
                const container = issMapCanvas.parentElement;
                issMapWidth = container.clientWidth || 240;
                issMapHeight = container.clientHeight || 80;
                issMapDPR = Math.min(window.devicePixelRatio || 1, 2);
                issMapCanvas.width = issMapWidth * issMapDPR;
                issMapCanvas.height = issMapHeight * issMapDPR;
                issMapCanvas.style.width = issMapWidth + 'px';
                issMapCanvas.style.height = issMapHeight + 'px';
                issMapCtx.setTransform(issMapDPR, 0, 0, issMapDPR, 0, 0);
            }

            function drawIssMap(lat, lon) {
                if (!issMapWidth || !issMapHeight) return;
                const w = issMapWidth;
                const h = issMapHeight;
                issMapCtx.clearRect(0, 0, w, h);

                // 简易世界地图轮廓
                issMapCtx.strokeStyle = 'rgba(255,255,255,0.2)';
                issMapCtx.lineWidth = 0.5;
                const continents = [
                    { x: [0.15, 0.25, 0.35, 0.3, 0.2, 0.1, 0.05, 0.1, 0.15], y: [0.3, 0.25, 0.35, 0.5, 0.55, 0.45, 0.35, 0.3, 0.3] },
                    { x: [0.45, 0.55, 0.6, 0.55, 0.48, 0.42, 0.45], y: [0.35, 0.25, 0.4, 0.5, 0.45, 0.4, 0.35] },
                    { x: [0.45, 0.55, 0.65, 0.7, 0.6, 0.5, 0.45], y: [0.45, 0.4, 0.5, 0.6, 0.65, 0.55, 0.45] },
                    { x: [0.15, 0.25, 0.35, 0.3, 0.2, 0.12, 0.15], y: [0.55, 0.5, 0.6, 0.7, 0.75, 0.65, 0.55] },
                    { x: [0.6, 0.7, 0.8, 0.85, 0.75, 0.65, 0.6], y: [0.3, 0.25, 0.35, 0.45, 0.5, 0.4, 0.3] },
                    { x: [0.7, 0.75, 0.8, 0.85, 0.8, 0.75, 0.7], y: [0.6, 0.55, 0.6, 0.7, 0.8, 0.75, 0.6] },
                ];
                for (const c of continents) {
                    issMapCtx.beginPath();
                    issMapCtx.moveTo(c.x[0] * w, c.y[0] * h);
                    for (let i = 1; i < c.x.length; i++) {
                        issMapCtx.lineTo(c.x[i] * w, c.y[i] * h);
                    }
                    issMapCtx.closePath();
                    issMapCtx.stroke();
                }

                // ISS 光点
                const x = (lon + 180) / 360 * w;
                const y = (90 - lat) / 180 * h;
                issMapCtx.fillStyle = '#fff';
                issMapCtx.shadowColor = 'rgba(255,255,255,0.9)';
                issMapCtx.shadowBlur = 8;
                issMapCtx.beginPath();
                issMapCtx.arc(x, y, 4, 0, Math.PI * 2);
                issMapCtx.fill();
                issMapCtx.shadowBlur = 0;
                issMapCtx.fillStyle = 'rgba(200,220,255,0.8)';
                issMapCtx.font = '7px sans-serif';
                issMapCtx.textAlign = 'center';
                issMapCtx.fillText('ISS', x, y - 8);
            }

            async function fetchIssData() {
                try {
                    const response = await fetch('https://api.open-notify.org/iss-now.json', { mode: 'cors' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();
                    if (data && data.iss_position) {
                        const lat = parseFloat(data.iss_position.latitude);
                        const lon = parseFloat(data.iss_position.longitude);
                        issData = { lat, lon, timestamp: data.timestamp };
                        issLatEl.textContent = lat.toFixed(4) + '°';
                        issLonEl.textContent = lon.toFixed(4) + '°';
                        const alt = 420 + Math.sin(Date.now() / 1000) * 2; // 近似高度
                        issAltEl.textContent = alt.toFixed(0) + ' km';
                        issDetailEl.textContent = `更新于 ${new Date(data.timestamp * 1000).toLocaleTimeString()}`;
                        drawIssMap(lat, lon);
                    } else {
                        throw new Error('数据格式错误');
                    }
                } catch (err) {
                    console.warn('ISS 数据获取失败', err);
                    issLatEl.textContent = '--';
                    issLonEl.textContent = '--';
                    issAltEl.textContent = '--';
                    issDetailEl.textContent = '无法获取实时数据';
                }
            }

            /* ==========================================
               4. 全局交互 (拖拽旋转、滚轮缩放)
               ========================================== */
            let isDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            let dragSensitivity = 0.005;

            document.body.addEventListener('mousedown', (e) => {
                // 如果点击发生在面板内，不启动拖拽
                if (e.target.closest('.panel')) return;
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                document.body.classList.add('dragging');
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                viewRotation += dx * dragSensitivity;
                // 限制旋转范围
                viewRotation = viewRotation % (Math.PI * 2);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                document.body.classList.remove('dragging');
            });

            // 滚轮缩放
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                viewScale = Math.min(3.0, Math.max(0.5, viewScale + delta));
            }, { passive: false });

            // 触摸支持（移动端）
            let lastTouchX = 0;
            let lastTouchY = 0;
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('.panel')) return;
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - lastTouchX;
                const dy = e.touches[0].clientY - lastTouchY;
                viewRotation += dx * dragSensitivity;
                viewRotation = viewRotation % (Math.PI * 2);
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            /* ==========================================
               5. 动画循环
               ========================================== */
            function animate(now) {
                drawStarfield(now);
                drawSolarSystem();
                requestAnimationFrame(animate);
            }

            /* ==========================================
               6. 初始化
               ========================================== */
            function init() {
                resizeStarfield();
                resizeSolarCanvas();
                resizeIssMap();
                fetchIssData();

                // 定期获取 ISS 数据
                setInterval(fetchIssData, 10000);
                // 窗口大小变化
                window.addEventListener('resize', () => {
                    resizeStarfield();
                    resizeSolarCanvas();
                    resizeIssMap();
                    if (issData) drawIssMap(issData.lat, issData.lon);
                });

                // 开始动画
                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
