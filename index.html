<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宇宙沙盒 · 3D Solar System</title>
  <style>
    html, body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; background: #000; }
    #main-container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; color: #9aa4b5; font-size: 18px; z-index: 999; letter-spacing: 2px;
    }
    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 18px; font-weight: 300; letter-spacing: 4px; z-index: 10;
      text-shadow: 0 0 14px rgba(120,180,255,.55); pointer-events: none; white-space: nowrap;
    }
    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: #667; font-size: 12px; letter-spacing: 1px; z-index: 10; pointer-events: none; text-align: center; white-space: nowrap;
    }
    #hint b { color: #aac; }
    .spacekit__object-label {
      position: absolute; font-family: Arial, "PingFang SC", sans-serif;
      font-size: 12px; color: #fff; background: rgba(0,0,0,.65);
      padding: 2px 6px; border-radius: 3px; pointer-events: none; white-space: nowrap;
      text-shadow: 0 0 6px rgba(100,160,255,.8);
    }
    #info-panel {
      position: fixed; top: 60px; right: 18px; z-index: 20; width: 220px;
      max-height: 340px; overflow-y: auto;
      background: rgba(10,15,30,.88); border: 1px solid rgba(100,150,255,.4);
      border-radius: 10px; padding: 14px 16px; color: #e8eef7;
      box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(6px);
      display: none;
    }
    #info-panel .ip-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    #info-panel .ip-row { font-size: 13px; margin: 5px 0; color: #b8c4d6; }
    #info-panel .ip-row span { color: #9fe2c0; font-weight: 500; }
    #info-close {
      position: absolute; top: 8px; right: 12px; cursor: pointer; color: #889; font-size: 16px;
      background: none; border: none; line-height: 1;
    }
    #info-close:hover { color: #fff; }
    @media (max-width: 600px) { #title { font-size: 14px; } #info-panel { width: 180px; } #hint { font-size: 10px; } }
  </style>
</head>
<body>
  <div id="loading">🌌 宇宙沙盒加载中…</div>
  <div id="title">SOLAR SYSTEM · 3D 宇宙沙盒</div>
  <div id="hint"><b>点击</b>行星查看信息 · <b>拖动</b>旋转 · <b>滚轮</b>缩放</div>
  <div id="main-container"></div>

  <div id="info-panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name" id="ip-name">-</div>
    <div class="ip-row">距太阳：<span id="ip-dist">-</span></div>
    <div class="ip-row">实时位置：[<span id="ip-pos">-</span>]</div>
    <div class="ip-row">运行状态：<span id="ip-status">-</span></div>
  </div>

  <script src="./build/spacekit.js"></script>
  <script>
    // ===== 宇宙沙盒 · SpaceKit =====
    // 每颗行星真实直径(km) + 轨道(AU)。大小以太阳为基准按真实直径比例。
    // 说明: createSphere 的 radius 会被 scaleFactor(=unitsPerAu=100)自动放大100倍。
    //       visualBoost 是对整个太阳系的统一放大系数(保持相对比例前提下让行星可见可点)。
    const viz = new Spacekit.Simulation(document.getElementById('main-container'), {
      basePath: './',
      unitsPerAu: 100.0,               // 1AU=100单位 -> 轨道符合真实AU
  
      camera: { initialPosition: [150, 110, 220], enableDrift: true },
    });

    viz.createStars();
    viz.createAmbientLight();
    viz.createLight([0, 0, 0]);

    const SUN_DIAMETER_KM = 1392000;
    const SCALE = 100;                 // = unitsPerAu
    const SUN_RADIUS = 60;             // 太阳在场景中的基准半径(单位)
    const BOOST = 3;                   // 统一视觉放大(保持相对比例)

    const PLANETS = [
      { key: 'sun',      label: '太阳',   au: 0,    diameter: 1392000 },
      { key: 'mercury',  label: '水星',   au: 0.39, diameter: 4879 },
      { key: 'venus',    label: '金星',   au: 0.72, diameter: 12104 },
      { key: 'earth',    label: '地球',   au: 1.00, diameter: 12742 },
      { key: 'mars',     label: '火星',   au: 1.52, diameter: 6779 },
      { key: 'jupiter',  label: '木星',   au: 5.20, diameter: 139820 },
      { key: 'saturn',   label: '土星',   au: 9.58, diameter: 116460 },
      { key: 'uranus',   label: '天王星', au: 19.2, diameter: 50724 },
      { key: 'neptune',  label: '海王星', au: 30.1, diameter: 49244 },
    ];

    const objects = {};

    // 太阳：用带辉光的 sprite，并放大到基准半径大小
    objects.sun = viz.createObject('sun', Spacekit.SpaceObjectPresets.SUN);
    // 若 Sprite 支持 scale 则放大太阳(可选)

    // 创建行星(3D球体)
    PLANETS.filter(p => p.key !== 'sun').forEach(p => {
      const preset = Spacekit.SpaceObjectPresets[p.key.toUpperCase()];
      if (!preset) return;
      // 最终渲染半径 = 太阳半径 × (行星直径/太阳直径) × BOOST
      const finalRadius = Math.max(SUN_RADIUS * (p.diameter / SUN_DIAMETER_KM) * BOOST, 0.6);
      // getScaledRadius() 会乘以 SCALE, 所以传给 createSphere 的 radius 除以 SCALE
      const radiusToPass = finalRadius / SCALE;
      try {
        objects[p.key] = viz.createSphere(p.key, {
          textureUrl: './assets/textures/' + p.key + '.jpg',
          radius: radiusToPass,
          ephem: preset.ephem,
          levelsOfDetail: [
            { radii: 0, segments: 48 },
            { radii: 40, segments: 24 },
            { radii: 80, segments: 12 },
          ],
          labelText: p.label,
        });
      } catch (e) {
        try { objects[p.key] = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) {}
      }
    });

    // 控制运行速度(天/秒)
    try { viz.setJdPerSecond(3); } catch (e) {}

    // ===== 点击拾取(Raycaster) =====
    // 收集所有可拾取的三维对象
    const pickable = [];
    function buildPickList() {
      pickable.length = 0;
      Object.keys(objects).forEach(k => {
        const obj = objects[k];
        if (!obj || !obj.get3jsObjects) return;
        let list = [];
        try { list = obj.get3jsObjects() || []; } catch (e) { return; }
        list.forEach(root => {
          if (!root) return;
          root.traverse ? root.traverse(ch => { if (ch && (ch.isMesh || ch.isSprite)) pickable.push({ o: ch, key: k }); })
                        : pickable.push({ o: root, key: k });
        });
      });
    }

    // 等待对象初始化
    let buildCount = 0;
    const t = setInterval(() => {
      buildCount++;
      if (buildMeshOK()) { buildPickList(); if (pickable.length) clearInterval(t); }
      if (buildCount > 20) clearInterval(t);
    }, 300);
    function buildMeshOK() {
      let ok = 0;
      Object.keys(objects).forEach(k => {
        const obj = objects[k];
        if (obj && obj.get3jsObjects) { try { ok += (obj.get3jsObjects() || []).length; } catch(e){} }
      });
      return ok > 0;
    }
    setTimeout(() => { buildPickList(); }, 1500);
    setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; window.THREE = Spacekit.THREE; }, 800);

    (function initInteractions() {
      const canvas = viz.getSimulationElement();
      if (!canvas) return;
      const camera = viz.getViewer().getCamera();
      const TH = Spacekit.THREE;
      const raycaster = new TH.Raycaster();
      const pointer = new TH.Vector2();
      raycaster.params.Sprite.threshold = 5;   // 增大Sprite命中容差

      const meshMap = new Map();
      function refresh(){
        meshMap.clear();
        pickable.forEach(({o, key}) => meshMap.set(o, key));
      }

      let downPos = null, moved = false;
      canvas.addEventListener('pointerdown', e => { downPos = {x:e.clientX,y:e.clientY}; moved = false; });
      canvas.addEventListener('pointermove', e => {
        if (downPos) { const dx=e.clientX-downPos.x, dy=e.clientY-downPos.y; if (Math.abs(dx)+Math.abs(dy)>6) moved=true; }
        try {
          const rect = canvas.getBoundingClientRect();
          if (!rect.width) return;
          pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
          pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(Object.keys(meshMap).length ? Array.from(meshMap.keys()) : [], true);
          canvas.style.cursor = (hits && hits.length) ? 'pointer' : 'grab';
        } catch (err) {}
      });
      canvas.addEventListener('pointerup', e => {
        if (moved) { downPos = null; return; }
        try {
          const rect = canvas.getBoundingClientRect();
          if (!rect.width) return;
          pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
          pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
          raycaster.setFromCamera(pointer, camera);
          const objs = Array.from(meshMap.keys());
          const hits = objs.length ? raycaster.intersectObjects(objs, true) : [];
          if (hits.length > 0) {
            let node = hits[0].object, key = null;
            while (node) {
              if (meshMap.has(node)) { key = meshMap.get(node); break; }
              node = node.parent;
            }
            if (key) showInfo(key);
          }
        } catch (err) {}
        downPos = null;
      });

      function showInfo(key) {
        const info = PLANETS.find(p => p.key === key);
        if (!info) return;
        const panel = document.getElementById('info-panel');
        document.getElementById('ip-name').textContent = info.label;
        document.getElementById('ip-dist').textContent = (key === 'sun') ? '恒星中心' : info.au + ' AU';
        const obj = objects[key];
        let posTxt = '-';
        if (obj && obj.getPosition) {
          try { const v = obj.getPosition(viz.getJd()); if (v) posTxt = `${v.x.toFixed(1)}, ${v.y.toFixed(1)}, ${v.z.toFixed(1)}`; } catch (e) {}
        }
        document.getElementById('ip-pos').textContent = posTxt;
        document.getElementById('ip-status').textContent = (key === 'sun') ? '恒星(自转)' : '公转中';
        panel.style.display = 'block';
        // 建好拾取表
        setTimeout(refresh, 50);
      }

      document.getElementById('info-close').addEventListener('click', e => {
        e.stopPropagation();
        document.getElementById('info-panel').style.display = 'none';
      });
      // 初始化拾取表
      setInterval(refresh, 1500);
    })();
  </script>
</body>
</html>
