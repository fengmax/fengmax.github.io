<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宇宙沙盒 · 3D Solar System</title>
  <style>
    html, body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; background: #000; }
    #main-container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; color: #9aa4b5; font-size: 18px; z-index: 999; letter-spacing: 2px;
    }
    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 18px; font-weight: 300; letter-spacing: 4px; z-index: 10;
      text-shadow: 0 0 14px rgba(120,180,255,.55); pointer-events: none; white-space: nowrap;
    }
    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: #667; font-size: 12px; letter-spacing: 1px; z-index: 10; pointer-events: none; text-align: center; white-space: nowrap;
    }
    #hint b { color: #aac; }
    .spacekit__object-label {
      position: absolute; font-family: Arial, "PingFang SC", sans-serif;
      font-size: 13px; color: #fff; background: rgba(0,0,0,.72);
      padding: 3px 8px; border-radius: 4px; white-space: nowrap;
      border: 1px solid rgba(160,200,255,.55); box-shadow: 0 0 8px rgba(0,0,0,.6);
      text-shadow: 0 0 6px rgba(100,160,255,.8); z-index: 15;
    }
    #info-panel {
      position: fixed; top: 60px; right: 18px; z-index: 20; width: 220px;
      max-height: 340px; overflow-y: auto;
      background: rgba(10,15,30,.88); border: 1px solid rgba(100,150,255,.4);
      border-radius: 10px; padding: 14px 16px; color: #e8eef7;
      box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(6px);
      display: none;
    }
    #info-panel .ip-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    #info-panel .ip-row { font-size: 13px; margin: 5px 0; color: #b8c4d6; }
    #info-panel .ip-row span { color: #9fe2c0; font-weight: 500; }
    #info-close {
      position: absolute; top: 8px; right: 12px; cursor: pointer; color: #889; font-size: 16px;
      background: none; border: none; line-height: 1;
    }
    #info-close:hover { color: #fff; }
    @media (max-width: 600px) { #title { font-size: 14px; } #info-panel { width: 180px; } #hint { font-size: 10px; } }
  </style>
</head>
<body>
  <div id="loading">🌌 宇宙沙盒加载中…</div>
  <div id="title">SOLAR SYSTEM · 3D 宇宙沙盒</div>
  <div id="hint"><b>点击</b>行星名字查看信息 · <b>拖动</b>旋转 · <b>滚轮</b>缩放</div>
  <div id="main-container"></div>

  <div id="info-panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name" id="ip-name">-</div>
    <div class="ip-row">距太阳：<span id="ip-dist">-</span></div>
    <div class="ip-row">实时位置：[<span id="ip-pos">-</span>]</div>
    <div class="ip-row">运行状态：<span id="ip-status">-</span></div>
  </div>

  <script src="./build/spacekit.js"></script>
  <script>
    // ===== 宇宙沙盒 · SpaceKit =====
    // 行星大小以太阳为基准按真实直径比例；行行星名标签可点击查看信息。
    // 防御式架构: 加载页隐藏独立于3D渲染, 互不阻塞。
    var viz = null;
    var objects = {};

    // 行星数据(真实直径km + 轨道AU)
    var PLANETS = [
      { key: 'sun',      label: '太阳',   au: 0,    diameter: 1392000 },
      { key: 'mercury',  label: '水星',   au: 0.39, diameter: 4879 },
      { key: 'venus',    label: '金星',   au: 0.72, diameter: 12104 },
      { key: 'earth',    label: '地球',   au: 1.00, diameter: 12742 },
      { key: 'mars',     label: '火星',   au: 1.52, diameter: 6779 },
      { key: 'jupiter',  label: '木星',   au: 5.20, diameter: 139820 },
      { key: 'saturn',   label: '土星',   au: 9.58, diameter: 116460 },
      { key: 'uranus',   label: '天王星', au: 19.2, diameter: 50724 },
      { key: 'neptune',  label: '海王星', au: 30.1, diameter: 49244 },
    ];

    // ===== 隐藏加载页: 用 window.load 独立触发, 任何情况下都会尽力隐藏 =====
    function hideLoading() {
      var l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    }
    setTimeout(hideLoading, 600);
    setTimeout(hideLoading, 2000);
    window.addEventListener('load', hideLoading);

    // ===== 初始化3D(包在try里, 失败也不影响加载页隐藏) =====
    try {
      viz = new Spacekit.Simulation(document.getElementById('main-container'), {
        basePath: './',
        unitsPerAu: 100.0,
        camera: { initialPosition: [150, 110, 220], enableDrift: true },
      });
      viz.createStars();
      viz.createAmbientLight();
      viz.createLight([0, 0, 0]);

      // 太阳
      objects.sun = viz.createObject('sun', Spacekit.SpaceObjectPresets.SUN);

      // 行星(3D球体, createSphere)
      var SUN_DIAMETER_KM = 1392000;
      var SUN_RADIUS = 60;
      var BOOST = 3;
      PLANETS.forEach(function(p) {
        if (p.key === 'sun') return;
        var preset = Spacekit.SpaceObjectPresets[p.key.toUpperCase()];
        if (!preset) return;
        var finalRadius = Math.max(SUN_RADIUS * (p.diameter / SUN_DIAMETER_KM) * BOOST, 0.6);
        var radiusToPass = finalRadius / 100;   // 抵消 scaleFactor(=100)
        try {
          objects[p.key] = viz.createSphere(p.key, {
            textureUrl: './assets/textures/' + p.key + '.jpg',
            radius: radiusToPass,
            ephem: preset.ephem,
            levelsOfDetail: [{ radii: 0, segments: 48 }, { radii: 40, segments: 24 }, { radii: 80, segments: 12 }],
            labelText: p.label,
          });
        } catch (e) {
          try { objects[p.key] = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) {}
        }
      });

      try { viz.setJdPerSecond(3); } catch (e) {}
      window.THREE = Spacekit.THREE;
    } catch (err) {
      console.error('初始化失败:', err);
      hideLoading();
    }

    // ===== 点击行星名标签(纯DOM, 独立try) =====
    function iface() {
      try {
        var bound = {};
        function bindAll() {
          var labels = document.querySelectorAll('.spacekit__object-label');
          Array.prototype.forEach.call(labels, function(label) {
            if (bound[label]) return;
            var txt = (label.textContent || '').replace(/\s+/g, '').trim();
            var p = null;
            for (var i = 0; i < PLANETS.length; i++) if (PLANETS[i].label === txt) { p = PLANETS[i]; break; }
            if (!p) return;
            bound[label] = true;
            label.style.cursor = 'pointer';
            label.style.userSelect = 'none';
            label.style.pointerEvents = 'auto';
            label.title = '点击查看' + p.label + '信息';
            label.addEventListener('click', function(ev) {
              ev.stopPropagation();
              showInfo(p.key);
            });
          });
        }
        bindAll();
        setInterval(bindAll, 400);

        function showInfo(key) {
          var info = null;
          for (var i = 0; i < PLANETS.length; i++) if (PLANETS[i].key === key) { info = PLANETS[i]; break; }
          if (!info) return;
          document.getElementById('ip-name').textContent = info.label;
          document.getElementById('ip-dist').textContent = (key === 'sun') ? '恒星中心' : info.au + ' AU';
          var obj = objects[key];
          var posTxt = '-';
          if (obj && obj.getPosition) {
            try { var v = obj.getPosition(viz.getJd()); if (v) posTxt = v.x.toFixed(1) + ', ' + v.y.toFixed(1) + ', ' + v.z.toFixed(1); } catch (e) {}
          }
          document.getElementById('ip-pos').textContent = posTxt;
          document.getElementById('ip-status').textContent = info.label + ((key === 'sun') ? ' 恒星(自转)' : ' 公转中');
          document.getElementById('info-panel').style.display = 'block';
        }
        document.getElementById('info-close').addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('info-panel').style.display = 'none'; });
      } catch (err) { console.error('交互失败:', err); }
    }
    setTimeout(iface, 500);
  </script>
</body>
</html>
