<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间 · 星空 · 实时宇宙</title>
    <style>
        :root {
            --bg: #050510;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(10, 12, 28, 0.55);
            --panel-border: rgba(255, 255, 255, 0.08);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        /* 主背景 Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 暗角 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 30%,
                    rgba(0, 0, 0, 0.35) 70%,
                    rgba(0, 0, 0, 0.7) 100%);
        }

        /* 顶部标识 */
        .top-label {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.65rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: var(--text-faint);
            font-weight: 300;
            text-align: center;
            pointer-events: none;
        }

        /* 中央时钟 */
        .clock-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            text-align: center;
            pointer-events: none;
        }
        .clock-time {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 10vw, 6.5rem);
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            line-height: 1;
            text-shadow: 0 0 80px rgba(180, 200, 255, 0.25), 0 0 30px rgba(180, 200, 255, 0.1);
            font-variant-numeric: tabular-nums;
        }
        .clock-time .separator {
            opacity: 0.5;
            font-weight: 200;
            margin: 0 0.05em;
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.85; }
        }
        .clock-seconds {
            font-family: var(--font-serif);
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            margin-top: 0.4rem;
            font-variant-numeric: tabular-nums;
        }
        .clock-date {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-top: 1rem;
            font-weight: 300;
        }

        /* 底部时间流逝条 */
        .time-flow {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 5;
        }
        .time-flow-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,
                    rgba(180, 200, 255, 0.0),
                    rgba(180, 200, 255, 0.5),
                    rgba(180, 200, 255, 0.0));
            transition: width 1s linear;
        }

        /* 面板通用样式 */
        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.8rem;
            text-align: center;
        }

        /* 太阳系面板 (左下) */
        #solar-panel {
            left: 1.5rem;
            bottom: 3rem;
            width: 210px;
            height: 210px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #solar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ISS 面板 (右下) */
        #iss-panel {
            right: 1.5rem;
            bottom: 3rem;
            width: 240px;
        }
        .iss-coord {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .iss-coord span:first-child {
            color: var(--text-faint);
            letter-spacing: 0.1em;
        }
        .iss-coord span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(200, 220, 255, 0.9);
        }
        .iss-map-container {
            width: 100%;
            height: 70px;
            margin-top: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        #iss-map-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .iss-detail {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--text-faint);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* 底部信息 */
        .bottom-info {
            position: fixed;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            font-weight: 300;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .panel {
                font-size: 0.65rem;
                padding: 0.8rem;
            }
            #solar-panel {
                left: 0.8rem;
                bottom: 2rem;
                width: 150px;
                height: 150px;
            }
            #iss-panel {
                right: 0.8rem;
                bottom: 2rem;
                width: 180px;
                padding: 0.8rem;
            }
            .iss-map-container {
                height: 50px;
            }
            .clock-time {
                font-size: clamp(2.5rem, 8vw, 4.5rem);
            }
        }
        @media (max-width: 480px) {
            #solar-panel {
                display: none; /* 小屏隐藏太阳系面板，保持简洁 */
            }
            #iss-panel {
                width: 160px;
                right: 0.5rem;
                bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- 星空背景 Canvas -->
    <canvas id="starfield"></canvas>

    <!-- 暗角遮罩 -->
    <div class="vignette"></div>

    <!-- 顶部标识 -->
    <div class="top-label">Tempus Fugit · Universum</div>

    <!-- 中央时钟 -->
    <div class="clock-wrap">
        <div class="clock-time" id="clockTime">
            <span id="hours">00</span><span class="separator">:</span><span id="minutes">00</span>
        </div>
        <div class="clock-seconds" id="clockSeconds">00</div>
        <div class="clock-date" id="clockDate"></div>
    </div>

    <!-- 太阳系面板 -->
    <div class="panel" id="solar-panel">
        <h3>Solar System</h3>
        <canvas id="solar-canvas"></canvas>
    </div>

    <!-- ISS 面板 -->
    <div class="panel" id="iss-panel">
        <h3>ISS · Live</h3>
        <div class="iss-coord">
            <span>纬度</span>
            <span id="iss-lat">--</span>
        </div>
        <div class="iss-coord">
            <span>经度</span>
            <span id="iss-lon">--</span>
        </div>
        <div class="iss-coord">
            <span>高度</span>
            <span id="iss-alt">--</span>
        </div>
        <div class="iss-map-container">
            <canvas id="iss-map-canvas"></canvas>
        </div>
        <div class="iss-detail" id="iss-detail">等待数据...</div>
    </div>

    <!-- 时间流逝指示条 -->
    <div class="time-flow">
        <div class="time-flow-bar" id="timeFlowBar"></div>
    </div>

    <!-- 底部信息 -->
    <div class="bottom-info">∞ 银河 · 行星 · 空间站 ∞</div>

    <!-- 外部库: astronomy-engine 用于计算太阳系天体位置 -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <script>
        (function() {
            'use strict';

            /* ==========================================
               1. 星空背景 (Canvas 2D)
               包含银河螺旋 + 星座连线
               ========================================== */
            const starCanvas = document.getElementById('starfield');
            const sctx = starCanvas.getContext('2d');
            let W, H, dpr, centerX, centerY;
            let stars = [];
            let rotationAngle = 0;
            const GALAXY = {
                arms: 4,
                particlesPerArm: 400,
                coreParticles: 180,
                haloParticles: 220,
                rotationSpeed: 0.00008,
                spiralTightness: 4.5,
                armSpread: 0.35,
                coreRadius: 0.14,
                galaxyRadius: 0.55,
            };

            // 星座数据 (屏幕相对坐标, 简化)
            const constellations = [
                { name: '北斗七星', points: [[0.72, 0.20], [0.74, 0.23], [0.76, 0.27], [0.78, 0.31], [0.80, 0.35], [0.83, 0.33], [0.80, 0.29]] },
                { name: '猎户座', points: [[0.30, 0.45], [0.32, 0.43], [0.31, 0.40], [0.34, 0.38], [0.36, 0.42], [0.38, 0.40], [0.37, 0.44]] },
                { name: '仙后座', points: [[0.22, 0.25], [0.24, 0.27], [0.26, 0.23], [0.28, 0.26], [0.30, 0.24]] },
            ];

            function rand(min, max) { return Math.random() * (max - min) + min; }

            function resizeStarfield() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                starCanvas.width = W * dpr;
                starCanvas.height = H * dpr;
                starCanvas.style.width = W + 'px';
                starCanvas.style.height = H + 'px';
                sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                centerX = W / 2;
                centerY = H / 2;
                generateStars();
            }

            function generateStars() {
                stars = [];
                const baseR = Math.min(W, H) * GALAXY.galaxyRadius;
                // 核心
                for (let i = 0; i < GALAXY.coreParticles; i++) {
                    const r = Math.pow(Math.random(), 1.8) * baseR * GALAXY.coreRadius;
                    const angle = rand(0, Math.PI * 2);
                    const x = centerX + Math.cos(angle) * r;
                    const y = centerY + Math.sin(angle) * r * 0.85;
                    stars.push({ x, y, baseX: x, baseY: y, size: rand(0.5, 2.4), brightness: rand(0.6, 1), color: [255, 235, 210], layer: 'core', twinkleSpeed: rand(0.004, 0.02), twinkleOffset: rand(0, Math.PI * 2) });
                }
                // 旋臂
                for (let arm = 0; arm < GALAXY.arms; arm++) {
                    const armAngle = (arm / GALAXY.arms) * Math.PI * 2;
                    for (let i = 0; i < GALAXY.particlesPerArm; i++) {
                        const t = Math.random();
                        const r = t * baseR + rand(-6, 6);
                        const spiralAngle = armAngle + t * GALAXY.spiralTightness;
                        const scatter = rand(-GALAXY.armSpread, GALAXY.armSpread) * (1 - t * 0.55) * baseR * 0.2;
                        const finalAngle = spiralAngle + scatter / (r + 5);
                        const x = centerX + Math.cos(finalAngle) * r;
                        const y = centerY + Math.sin(finalAngle) * r * 0.82;
                        stars.push({ x, y, baseX: x, baseY: y, size: rand(0.4, 1.8) * (1 - t * 0.5), brightness: rand(0.3, 0.9) * (1 - t * 0.4), color: [190, 205, 255], layer: 'arm', twinkleSpeed: rand(0.006, 0.028), twinkleOffset: rand(0, Math.PI * 2) });
                    }
                }
                // 晕
                for (let i = 0; i < GALAXY.haloParticles; i++) {
                    const r = rand(baseR * 0.2, baseR * 1.6);
                    const angle = rand(0, Math.PI * 2);
                    const x = centerX + Math.cos(angle) * r;
                    const y = centerY + Math.sin(angle) * r * 0.75;
                    stars.push({ x, y, baseX: x, baseY: y, size: rand(0.3, 0.9), brightness: rand(0.15, 0.45), color: [220, 225, 245], layer: 'halo', twinkleSpeed: rand(0.003, 0.015), twinkleOffset: rand(0, Math.PI * 2) });
                }
                // 排序
                stars.sort((a, b) => { const order = { core: 2, arm: 1, halo: 0 }; return order[b.layer] - order[a.layer]; });
            }

            function drawStarfield(now) {
                sctx.clearRect(0, 0, W, H);

                // 背景渐变
                const bgGrad = sctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.8);
                bgGrad.addColorStop(0, '#08081a');
                bgGrad.addColorStop(0.45, '#060615');
                bgGrad.addColorStop(1, '#030308');
                sctx.fillStyle = bgGrad;
                sctx.fillRect(0, 0, W, H);

                // 旋转
                rotationAngle += GALAXY.rotationSpeed;
                const cosA = Math.cos(rotationAngle);
                const sinA = Math.sin(rotationAngle);

                // 星云光晕
                sctx.globalCompositeOperation = 'lighter';
                for (let arm = 0; arm < GALAXY.arms; arm++) {
                    const armAngle = (arm / GALAXY.arms) * Math.PI * 2;
                    for (let k = 0; k < 14; k++) {
                        const t = k / 14;
                        const r = t * Math.min(W, H) * GALAXY.galaxyRadius;
                        const spiralAngle = armAngle + t * GALAXY.spiralTightness;
                        const cx = centerX + Math.cos(spiralAngle) * r;
                        const cy = centerY + Math.sin(spiralAngle) * r * 0.82;
                        const nebR = rand(15, 45) * (1 - t * 0.5);
                        const alpha = rand(0.03, 0.1) * (1 - t * 0.5);
                        const hue = 225 + rand(-15, 15);
                        const nebGrad = sctx.createRadialGradient(cx, cy, 0, cx, cy, nebR);
                        nebGrad.addColorStop(0, `hsla(${hue}, 60%, 60%, ${alpha})`);
                        nebGrad.addColorStop(1, `hsla(${hue}, 60%, 60%, 0)`);
                        sctx.fillStyle = nebGrad;
                        sctx.beginPath();
                        sctx.arc(cx, cy, nebR, 0, Math.PI * 2);
                        sctx.fill();
                    }
                }
                // 核心光晕
                const coreGlow = sctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(W, H) * 0.18);
                coreGlow.addColorStop(0, 'rgba(255, 240, 220, 0.15)');
                coreGlow.addColorStop(0.5, 'rgba(230, 215, 200, 0.05)');
                coreGlow.addColorStop(1, 'rgba(200, 190, 180, 0)');
                sctx.fillStyle = coreGlow;
                sctx.beginPath();
                sctx.arc(centerX, centerY, Math.min(W, H) * 0.18, 0, Math.PI * 2);
                sctx.fill();

                // 绘制恒星
                for (const star of stars) {
                    const dx = star.baseX - centerX;
                    const dy = star.baseY - centerY;
                    const rx = dx * cosA - dy * sinA;
                    const ry = dx * sinA + dy * cosA;
                    const sx = centerX + rx;
                    const sy = centerY + ry;
                    const twinkle = 0.75 + 0.25 * Math.sin(now * star.twinkleSpeed + star.twinkleOffset);
                    const alpha = star.brightness * twinkle;
                    const [r, g, b] = star.color;
                    sctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    sctx.beginPath();
                    sctx.arc(sx, sy, star.size, 0, Math.PI * 2);
                    sctx.fill();
                    if (star.size > 1.5 && star.brightness > 0.6) {
                        const glowR = star.size * 3;
                        const glow = sctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
                        glow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`);
                        glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                        sctx.fillStyle = glow;
                        sctx.beginPath();
                        sctx.arc(sx, sy, glowR, 0, Math.PI * 2);
                        sctx.fill();
                    }
                }

                // 绘制星座连线 (固定屏幕坐标，不随星系旋转)
                sctx.globalCompositeOperation = 'source-over';
                sctx.lineWidth = 0.6;
                sctx.strokeStyle = 'rgba(180, 200, 255, 0.3)';
                sctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                for (const cons of constellations) {
                    const pts = cons.points.map(p => [p[0] * W, p[1] * H]);
                    sctx.beginPath();
                    sctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) {
                        sctx.lineTo(pts[i][0], pts[i][1]);
                    }
                    sctx.stroke();
                    // 小点
                    for (const [px, py] of pts) {
                        sctx.beginPath();
                        sctx.arc(px, py, 1.2, 0, Math.PI * 2);
                        sctx.fill();
                    }
                }
            }

            /* ==========================================
               2. 时钟更新
               ========================================== */
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('clockSeconds');
            const dateEl = document.getElementById('clockDate');
            const flowBar = document.getElementById('timeFlowBar');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

            function pad(n) { return n.toString().padStart(2, '0'); }

            function updateClock() {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes();
                const s = now.getSeconds();
                const ms = now.getMilliseconds();
                hoursEl.textContent = pad(h);
                minutesEl.textContent = pad(m);
                secondsEl.textContent = pad(s);
                dateEl.textContent = `${weekdays[now.getDay()]} · ${months[now.getMonth()]} ${now.getDate()}日 · ${now.getFullYear()}`;
                const totalMs = h * 3600000 + m * 60000 + s * 1000 + ms;
                const dayMs = 24 * 3600000;
                flowBar.style.width = (totalMs / dayMs * 100) + '%';
            }

            /* ==========================================
               3. 太阳系面板 (使用 astronomy-engine)
               ========================================== */
            const solarCanvas = document.getElementById('solar-canvas');
            const solarCtx = solarCanvas.getContext('2d');
            let solarWidth, solarHeight, solarDPR;

            function resizeSolarCanvas() {
                const rect = solarCanvas.parentElement.getBoundingClientRect();
                solarWidth = rect.width - 20; // 留白
                solarHeight = rect.height - 40; // 标题空间
                if (solarWidth < 50) solarWidth = 100;
                if (solarHeight < 50) solarHeight = 100;
                solarDPR = Math.min(window.devicePixelRatio || 1, 2);
                solarCanvas.width = solarWidth * solarDPR;
                solarCanvas.height = solarHeight * solarDPR;
                solarCanvas.style.width = solarWidth + 'px';
                solarCanvas.style.height = solarHeight + 'px';
                solarCtx.setTransform(solarDPR, 0, 0, solarDPR, 0, 0);
            }

            function drawSolarSystem() {
                if (!window.Astronomy) return;
                const now = new Date();
                const planets = [
                    { name: '水星', body: Astronomy.Body.Mercury, color: '#b5b5b5', orbitR: 0.3 },
                    { name: '金星', body: Astronomy.Body.Venus, color: '#e6c87a', orbitR: 0.42 },
                    { name: '地球', body: Astronomy.Body.Earth, color: '#6b93d6', orbitR: 0.55 },
                    { name: '火星', body: Astronomy.Body.Mars, color: '#c1440e', orbitR: 0.68 },
                    { name: '木星', body: Astronomy.Body.Jupiter, color: '#d8a27a', orbitR: 0.85 },
                    { name: '土星', body: Astronomy.Body.Saturn, color: '#ead6a6', orbitR: 1.0 },
                ];
                // 海王星太远，可能超出画布，只画到土星
                const cx = solarWidth / 2;
                const cy = solarHeight / 2;
                const maxOrbitR = Math.min(cx, cy) * 0.9;

                solarCtx.clearRect(0, 0, solarWidth, solarHeight);

                // 绘制轨道圆
                solarCtx.strokeStyle = 'rgba(255,255,255,0.1)';
                solarCtx.lineWidth = 0.5;
                for (const p of planets) {
                    const r = p.orbitR * maxOrbitR;
                    solarCtx.beginPath();
                    solarCtx.arc(cx, cy, r, 0, Math.PI * 2);
                    solarCtx.stroke();
                }

                // 太阳
                solarCtx.fillStyle = '#fff3d6';
                solarCtx.beginPath();
                solarCtx.arc(cx, cy, 6, 0, Math.PI * 2);
                solarCtx.fill();
                solarCtx.shadowColor = 'rgba(255, 240, 200, 0.8)';
                solarCtx.shadowBlur = 15;
                solarCtx.fill();
                solarCtx.shadowBlur = 0;

                // 行星位置
                for (const p of planets) {
                    try {
                        const vec = Astronomy.HelioVector(p.body, now);
                        // 使用日心黄道坐标 (J2000)
                        const x = vec.x;
                        const y = vec.y;
                        const z = vec.z;
                        // 投影到 2D (忽略 z 或映射到半径?)
                        const scale = maxOrbitR / 5.5; // 天文单位缩放
                        const px = cx + x * scale;
                        const py = cy - y * scale; // 屏幕 y 向下
                        // 检查是否在画布内
                        if (px < -10 || px > solarWidth + 10 || py < -10 || py > solarHeight + 10) continue;
                        solarCtx.fillStyle = p.color;
                        solarCtx.beginPath();
                        solarCtx.arc(px, py, 3, 0, Math.PI * 2);
                        solarCtx.fill();
                        solarCtx.fillStyle = 'rgba(255,255,255,0.65)';
                        solarCtx.font = '8px sans-serif';
                        solarCtx.textAlign = 'center';
                        solarCtx.fillText(p.name, px, py - 6);
                    } catch (e) {
                        console.warn('计算行星位置失败', p.name, e);
                    }
                }
            }

            /* ==========================================
               4. ISS 面板
               ========================================== */
            const issLatEl = document.getElementById('iss-lat');
            const issLonEl = document.getElementById('iss-lon');
            const issAltEl = document.getElementById('iss-alt');
            const issDetailEl = document.getElementById('iss-detail');
            const issMapCanvas = document.getElementById('iss-map-canvas');
            const issMapCtx = issMapCanvas.getContext('2d');
            let issData = null;
            let issMapWidth, issMapHeight, issMapDPR;

            function resizeIssMap() {
                const container = issMapCanvas.parentElement;
                const rect = container.getBoundingClientRect();
                issMapWidth = rect.width;
                issMapHeight = rect.height;
                issMapDPR = Math.min(window.devicePixelRatio || 1, 2);
                issMapCanvas.width = issMapWidth * issMapDPR;
                issMapCanvas.height = issMapHeight * issMapDPR;
                issMapCanvas.style.width = issMapWidth + 'px';
                issMapCanvas.style.height = issMapHeight + 'px';
                issMapCtx.setTransform(issMapDPR, 0, 0, issMapDPR, 0, 0);
            }

            function drawIssMap(lat, lon) {
                if (!issMapWidth || !issMapHeight) return;
                const w = issMapWidth;
                const h = issMapHeight;
                issMapCtx.clearRect(0, 0, w, h);

                // 简单世界地图轮廓 (极简线条)
                issMapCtx.strokeStyle = 'rgba(255,255,255,0.2)';
                issMapCtx.lineWidth = 0.5;
                // 绘制粗略大陆轮廓 (仅示意)
                const continents = [
                    { x: [0.15, 0.25, 0.35, 0.3, 0.2, 0.1, 0.05, 0.1, 0.15], y: [0.3, 0.25, 0.35, 0.5, 0.55, 0.45, 0.35, 0.3, 0.3] }, // 北美洲
                    { x: [0.45, 0.55, 0.6, 0.55, 0.48, 0.42, 0.45], y: [0.35, 0.25, 0.4, 0.5, 0.45, 0.4, 0.35] }, // 欧洲
                    { x: [0.45, 0.55, 0.65, 0.7, 0.6, 0.5, 0.45], y: [0.45, 0.4, 0.5, 0.6, 0.65, 0.55, 0.45] }, // 非洲
                    { x: [0.15, 0.25, 0.35, 0.3, 0.2, 0.12, 0.15], y: [0.55, 0.5, 0.6, 0.7, 0.75, 0.65, 0.55] }, // 南美洲
                    { x: [0.6, 0.7, 0.8, 0.85, 0.75, 0.65, 0.6], y: [0.3, 0.25, 0.35, 0.45, 0.5, 0.4, 0.3] }, // 亚洲
                    { x: [0.7, 0.75, 0.8, 0.85, 0.8, 0.75, 0.7], y: [0.6, 0.55, 0.6, 0.7, 0.8, 0.75, 0.6] }, // 澳大利亚
                ];
                for (const c of continents) {
                    issMapCtx.beginPath();
                    issMapCtx.moveTo(c.x[0] * w, c.y[0] * h);
                    for (let i = 1; i < c.x.length; i++) {
                        issMapCtx.lineTo(c.x[i] * w, c.y[i] * h);
                    }
                    issMapCtx.closePath();
                    issMapCtx.stroke();
                }

                // 绘制 ISS 光点 (经纬度转平面坐标，经度 -180~180 -> x, 纬度 -90~90 -> y)
                const x = (lon + 180) / 360 * w;
                const y = (90 - lat) / 180 * h;
                issMapCtx.fillStyle = '#fff';
                issMapCtx.shadowColor = 'rgba(255,255,255,0.9)';
                issMapCtx.shadowBlur = 8;
                issMapCtx.beginPath();
                issMapCtx.arc(x, y, 4, 0, Math.PI * 2);
                issMapCtx.fill();
                issMapCtx.shadowBlur = 0;
                issMapCtx.fillStyle = 'rgba(200,220,255,0.8)';
                issMapCtx.font = '7px sans-serif';
                issMapCtx.textAlign = 'center';
                issMapCtx.fillText('ISS', x, y - 8);
            }

            async function fetchIssData() {
                try {
                    const response = await fetch('https://api.open-notify.org/iss-now.json', { mode: 'cors' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();
                    if (data && data.iss_position) {
                        const lat = parseFloat(data.iss_position.latitude);
                        const lon = parseFloat(data.iss_position.longitude);
                        issData = { lat, lon, timestamp: data.timestamp };
                        issLatEl.textContent = lat.toFixed(4) + '°';
                        issLonEl.textContent = lon.toFixed(4) + '°';
                        // 高度数据公开接口不提供，使用近似值 420 km
                        const alt = 420 + Math.sin(Date.now() / 1000) * 2;
                        issAltEl.textContent = alt.toFixed(0) + ' km';
                        issDetailEl.textContent = `更新于 ${new Date(data.timestamp * 1000).toLocaleTimeString()}`;
                        drawIssMap(lat, lon);
                    } else {
                        throw new Error('数据格式错误');
                    }
                } catch (err) {
                    console.warn('ISS 数据获取失败', err);
                    issLatEl.textContent = '--';
                    issLonEl.textContent = '--';
                    issAltEl.textContent = '--';
                    issDetailEl.textContent = '无法获取实时数据';
                }
            }

            /* ==========================================
               5. 动画循环
               ========================================== */
            function animate(now) {
                drawStarfield(now);
                // 太阳系每帧重绘
                drawSolarSystem();
                requestAnimationFrame(animate);
            }

            /* ==========================================
               6. 初始化
               ========================================== */
            function init() {
                resizeStarfield();
                updateClock();
                resizeSolarCanvas();
                resizeIssMap();
                fetchIssData();

                // 定时获取 ISS 数据 (每 10 秒)
                setInterval(fetchIssData, 10000);
                // 定时更新时钟 (每秒)
                setInterval(updateClock, 1000);
                // 窗口大小变化
                window.addEventListener('resize', () => {
                    resizeStarfield();
                    resizeSolarCanvas();
                    resizeIssMap();
                    if (issData) drawIssMap(issData.lat, issData.lon);
                });

                // 开始动画
                requestAnimationFrame(animate);
            }

            // 页面加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
