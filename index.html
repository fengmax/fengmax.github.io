<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D宇宙沙盒 · 星空 / 行星 / ISS</title>
    <style>
        :root {
            --bg: #020210;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(8, 10, 24, 0.72);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Three.js 画布 */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 暗角遮罩 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.3) 75%,
                    rgba(0, 0, 0, 0.6) 100%);
        }

        /* 面板通用 */
        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            transition: all 0.4s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.7rem;
            text-align: center;
        }

        /* 行星信息面板 (左下) */
        #info-panel {
            left: 1.5rem;
            bottom: 2rem;
            width: 200px;
            min-height: 80px;
            cursor: default;
        }
        #info-panel .body-name {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        #info-panel .body-detail {
            font-size: 0.65rem;
            color: var(--text-faint);
            line-height: 1.6;
            letter-spacing: 0.08em;
        }
        #info-panel .hint-click {
            font-size: 0.55rem;
            color: var(--text-faint);
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        /* ISS 面板 (右下) */
        #iss-panel {
            right: 1.5rem;
            bottom: 2rem;
            width: 220px;
            cursor: default;
        }
        .iss-coord {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-family: var(--font-serif);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .iss-coord span:first-child {
            color: var(--text-faint);
            letter-spacing: 0.1em;
            font-family: var(--font-sans);
            font-size: 0.6rem;
        }
        .iss-coord span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(200, 220, 255, 0.9);
        }
        .iss-detail {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            text-align: center;
            margin-top: 0.6rem;
            border-top: 1px solid var(--hairline);
            padding-top: 0.6rem;
        }

        /* 提示 */
        .hint-bar {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 0.58rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            backdrop-filter: blur(4px);
        }

        /* 时间控制 */
        #time-panel {
            position: fixed;
            top: 1.2rem;
            right: 1.5rem;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            backdrop-filter: blur(4px);
        }
        #time-panel button {
            background: none;
            border: 1px solid var(--hairline);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        #time-panel button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        #time-panel .speed-display {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            min-width: 45px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .panel {
                font-size: 0.62rem;
                padding: 0.7rem;
            }
            #info-panel {
                left: 0.6rem;
                bottom: 1.2rem;
                width: 150px;
            }
            #iss-panel {
                right: 0.6rem;
                bottom: 1.2rem;
                width: 170px;
            }
            .hint-bar {
                font-size: 0.5rem;
                letter-spacing: 0.25em;
            }
            #time-panel {
                top: 0.8rem;
                right: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            #info-panel {
                display: none;
            }
            #iss-panel {
                width: 150px;
                right: 0.4rem;
                bottom: 1rem;
                font-size: 0.55rem;
            }
            .iss-coord {
                font-size: 0.6rem;
            }
            .hint-bar {
                font-size: 0.45rem;
                letter-spacing: 0.2em;
                top: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Three.js 容器 -->
    <div id="canvas-container"></div>

    <!-- 暗角遮罩 -->
    <div class="vignette"></div>

    <!-- 顶部提示 -->
    <div class="hint-bar">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击天体</div>

    <!-- 时间控制 -->
    <div id="time-panel">
        <button id="btn-slower" title="减慢">−</button>
        <span class="speed-display" id="speed-display">1×</span>
        <button id="btn-faster" title="加速">+</button>
        <button id="btn-reset" title="重置">⟲</button>
    </div>

    <!-- 行星信息面板 -->
    <div class="panel" id="info-panel">
        <div class="body-name" id="body-name">太阳系</div>
        <div class="body-detail" id="body-detail">点击任意行星查看详细信息</div>
        <div class="hint-click">✦ 点击天体交互 ✦</div>
    </div>

    <!-- ISS 面板 -->
    <div class="panel" id="iss-panel">
        <h3>ISS · Live</h3>
        <div class="iss-coord">
            <span>纬度</span>
            <span id="iss-lat">--</span>
        </div>
        <div class="iss-coord">
            <span>经度</span>
            <span id="iss-lon">--</span>
        </div>
        <div class="iss-coord">
            <span>高度</span>
            <span id="iss-alt">--</span>
        </div>
        <div class="iss-detail" id="iss-detail">等待实时数据...</div>
    </div>

    <!-- Astronomy Engine (用于实时行星位置) -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js">
    </script>

    <!-- Three.js ES Module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        /* ==========================================
           场景初始化
           ========================================== */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);

        // 相机
        const camera = new THREE.PerspectiveCamera(
            55,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(25, 18, 35);
        camera.lookAt(0, 0, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // CSS2D 渲染器（标签）
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 8;
        controls.maxDistance = 150;
        controls.maxPolarAngle = Math.PI;
        controls.target.set(0, 0, 0);
        controls.update();

        /* ==========================================
           光照
           ========================================== */
        const ambientLight = new THREE.AmbientLight(0x111122, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5e6, 2.5, 100, 1);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899cc, 0.4);
        fillLight.position.set(10, 15, 10);
        scene.add(fillLight);

        /* ==========================================
           星空粒子系统 (背景)
           ========================================== */
        function createStarfield() {
            const starCount = 8000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                // 均匀分布在球面上
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 80 + Math.random() * 60;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                // 颜色：暖白到冷白
                const temp = Math.random();
                if (temp > 0.7) {
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 0.8;
                } else if (temp > 0.3) {
                    colors[i * 3] = 0.85;
                    colors[i * 3 + 1] = 0.88;
                    colors[i * 3 + 2] = 0.95;
                } else {
                    colors[i * 3] = 0.7;
                    colors[i * 3 + 1] = 0.75;
                    colors[i * 3 + 2] = 0.9;
                }
                sizes[i] = Math.random() * 2.5 + 0.5;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            return stars;
        }

        const starField = createStarfield();

        /* ==========================================
           太阳
           ========================================== */
        function createSun() {
            // 太阳球体
            const sunGeo = new THREE.SphereGeometry(1.8, 64, 64);
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xffdd88,
                emissive: 0xffaa44,
                emissiveIntensity: 2.0,
                roughness: 0.3,
                metalness: 0.0,
            });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.castShadow = false;
            sun.userData = { name: '太阳', detail: 'G型主序星 · 太阳系中心恒星', type: 'star' };
            scene.add(sun);

            // 太阳光晕 (多个sprite)
            const glowTexture = createGlowTexture();
            for (let i = 0; i < 3; i++) {
                const spriteMat = new THREE.SpriteMaterial({
                    map: glowTexture,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    opacity: 0.4 - i * 0.1,
                    color: new THREE.Color(0xffcc88),
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(5 + i * 4, 5 + i * 4, 1);
                sprite.userData = { isGlow: true };
                sun.add(sprite);
            }

            return sun;
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 240, 200, 0.7)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 120, 0.3)');
            gradient.addColorStop(0.8, 'rgba(255, 160, 60, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 140, 40, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const sun = createSun();

        /* ==========================================
           行星数据与创建
           ========================================== */
        const planetConfigs = [
            { name: '水星', body: Astronomy.Body.Mercury, color: 0xb5b5b5, radius: 0.32, orbitR: 4.2, detail: '最小的行星 · 表面布满陨石坑', type: 'planet' },
            { name: '金星', body: Astronomy.Body.Venus, color: 0xe6c87a, radius: 0.55, orbitR: 6.5, detail: '最亮的行星 · 浓厚二氧化碳大气', type: 'planet' },
            { name: '地球', body: Astronomy.Body.Earth, color: 0x5b8fd6, radius: 0.58, orbitR: 9.0, detail: '我们的家园 · 唯一已知存在生命的星球', type: 'planet' },
            { name: '火星', body: Astronomy.Body.Mars, color: 0xc1440e, radius: 0.42, orbitR: 11.5, detail: '红色星球 · 拥有太阳系最高的火山', type: 'planet' },
            { name: '木星', body: Astronomy.Body.Jupiter, color: 0xd8a27a, radius: 1.4, orbitR: 16.0, detail: '气态巨行星 · 太阳系最大的行星', type: 'planet' },
            { name: '土星', body: Astronomy.Body.Saturn, color: 0xead6a6, radius: 1.15, orbitR: 21.0, detail: '壮丽的光环 · 密度低于水', type: 'planet' },
        ];

        const planetMeshes = [];
        const orbitLines = [];
        const planetLabels = [];
        const planetPositions3D = {}; // 存储行星3D坐标用于点击检测

        function createOrbitRing(radius, color = 0xffffff) {
            const points = [];
            const segments = 256;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.25,
                depthWrite: false,
            });
            const line = new THREE.LineLoop(geometry, material);
            scene.add(line);
            return line;
        }

        function createPlanet(config) {
            // 轨道环
            const orbit = createOrbitRing(config.orbitR, 0x8899cc);
            orbitLines.push(orbit);

            // 行星球体
            const geo = new THREE.SphereGeometry(config.radius, 48, 48);
            const mat = new THREE.MeshStandardMaterial({
                color: config.color,
                roughness: 0.6,
                metalness: 0.1,
                emissive: new THREE.Color(config.color).multiplyScalar(0.15),
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                name: config.name,
                detail: config.detail,
                type: config.type,
                body: config.body,
                orbitR: config.orbitR,
            };
            scene.add(mesh);
            planetMeshes.push(mesh);

            // 土星环
            if (config.name === '土星') {
                const ringGeo = new THREE.TorusGeometry(config.radius * 1.5, 0.15, 16, 100);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xd4c09a,
                    roughness: 0.7,
                    metalness: 0.0,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                ring.userData = { isRing: true };
                mesh.add(ring);

                const ring2Geo = new THREE.TorusGeometry(config.radius * 1.8, 0.08, 16, 100);
                const ring2 = new THREE.Mesh(ring2Geo, ringMat.clone());
                ring2.material.opacity = 0.4;
                ring2.rotation.x = Math.PI / 2.5;
                ring2.userData = { isRing: true };
                mesh.add(ring2);
            }

            // CSS2D 标签
            const labelDiv = document.createElement('div');
            labelDiv.textContent = config.name;
            labelDiv.style.color = 'rgba(255,255,255,0.7)';
            labelDiv.style.fontSize = '11px';
            labelDiv.style.letterSpacing = '0.1em';
            labelDiv.style.fontFamily = "'Georgia', serif";
            labelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
            labelDiv.style.pointerEvents = 'none';
            labelDiv.style.transition = 'opacity 0.3s';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, config.radius + 0.6, 0);
            mesh.add(label);
            planetLabels.push(label);

            return mesh;
        }

        // 创建所有行星
        planetConfigs.forEach(config => createPlanet(config));

        /* ==========================================
           ISS 标记
           ========================================== */
        function createIssMarker() {
            // 使用一个小的发光球体表示ISS
            const geo = new THREE.SphereGeometry(0.15, 16, 16);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x88ccff,
                emissiveIntensity: 3.0,
                roughness: 0.2,
                metalness: 0.8,
            });
            const marker = new THREE.Mesh(geo, mat);
            marker.userData = { name: 'ISS', detail: '国际空间站 · 实时追踪中', type: 'iss' };
            scene.add(marker);

            // ISS标签
            const labelDiv = document.createElement('div');
            labelDiv.textContent = 'ISS';
            labelDiv.style.color = 'rgba(200,230,255,0.9)';
            labelDiv.style.fontSize = '10px';
            labelDiv.style.letterSpacing = '0.2em';
            labelDiv.style.fontFamily = "'Georgia', serif";
            labelDiv.style.textShadow = '0 0 12px rgba(100,180,255,0.9)';
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, 0.25, 0);
            marker.add(label);

            // ISS轨道环 (在地球周围)
            const issOrbitPoints = [];
            const issOrbitRadius = 0.85; // 地球半径0.58 + 约0.27
            for (let i = 0; i <= 128; i++) {
                const angle = (i / 128) * Math.PI * 2;
                issOrbitPoints.push(new THREE.Vector3(
                    Math.cos(angle) * issOrbitRadius,
                    Math.sin(angle) * issOrbitRadius * 0.15, // 轻微倾斜
                    Math.sin(angle) * issOrbitRadius * 0.98
                ));
            }
            const issOrbitGeo = new THREE.BufferGeometry().setFromPoints(issOrbitPoints);
            const issOrbitMat = new THREE.LineBasicMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.4,
                depthWrite: false,
            });
            const issOrbitLine = new THREE.LineLoop(issOrbitGeo, issOrbitMat);
            issOrbitLine.userData = { isIssOrbit: true };
            scene.add(issOrbitLine);
            marker.userData.issOrbitLine = issOrbitLine;

            return marker;
        }

        const issMarker = createIssMarker();

        /* ==========================================
           小行星带 (视觉装饰)
           ========================================== */
        function createAsteroidBelt() {
            const count = 600;
            const positions = new Float32Array(count * 3);
            const beltInner = 13.5;
            const beltOuter = 15.0;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = beltInner + Math.random() * (beltOuter - beltInner);
                const y = (Math.random() - 0.5) * 0.8;
                positions[i * 3] = Math.cos(angle) * r;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = Math.sin(angle) * r;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x999988,
                size: 0.08,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const belt = new THREE.Points(geo, mat);
            belt.userData = { isBelt: true };
            scene.add(belt);
            return belt;
        }

        const asteroidBelt = createAsteroidBelt();

        /* ==========================================
           点击交互 (Raycaster)
           ========================================== */
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            // 只检测行星和ISS标记
            const targets = [...planetMeshes, issMarker];
            return raycaster.intersectObjects(targets, true);
        }

        function updateInfoPanel(object) {
            const nameEl = document.getElementById('body-name');
            const detailEl = document.getElementById('body-detail');
            if (object && object.userData && object.userData.name) {
                nameEl.textContent = object.userData.name;
                detailEl.textContent = object.userData.detail;
            } else {
                nameEl.textContent = '太阳系';
                detailEl.textContent = '点击任意行星查看详细信息';
            }
        }

        renderer.domElement.addEventListener('click', (event) => {
            const intersects = getIntersects(event);
            if (intersects.length > 0) {
                // 找到第一个非光晕、非轨道的对象
                let hitObject = null;
                for (const intersect of intersects) {
                    let obj = intersect.object;
                    // 向上遍历查找有userData.name的父级
                    while (obj) {
                        if (obj.userData && obj.userData.name && obj.userData.type !== 'glow') {
                            hitObject = obj;
                            break;
                        }
                        obj = obj.parent;
                    }
                    if (hitObject) break;
                }
                updateInfoPanel(hitObject);
            } else {
                updateInfoPanel(null);
            }
        });

        // hover效果
        renderer.domElement.addEventListener('mousemove', (event) => {
            const intersects = getIntersects(event);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
            // 高亮效果
            planetMeshes.forEach(mesh => {
                if (mesh.material && mesh.material.emissive) {
                    mesh.material.emissive.set(mesh.userData.hovered ? new THREE.Color(mesh.material.color).multiplyScalar(0.5) :
                        new THREE.Color(mesh.material.color).multiplyScalar(0.15));
                }
            });
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData?.name) obj = obj.parent;
                if (obj && obj.userData?.name) {
                    obj.userData.hovered = true;
                    if (obj.material && obj.material.emissive) {
                        obj.material.emissive.set(new THREE.Color(obj.material.color).multiplyScalar(0.5));
                    }
                }
            }
        });

        /* ==========================================
           时间控制
           ========================================== */
        let timeScale = 1;
        const timeSpeeds = [0.1, 0.5, 1, 2, 5, 10, 50, 100, 500];
        let timeSpeedIndex = 2; // 1x

        function updateTimeDisplay() {
            const display = document.getElementById('speed-display');
            const speed = timeSpeeds[timeSpeedIndex];
            if (speed >= 1) {
                display.textContent = speed + '×';
            } else {
                display.textContent = speed + '×';
            }
            timeScale = speed;
        }

        document.getElementById('btn-faster').addEventListener('click', () => {
            timeSpeedIndex = Math.min(timeSpeedIndex + 1, timeSpeeds.length - 1);
            updateTimeDisplay();
        });
        document.getElementById('btn-slower').addEventListener('click', () => {
            timeSpeedIndex = Math.max(timeSpeedIndex - 1, 0);
            updateTimeDisplay();
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            timeSpeedIndex = 2;
            updateTimeDisplay();
        });
        updateTimeDisplay();

        /* ==========================================
           ISS 实时数据
           ========================================== */
        let issLat = 0;
        let issLon = 0;
        let issAlt = 420;
        let issInitialized = false;

        async function fetchIssData() {
            try {
                const response = await fetch('https://api.open-notify.org/iss-now.json', { mode: 'cors' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (data && data.iss_position) {
                    issLat = parseFloat(data.iss_position.latitude);
                    issLon = parseFloat(data.iss_position.longitude);
                    issAlt = 420 + Math.sin(Date.now() / 10000) * 3;
                    issInitialized = true;
                    updateIssDisplay();
                }
            } catch (err) {
                console.warn('ISS数据获取失败', err);
                document.getElementById('iss-detail').textContent = '数据暂不可用 · 重试中...';
            }
        }

        function updateIssDisplay() {
            document.getElementById('iss-lat').textContent = issLat.toFixed(4) + '°';
            document.getElementById('iss-lon').textContent = issLon.toFixed(4) + '°';
            document.getElementById('iss-alt').textContent = issAlt.toFixed(0) + ' km';
            document.getElementById('iss-detail').textContent = `实时位置 · 更新于 ${new Date().toLocaleTimeString()}`;
        }

        // 初始获取 + 每10秒更新
        fetchIssData();
        setInterval(fetchIssData, 10000);

        /* ==========================================
           经纬度转3D坐标
           ========================================== */
        function latLonToPosition(lat, lon, radius) {
            const latRad = THREE.MathUtils.degToRad(lat);
            const lonRad = THREE.MathUtils.degToRad(lon);
            const x = radius * Math.cos(latRad) * Math.cos(lonRad);
            const y = radius * Math.sin(latRad);
            const z = radius * Math.cos(latRad) * Math.sin(lonRad);
            return new THREE.Vector3(x, y, z);
        }

        /* ==========================================
           更新行星位置 (使用 Astronomy Engine)
           ========================================== */
        const simulationTime = { offsetMs: 0 };

        function updatePlanetPositions() {
            if (!window.Astronomy) return;
            const now = new Date(Date.now() + simulationTime.offsetMs);

            // 找到地球的位置，用于ISS定位
            let earthWorldPos = new THREE.Vector3(0, 0, 0);

            for (const mesh of planetMeshes) {
                const body = mesh.userData.body;
                if (!body) continue;
                try {
                    const vec = Astronomy.HelioVector(body, now);
                    // 缩放因子：1 AU ≈ 9 场景单位（地球轨道半径）
                    const auScale = 9.0;
                    const x = vec.x * auScale;
                    const y = vec.y * auScale;
                    const z = vec.z * auScale;

                    // 平滑过渡
                    mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);

                    // 存储行星世界坐标
                    if (mesh.userData.name === '地球') {
                        earthWorldPos.copy(mesh.position);
                    }

                    // 行星自转
                    mesh.rotation.y += 0.005 * timeScale;
                    if (mesh.userData.name === '土星') {
                        mesh.rotation.x = 0.2;
                    }
                } catch (e) {
                    console.warn('计算行星位置失败', mesh.userData.name, e);
                }
            }

            // 更新ISS位置
            if (issInitialized) {
                const issRadius = 0.58 + 0.22; // 地球半径 + ISS高度(缩放到场景)
                const issPos = latLonToPosition(issLat, issLon, issRadius);
                // ISS位置相对于地球
                const issWorldPos = earthWorldPos.clone().add(issPos);
                issMarker.position.lerp(issWorldPos, 0.15);

                // 更新ISS轨道环的位置
                if (issMarker.userData.issOrbitLine) {
                    issMarker.userData.issOrbitLine.position.copy(earthWorldPos);
                }
            }

            // 更新行星标签可见性（根据距离）
            const camDist = camera.position.length();
            planetLabels.forEach(label => {
                const parent = label.parent;
                if (parent) {
                    const distToCamera = parent.position.distanceTo(camera.position);
                    label.element.style.opacity = distToCamera < 40 ? '1' : '0.3';
                }
            });
        }

        /* ==========================================
           动画循环
           ========================================== */
        function animate() {
            requestAnimationFrame(animate);

            // 更新行星位置
            updatePlanetPositions();

            // 星空缓慢旋转
            starField.rotation.y += 0.00015 * timeScale;
            starField.rotation.x += 0.00005 * timeScale;

            // 小行星带旋转
            if (asteroidBelt) {
                asteroidBelt.rotation.y += 0.001 * timeScale;
            }

            // 太阳光晕脉动
            sun.children.forEach(child => {
                if (child.isSprite && child.userData.isGlow) {
                    const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.05;
                    const baseScale = parseFloat(child.scale.x) / pulse;
                    child.scale.set(baseScale * pulse, baseScale * pulse, 1);
                }
            });

            // 更新控制器
            controls.update();

            // 渲染
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        /* ==========================================
           窗口大小调整
           ========================================== */
        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }

        window.addEventListener('resize', onResize);

        /* ==========================================
           启动
           ========================================== */
        animate();
        onResize();

        // 初始更新行星位置
        setTimeout(() => {
            updatePlanetPositions();
        }, 500);

        console.log('🌌 3D宇宙沙盒已启动');
        console.log('🖱️ 拖拽旋转 | 滚轮缩放 | 右键平移 | 点击天体查看信息');
        console.log('⏱️ 使用右上角按钮调整时间流速');
    </script>
</body>
</html>
