<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D宇宙沙盒 · 真实行星 / ISS / 星空</title>
    <style>
        :root {
            --bg: #020210;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(8, 10, 24, 0.72);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.3) 75%,
                    rgba(0, 0, 0, 0.6) 100%);
        }

        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            transition: all 0.4s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.7rem;
            text-align: center;
        }

        #info-panel {
            left: 1.5rem;
            bottom: 2rem;
            width: 280px;
            min-height: 120px;
            cursor: default;
        }
        #info-panel .body-name {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        #info-panel .body-detail {
            font-size: 0.65rem;
            color: var(--text-faint);
            line-height: 1.6;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }
        #info-panel .body-stats {
            border-top: 1px solid var(--hairline);
            padding-top: 0.6rem;
            font-size: 0.62rem;
            color: var(--text-secondary);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem 1rem;
            letter-spacing: 0.06em;
        }
        #info-panel .body-stats .stat-item {
            display: flex;
            flex-direction: column;
        }
        #info-panel .body-stats .stat-label {
            color: var(--text-faint);
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #info-panel .body-stats .stat-value {
            font-family: var(--font-serif);
            color: rgba(200, 220, 255, 0.9);
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
        }
        #info-panel .hint-click {
            font-size: 0.55rem;
            color: var(--text-faint);
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        #iss-panel {
            right: 1.5rem;
            bottom: 2rem;
            width: 220px;
            cursor: default;
        }
        .iss-coord {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-family: var(--font-serif);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .iss-coord span:first-child {
            color: var(--text-faint);
            letter-spacing: 0.1em;
            font-family: var(--font-sans);
            font-size: 0.6rem;
        }
        .iss-coord span:last-child {
            font-variant-numeric: tabular-nums;
            color: rgba(200, 220, 255, 0.9);
        }
        .iss-detail {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            text-align: center;
            margin-top: 0.6rem;
            border-top: 1px solid var(--hairline);
            padding-top: 0.6rem;
        }

        .hint-bar {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 0.58rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            backdrop-filter: blur(4px);
        }

        @media (max-width: 768px) {
            .panel {
                font-size: 0.62rem;
                padding: 0.7rem;
            }
            #info-panel {
                left: 0.6rem;
                bottom: 1.2rem;
                width: 200px;
            }
            #info-panel .body-stats {
                grid-template-columns: 1fr;
            }
            #iss-panel {
                right: 0.6rem;
                bottom: 1.2rem;
                width: 170px;
            }
            .hint-bar {
                font-size: 0.5rem;
                letter-spacing: 0.25em;
            }
        }
        @media (max-width: 480px) {
            #info-panel {
                display: none;
            }
            #iss-panel {
                width: 150px;
                right: 0.4rem;
                bottom: 1rem;
                font-size: 0.55rem;
            }
            .iss-coord {
                font-size: 0.6rem;
            }
            .hint-bar {
                font-size: 0.45rem;
                letter-spacing: 0.2em;
                top: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="hint-bar">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击天体</div>

    <div class="panel" id="info-panel">
        <div class="body-name" id="body-name">太阳系</div>
        <div class="body-detail" id="body-detail">点击任意行星查看详细信息</div>
        <div class="body-stats" id="body-stats"></div>
        <div class="hint-click">✦ 点击天体交互 ✦</div>
    </div>

    <div class="panel" id="iss-panel">
        <h3>ISS · Live</h3>
        <div class="iss-coord">
            <span>纬度</span>
            <span id="iss-lat">--</span>
        </div>
        <div class="iss-coord">
            <span>经度</span>
            <span id="iss-lon">--</span>
        </div>
        <div class="iss-coord">
            <span>高度</span>
            <span id="iss-alt">--</span>
        </div>
        <div class="iss-detail" id="iss-detail">等待实时数据...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- 常量 ----------
        const AU_KM = 149597870.7; // 1天文单位 = 公里
        const AU_SCALE = 10; // 场景单位：1 AU = 10 单位

        // ---------- 初始化场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);

        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(20, 12, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 5;
        controls.maxDistance = 500;
        controls.maxPolarAngle = Math.PI;
        controls.target.set(0, 0, 0);
        controls.update();

        // ---------- 光照 ----------
        const ambientLight = new THREE.AmbientLight(0x111122, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5e6, 3.0, 200, 1);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899cc, 0.4);
        fillLight.position.set(10, 15, 10);
        scene.add(fillLight);

        // ---------- 星空背景粒子 ----------
        function createStarfield() {
            const starCount = 12000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 400 + Math.random() * 200;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const temp = Math.random();
                if (temp > 0.7) {
                    colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.8;
                } else if (temp > 0.3) {
                    colors[i * 3] = 0.85; colors[i * 3 + 1] = 0.88; colors[i * 3 + 2] = 0.95;
                } else {
                    colors[i * 3] = 0.7; colors[i * 3 + 1] = 0.75; colors[i * 3 + 2] = 0.9;
                }
                sizes[i] = Math.random() * 2.0 + 0.5;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            return stars;
        }
        const starField = createStarfield();

        // ---------- 太阳 ----------
        function createSun() {
            const sunGeo = new THREE.SphereGeometry(2.2, 64, 64);
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xffcc66,
                emissive: 0xffaa44,
                emissiveIntensity: 2.5,
                roughness: 0.4,
                metalness: 0.0,
            });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.castShadow = false;
            sunMesh.userData = { name: '太阳', detail: 'G型主序星 · 太阳系中心恒星', type: 'star' };
            scene.add(sunMesh);

            const glowTexture = createGlowTexture();
            for (let i = 0; i < 4; i++) {
                const spriteMat = new THREE.SpriteMaterial({
                    map: glowTexture,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    opacity: 0.35 - i * 0.07,
                    color: new THREE.Color(0xffcc88),
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(6 + i * 5, 6 + i * 5, 1);
                sprite.userData = { isGlow: true };
                sunMesh.add(sprite);
            }
            return sunMesh;
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 240, 200, 0.7)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 120, 0.3)');
            gradient.addColorStop(0.8, 'rgba(255, 160, 60, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 140, 40, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        const sun = createSun();

        // ---------- 程序化纹理生成 ----------
        function generatePlanetTexture(baseColor, options = {}) {
            const width = 512, height = 256;
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, width, height);

            const noiseCount = options.noiseCount || 800;
            for (let i = 0; i < noiseCount; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = Math.random() * 4 + 1;
                const alpha = Math.random() * 0.3 + 0.05;
                const lightness = Math.random() > 0.5 ? 255 : 0;
                ctx.fillStyle = `rgba(${lightness},${lightness},${lightness},${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (options.bands) {
                for (let i = 0; i < options.bands; i++) {
                    const y = Math.random() * height;
                    const bandHeight = Math.random() * 20 + 5;
                    const alpha = Math.random() * 0.3 + 0.1;
                    const lightness = Math.random() > 0.5 ? 255 : 0;
                    ctx.fillStyle = `rgba(${lightness},${lightness},${lightness},${alpha})`;
                    ctx.fillRect(0, y, width, bandHeight);
                }
            }

            if (options.spot) {
                const spotX = width * 0.7;
                const spotY = height * 0.6;
                const spotR = options.spotRadius || 15;
                const gradient = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, spotR);
                gradient.addColorStop(0, options.spotColor || 'rgba(200,80,50,0.7)');
                gradient.addColorStop(0.7, options.spotColor || 'rgba(200,80,50,0.3)');
                gradient.addColorStop(1, 'rgba(200,80,50,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(spotX, spotY, spotR, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // ---------- 行星配置（含公转周期）----------
        const planetConfigs = [
            { name: '水星', body: Astronomy.Body.Mercury, color: 0x8c8c8c, radius: 0.35, orbitAU: 0.39, detail: '最小的行星 · 表面布满陨石坑', periodDays: 87.97, texture: () => generatePlanetTexture('#8c8c8c', { noiseCount: 1200 }) },
            { name: '金星', body: Astronomy.Body.Venus, color: 0xe6c87a, radius: 0.55, orbitAU: 0.72, detail: '最亮的行星 · 浓厚二氧化碳大气', periodDays: 224.7, texture: () => generatePlanetTexture('#e6c87a', { noiseCount: 600, bands: 4 }) },
            { name: '地球', body: Astronomy.Body.Earth, color: 0x4a7eb5, radius: 0.58, orbitAU: 1.0, detail: '我们的家园 · 唯一已知存在生命的星球', periodDays: 365.25, texture: () => generatePlanetTexture('#4a7eb5', { noiseCount: 1000, spot: true, spotRadius: 18, spotColor: 'rgba(60,120,60,0.6)' }) },
            { name: '火星', body: Astronomy.Body.Mars, color: 0xc1440e, radius: 0.42, orbitAU: 1.52, detail: '红色星球 · 拥有太阳系最高的火山', periodDays: 686.98, texture: () => generatePlanetTexture('#c1440e', { noiseCount: 1500, spot: true, spotRadius: 12, spotColor: 'rgba(80,40,20,0.5)' }) },
            { name: '木星', body: Astronomy.Body.Jupiter, color: 0xd8a27a, radius: 1.4, orbitAU: 5.2, detail: '气态巨行星 · 太阳系最大的行星', periodDays: 4332.59, texture: () => generatePlanetTexture('#d8a27a', { noiseCount: 400, bands: 12, spot: true, spotRadius: 20, spotColor: 'rgba(200,80,50,0.8)' }) },
            { name: '土星', body: Astronomy.Body.Saturn, color: 0xead6a6, radius: 1.15, orbitAU: 9.58, detail: '壮丽的光环 · 密度低于水', periodDays: 10759.22, texture: () => generatePlanetTexture('#ead6a6', { noiseCount: 500, bands: 8 }) },
            { name: '天王星', body: Astronomy.Body.Uranus, color: 0x6fd4d4, radius: 0.8, orbitAU: 19.2, detail: '冰巨星 · 自转轴倾斜97.77°', periodDays: 30688.5, texture: () => generatePlanetTexture('#6fd4d4', { noiseCount: 300, bands: 3 }) },
            { name: '海王星', body: Astronomy.Body.Neptune, color: 0x4166f5, radius: 0.8, orbitAU: 30.1, detail: '最远的行星 · 风速可达2100km/h', periodDays: 60182.0, texture: () => generatePlanetTexture('#4166f5', { noiseCount: 300, bands: 3, spot: true, spotRadius: 15, spotColor: 'rgba(30,30,80,0.6)' }) },
        ];

        const planetMeshes = [];
        const orbitLines = [];
        const planetLabels = [];

        function createOrbitRing(radiusAU) {
            const points = [];
            const segments = 512;
            const r = radiusAU * AU_SCALE;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x8899cc,
                transparent: true,
                opacity: 0.2,
                depthWrite: false,
            });
            const line = new THREE.LineLoop(geometry, material);
            scene.add(line);
            return line;
        }

        function createPlanet(config) {
            const orbit = createOrbitRing(config.orbitAU);
            orbitLines.push(orbit);

            const geo = new THREE.SphereGeometry(config.radius, 64, 64);
            const texture = config.texture();
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.7,
                metalness: 0.1,
                emissive: new THREE.Color(config.color).multiplyScalar(0.1),
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                name: config.name,
                detail: config.detail,
                type: 'planet',
                body: config.body,
                orbitAU: config.orbitAU,
                periodDays: config.periodDays,
            };
            scene.add(mesh);
            planetMeshes.push(mesh);

            if (config.name === '土星') {
                const ringGeo = new THREE.TorusGeometry(config.radius * 1.6, 0.12, 16, 200);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xd4c09a,
                    roughness: 0.6,
                    metalness: 0.0,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                ring.userData = { isRing: true };
                mesh.add(ring);

                const ring2Geo = new THREE.TorusGeometry(config.radius * 1.9, 0.06, 16, 200);
                const ring2 = new THREE.Mesh(ring2Geo, ringMat.clone());
                ring2.material.opacity = 0.4;
                ring2.rotation.x = Math.PI / 2.5;
                ring2.userData = { isRing: true };
                mesh.add(ring2);
            }

            const labelDiv = document.createElement('div');
            labelDiv.textContent = config.name;
            labelDiv.style.color = 'rgba(255,255,255,0.7)';
            labelDiv.style.fontSize = '11px';
            labelDiv.style.letterSpacing = '0.1em';
            labelDiv.style.fontFamily = "'Georgia', serif";
            labelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, config.radius + 0.6, 0);
            mesh.add(label);
            planetLabels.push(label);

            return mesh;
        }

        planetConfigs.forEach(config => createPlanet(config));

        // ---------- 月球 ----------
        function createMoon() {
            const geo = new THREE.SphereGeometry(0.18, 32, 32);
            const texture = generatePlanetTexture('#aaaaaa', { noiseCount: 900 });
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.9,
                metalness: 0.0,
            });
            const moon = new THREE.Mesh(geo, mat);
            moon.castShadow = true;
            moon.receiveShadow = true;
            moon.userData = {
                name: '月球',
                detail: '地球唯一的天然卫星',
                type: 'moon',
                periodDays: 27.32,
            };
            scene.add(moon);
            return moon;
        }
        const moon = createMoon();
        let moonParent = planetMeshes.find(m => m.userData.name === '地球');

        // ---------- ISS 标记 ----------
        function createIssMarker() {
            const geo = new THREE.SphereGeometry(0.15, 16, 16);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x88ccff,
                emissiveIntensity: 3.0,
                roughness: 0.2,
                metalness: 0.8,
            });
            const marker = new THREE.Mesh(geo, mat);
            marker.userData = {
                name: 'ISS',
                detail: '国际空间站 · 实时追踪中',
                type: 'iss',
                periodDays: 0.064, // 约92.68分钟
                avgSpeedKmS: 7.66,
            };
            scene.add(marker);

            const labelDiv = document.createElement('div');
            labelDiv.textContent = 'ISS';
            labelDiv.style.color = 'rgba(200,230,255,0.9)';
            labelDiv.style.fontSize = '10px';
            labelDiv.style.letterSpacing = '0.2em';
            labelDiv.style.fontFamily = "'Georgia', serif";
            labelDiv.style.textShadow = '0 0 12px rgba(100,180,255,0.9)';
            labelDiv.style.pointerEvents = 'none';
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, 0.25, 0);
            marker.add(label);

            return marker;
        }
        const issMarker = createIssMarker();

        // ---------- 点击交互 & 信息计算 ----------
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const targets = [...planetMeshes, issMarker, moon];
            return raycaster.intersectObjects(targets, true);
        }

        function formatDistanceAU(au) {
            return `${au.toFixed(2)} AU`;
        }
        function formatDistanceKM(km) {
            if (km >= 1e6) return `${(km / 1e6).toFixed(2)}M km`;
            if (km >= 1e3) return `${(km / 1e3).toFixed(2)}k km`;
            return `${km.toFixed(0)} km`;
        }

        function computeHelioSpeed(body, now, deltaSeconds = 3600) {
            const vec1 = Astronomy.HelioVector(body, now);
            const vec2 = Astronomy.HelioVector(body, new Date(now.getTime() + deltaSeconds * 1000));
            const dx = (vec2.x - vec1.x) * AU_KM;
            const dy = (vec2.y - vec1.y) * AU_KM;
            const dz = (vec2.z - vec1.z) * AU_KM;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            return dist / deltaSeconds; // km/s
        }

        function updateInfoPanel(hitObject) {
            const nameEl = document.getElementById('body-name');
            const detailEl = document.getElementById('body-detail');
            const statsEl = document.getElementById('body-stats');

            if (!hitObject || !hitObject.userData || !hitObject.userData.name) {
                nameEl.textContent = '太阳系';
                detailEl.textContent = '点击任意行星查看详细信息';
                statsEl.innerHTML = '';
                return;
            }

            const ud = hitObject.userData;
            nameEl.textContent = ud.name;
            detailEl.textContent = ud.detail || '';

            const now = new Date();
            const earthVec = Astronomy.HelioVector(Astronomy.Body.Earth, now);

            let distanceToSunAU = 0;
            let distanceToEarthAU = 0;
            let speedKmS = 0;
            let periodDisplay = '--';

            if (ud.type === 'star') {
                // 太阳
                distanceToSunAU = 0;
                distanceToEarthAU = Math.sqrt(earthVec.x*earthVec.x + earthVec.y*earthVec.y + earthVec.z*earthVec.z);
                periodDisplay = '--';
                speedKmS = 0;
            } else if (ud.type === 'planet') {
                const vec = Astronomy.HelioVector(ud.body, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(ud.body, now);
                if (ud.periodDays) {
                    periodDisplay = ud.periodDays >= 365 ? `${(ud.periodDays/365.25).toFixed(1)} 年` : `${ud.periodDays.toFixed(1)} 天`;
                }
            } else if (ud.type === 'moon') {
                // 月球：使用日心坐标
                const vec = Astronomy.HelioVector(Astronomy.Body.Moon, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(Astronomy.Body.Moon, now);
                if (ud.periodDays) periodDisplay = `${ud.periodDays.toFixed(1)} 天`;
            } else if (ud.type === 'iss') {
                // ISS 近似：日心距离 ≈ 地球日心距离；距地球距离 = ISS高度
                distanceToSunAU = Math.sqrt(earthVec.x*earthVec.x + earthVec.y*earthVec.y + earthVec.z*earthVec.z);
                distanceToEarthAU = 0.0028; // 约420 km -> AU
                speedKmS = ud.avgSpeedKmS || 7.66;
                periodDisplay = '92.7 分钟';
            }

            const distSunKM = distanceToSunAU * AU_KM;
            const distEarthKM = distanceToEarthAU * AU_KM;

            statsEl.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">距太阳</span>
                    <span class="stat-value">${formatDistanceAU(distanceToSunAU)}</span>
                    <span class="stat-value" style="font-size:0.55rem;color:var(--text-faint)">${formatDistanceKM(distSunKM)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">距地球</span>
                    <span class="stat-value">${formatDistanceAU(distanceToEarthAU)}</span>
                    <span class="stat-value" style="font-size:0.55rem;color:var(--text-faint)">${formatDistanceKM(distEarthKM)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">公转周期</span>
                    <span class="stat-value">${periodDisplay}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">速度</span>
                    <span class="stat-value">${speedKmS.toFixed(2)} km/s</span>
                </div>
            `;
        }

        renderer.domElement.addEventListener('click', (event) => {
            const intersects = getIntersects(event);
            if (intersects.length > 0) {
                let hitObject = null;
                for (const intersect of intersects) {
                    let obj = intersect.object;
                    while (obj) {
                        if (obj.userData && obj.userData.name && obj.userData.type !== 'glow') {
                            hitObject = obj;
                            break;
                        }
                        obj = obj.parent;
                    }
                    if (hitObject) break;
                }
                updateInfoPanel(hitObject);
            } else {
                updateInfoPanel(null);
            }
        });

        renderer.domElement.addEventListener('mousemove', (event) => {
            const intersects = getIntersects(event);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        // ---------- ISS 实时数据 ----------
        let issLat = 0, issLon = 0, issAlt = 420, issInitialized = false;

        async function fetchIssData() {
            try {
                const response = await fetch('https://api.open-notify.org/iss-now.json', { mode: 'cors' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (data && data.iss_position) {
                    issLat = parseFloat(data.iss_position.latitude);
                    issLon = parseFloat(data.iss_position.longitude);
                    issAlt = 420 + Math.sin(Date.now() / 10000) * 3;
                    issInitialized = true;
                    updateIssDisplay();
                }
            } catch (err) {
                document.getElementById('iss-detail').textContent = '数据暂不可用 · 重试中...';
            }
        }

        function updateIssDisplay() {
            document.getElementById('iss-lat').textContent = issLat.toFixed(4) + '°';
            document.getElementById('iss-lon').textContent = issLon.toFixed(4) + '°';
            document.getElementById('iss-alt').textContent = issAlt.toFixed(0) + ' km';
            document.getElementById('iss-detail').textContent = `实时位置 · 更新于 ${new Date().toLocaleTimeString()}`;
        }

        fetchIssData();
        setInterval(fetchIssData, 10000);

        // ---------- 经纬度转场景坐标 ----------
        function latLonToPosition(lat, lon, radius) {
            const latRad = THREE.MathUtils.degToRad(lat);
            const lonRad = THREE.MathUtils.degToRad(lon);
            return new THREE.Vector3(
                radius * Math.cos(latRad) * Math.cos(lonRad),
                radius * Math.sin(latRad),
                radius * Math.cos(latRad) * Math.sin(lonRad)
            );
        }

        // ---------- 更新行星位置 ----------
        function updatePlanetPositions() {
            if (!window.Astronomy) return;
            const now = new Date();
            let earthWorldPos = new THREE.Vector3(0, 0, 0);

            for (const mesh of planetMeshes) {
                const body = mesh.userData.body;
                if (!body) continue;
                try {
                    const vec = Astronomy.HelioVector(body, now);
                    const x = vec.x * AU_SCALE;
                    const y = vec.y * AU_SCALE;
                    const z = vec.z * AU_SCALE;
                    mesh.position.set(x, y, z);
                    if (mesh.userData.name === '地球') {
                        earthWorldPos.copy(mesh.position);
                        moonParent = mesh;
                    }
                    mesh.rotation.y += 0.003;
                } catch (e) {
                    console.warn('计算行星位置失败', mesh.userData.name, e);
                }
            }

            // 月球位置
            if (moonParent) {
                try {
                    const moonVec = Astronomy.EclipticGeoMoon(now);
                    const dist = moonVec.dist * AU_SCALE;
                    const lat = moonVec.lat;
                    const lon = moonVec.lon;
                    const x = dist * Math.cos(lat) * Math.cos(lon);
                    const y = dist * Math.sin(lat);
                    const z = dist * Math.cos(lat) * Math.sin(lon);
                    moon.position.copy(moonParent.position).add(new THREE.Vector3(x, y, z));
                    moon.rotation.y += 0.005;
                } catch (e) {
                    console.warn('计算月球位置失败', e);
                }
            }

            // ISS位置
            if (issInitialized) {
                const issRadius = 0.58 + 0.22;
                const issPos = latLonToPosition(issLat, issLon, issRadius);
                issMarker.position.copy(earthWorldPos).add(issPos);
            }
        }

        // ---------- 动画循环 ----------
        function animate() {
            requestAnimationFrame(animate);
            updatePlanetPositions();
            starField.rotation.y += 0.0001;
            starField.rotation.x += 0.00003;

            sun.children.forEach(child => {
                if (child.isSprite && child.userData.isGlow) {
                    const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.05;
                    const baseScale = parseFloat(child.scale.x) / pulse;
                    child.scale.set(baseScale * pulse, baseScale * pulse, 1);
                }
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- 窗口调整 ----------
        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }
        window.addEventListener('resize', onResize);

        // ---------- 启动 ----------
        animate();
        onResize();
        updatePlanetPositions();

        console.log('🌌 3D宇宙沙盒已启动 (精确天体位置 + 点击查看数据)');
        console.log('🖱️ 拖拽旋转 | 滚轮缩放 | 右键平移 | 点击天体');
    </script>
</body>
</html>
