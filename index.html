<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宇宙沙盒 · 3D Solar System</title>
  <style>
    html, body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; background: #000; }
    #main-container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; color: #9aa4b5; font-size: 18px; z-index: 999; letter-spacing: 2px;
    }
    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 18px; font-weight: 300; letter-spacing: 4px; z-index: 10;
      text-shadow: 0 0 14px rgba(120,180,255,.55); pointer-events: none; white-space: nowrap;
    }
    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: #667; font-size: 12px; letter-spacing: 1px; z-index: 10; pointer-events: none; text-align: center;
    }
    #hint b { color: #aac; }
    #info-panel {
      position: fixed; top: 60px; right: 18px; z-index: 20;
      width: 220px; max-height: 320px; overflow-y: auto;
      background: rgba(10,15,30,.85); border: 1px solid rgba(100,150,255,.35);
      border-radius: 10px; padding: 14px 16px; color: #e8eef7;
      box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(6px);
      display: none;
    }
    #info-panel .ip-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    #info-panel .ip-row { font-size: 13px; margin: 5px 0; color: #b8c4d6; }
    #info-panel .ip-row span { color: #9fe2c0; font-weight: 500; }
    #info-close {
      position: absolute; top: 8px; right: 12px; cursor: pointer; color: #889; font-size: 16px;
      background: none; border: none; line-height: 1;
    }
    #info-close:hover { color: #fff; }
    @media (max-width: 600px) { #title { font-size: 14px; } #info-panel { width: 180px; } }
  </style>
</head>
<body>
  <div id="loading">🌌 宇宙沙盒加载中…</div>
  <div id="title">SOLAR SYSTEM · 3D 宇宙沙盒</div>
  <div id="hint"><b>点击</b>行星查看信息 · <b>拖动</b>旋转 · <b>滚轮</b>缩放</div>
  <div id="main-container"></div>

  <div id="info-panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name" id="ip-name">-</div>
    <div class="ip-row">距太阳：<span id="ip-dist">-</span></div>
    <div class="ip-row">实时位置：[<span id="ip-pos">-</span>]</div>
    <div class="ip-row">运行状态：<span id="ip-status">-</span></div>
  </div>

  <script src="./build/spacekit.js"></script>
  <script>
    // ===== 宇宙沙盒 · SpaceKit =====
    // 每颗行星: key/label/轨道AU/真实半径比例(以木星69911km为基准1.0)/颜色
    const PLANETS = [
      { key: 'sun',      label: '太阳',   au: 0,    r: 2.6,   dist: '恒星中心' },
      { key: 'mercury',  label: '水星',   au: 0.39, r: 0.034, dist: '0.39 AU' },
      { key: 'venus',    label: '金星',   au: 0.72, r: 0.084, dist: '0.72 AU' },
      { key: 'earth',    label: '地球',   au: 1.00, r: 0.089, dist: '1.00 AU' },
      { key: 'mars',     label: '火星',   au: 1.52, r: 0.047, dist: '1.52 AU' },
      { key: 'jupiter',  label: '木星',   au: 5.20, r: 1.0,   dist: '5.20 AU' },
      { key: 'saturn',   label: '土星',   au: 9.58, r: 0.84,  dist: '9.58 AU' },
      { key: 'uranus',   label: '天王星', au: 19.2, r: 0.36,  dist: '19.2 AU' },
      { key: 'neptune',  label: '海王星', au: 30.1, r: 0.35,  dist: '30.1 AU' },
    ];
    // 半径显示放大系数：真实比例下行星过小不可见，统一放大让肉眼可辨且保持相对比例
    const SIZE_SCALE = 22;

    const viz = new Spacekit.Simulation(document.getElementById('main-container'), {
      basePath: './',
      unitsPerAu: 100.0,              // 1 AU = 100 单位 -> 轨道距离符合真实AU比
      camera: { initialPosition: [150, 110, 220], enableDrift: true }, // 拉远相机看完整太阳系
    });

    viz.createStars();
    viz.createAmbientLight();
    viz.createLight([0, 0, 0]);

    // ===== 创建天体：太阳用Sprite，行星用 createSphere(3D球体Mesh, 可拾取) =====
    const objects = {};

    // 太阳(静态Sprite, 带辉光)
    objects.sun = viz.createObject('sun', Spacekit.SpaceObjectPresets.SUN);

    PLANETS.filter(p => p.key !== 'sun').forEach(p => {
      const preset = Spacekit.SpaceObjectPresets[p.key.toUpperCase()];
      if (!preset) return;
      const radius = Math.max(p.r * SIZE_SCALE, 0.4); // 保证最小可点击
      try {
        objects[p.key] = viz.createSphere(p.key, {
          textureUrl: './assets/textures/' + p.key + '.jpg',
          radius: radius,                                   // 真实半径比例 x 放大系数
          ephem: preset.ephem,                              // 真实AU轨道
          levelsOfDetail: [
            { radii: 0, segments: 48 },
            { radii: 80, segments: 24 },
            { radii: 160, segments: 12 },
          ],
          labelText: p.label,   // 名称标签
        });
      } catch (e) {
        console.warn('创建' + p.label + '失败', e);
        // 兜底：用原始preset对象
        try { objects[p.key] = viz.createObject(p.key, Object.assign({}, preset, { labelText: p.label })); } catch (e2) {}
      }
    });

    // ===== 控制速度 =====
    try { viz.setJdPerSecond(5); } catch (e) {}  // 5天/秒，慢速以便观察和点击

    // 隐藏 loading，暴露THREE
    setTimeout(() => {
      const l = document.getElementById('loading');
      if (l) l.style.display = 'none';
      window.THREE = Spacekit.THREE;
      buildMeshMap();
    }, 600);

    // ===== 点击拾取(Raycaster on Mesh球体) =====
    const meshMap = new Map();
    function buildMeshMap() {
      meshMap.clear();
      Object.keys(objects).forEach(k => {
        const obj = objects[k];
        if (!obj || !obj.get3jsObjects) return;
        let list = [];
        try { list = obj.get3jsObjects() || []; } catch (e) { return; }
        const root = list[0];
        if (!root) return;
        // 递归收集所有子Mesh映射到该key
        if (root.traverse) {
          root.traverse(ch => { if (ch && ch.isMesh) meshMap.set(ch, k); });
        } else {
          meshMap.set(root, k);
        }
        meshMap.set(root, k);
      });
    }

    (function initInteractions() {
      const canvas = viz.getSimulationElement();
      if (!canvas) return;
      const camera = viz.getViewer().getCamera();
      const TH = Spacekit.THREE;
      const raycaster = new TH.Raycaster();
      const pointer = new TH.Vector2();

      let downPos = null, moved = false;
      canvas.addEventListener('pointerdown', e => { downPos = {x:e.clientX,y:e.clientY}; moved = false; });
      canvas.addEventListener('pointermove', e => {
        if (downPos) { const dx=e.clientX-downPos.x, dy=e.clientY-downPos.y; if (Math.abs(dx)+Math.abs(dy)>6) moved=true; }
        try {
          const rect = canvas.getBoundingClientRect();
          pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
          pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(Array.from(meshMap.keys()), true);
          canvas.style.cursor = hits.length ? 'pointer' : 'grab';
        } catch (err) {}
      });
      canvas.addEventListener('pointerup', e => {
        if (moved) { downPos = null; return; }
        try {
          const rect = canvas.getBoundingClientRect();
          pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
          pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(Array.from(meshMap.keys()), true);
          if (hits.length > 0) {
            let node = hits[0].object, key = null;
            while (node) {
              if (meshMap.has(node)) { key = meshMap.get(node); break; }
              node = node.parent;
            }
            if (key) showInfo(key);
          }
        } catch (err) {}
        downPos = null;
      });

      function showInfo(key) {
        const info = PLANETS.find(p => p.key === key);
        if (!info) return;
        const panel = document.getElementById('info-panel');
        document.getElementById('ip-name').textContent = info.label;
        document.getElementById('ip-dist').textContent = info.dist;
        const obj = objects[key];
        let posTxt = '-';
        if (obj && obj.getPosition) {
          try {
            const v = obj.getPosition(viz.getJd());
            if (v) posTxt = `${v.x.toFixed(1)}, ${v.y.toFixed(1)}, ${v.z.toFixed(1)}`;
          } catch (e) {}
        }
        document.getElementById('ip-pos').textContent = posTxt;
        document.getElementById('ip-status').textContent = (key==='sun') ? '恒星(自转)' : '公转中';
        panel.style.display = 'block';
      }

      document.getElementById('info-close').addEventListener('click', e => {
        e.stopPropagation();
        document.getElementById('info-panel').style.display = 'none';
      });
    })();
  </script>
</body>
</html>
