<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D宇宙沙盒 · 真实行星 / 月球 / 星空</title>
    <style>
        :root {
            --bg: #020210;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.25);
            --accent: rgba(180, 200, 255, 0.7);
            --hairline: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(8, 10, 24, 0.72);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font-serif: 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.3) 75%,
                    rgba(0, 0, 0, 0.6) 100%);
        }

        .panel {
            position: fixed;
            z-index: 5;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            color: var(--text-secondary);
            font-size: 1.02rem;
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            transition: all 0.4s ease;
        }
        .panel h3 {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 0.7rem;
            text-align: center;
        }

        #info-panel {
            left: 1.5rem;
            bottom: 2rem;
            width: 320px;
            min-height: 120px;
            cursor: default;
        }
        #info-panel .body-name {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        #info-panel .body-detail {
            font-size: 0.95rem;
            color: var(--text-faint);
            line-height: 1.6;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }
        #info-panel .body-intro {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            letter-spacing: 0.03em;
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
            padding: 0.5rem 0;
            margin-bottom: 0.55rem;
        }
        #info-panel .body-stats {
            border-top: 1px solid var(--hairline);
            padding-top: 0.6rem;
            font-size: 0.92rem;
            color: var(--text-secondary);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem 1rem;
            letter-spacing: 0.06em;
        }
        #info-panel .body-stats .stat-item {
            display: flex;
            flex-direction: column;
        }
        #info-panel .body-stats .stat-label {
            color: var(--text-faint);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #info-panel .body-stats .stat-value {
            font-family: var(--font-serif);
            color: rgba(200, 220, 255, 0.9);
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
        }
        #info-panel .hint-click {
            font-size: 0.85rem;
            color: var(--text-faint);
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        /* ---------- 右侧天体列表菜单 ---------- */
        #body-menu {
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 176px;
            padding: 0.6rem 0.8rem;
        }
        #body-menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--text-secondary);
            font-family: var(--font-serif);
            font-size: 0.92rem;
            letter-spacing: 0.25em;
            padding: 0.5rem 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        #body-menu-toggle:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(140, 180, 255, 0.08);
        }
        #body-menu-list {
            margin-top: 0.55rem;
            max-height: 58vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #body-menu-list.hidden {
            display: none;
        }
        .menu-item {
            padding: 0.32rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.18s ease;
        }
        .menu-item:hover {
            background: rgba(140, 180, 255, 0.15);
            color: var(--text-primary);
        }
        .menu-item.active {
            background: rgba(140, 180, 255, 0.22);
            color: rgba(220, 235, 255, 1);
        }
        .menu-item.star {
            color: rgba(255, 214, 140, 0.9);
        }
        .menu-item.planet {
            font-weight: 500;
            color: rgba(220, 230, 255, 0.85);
        }
        .menu-item.moon {
            font-size: 0.8rem;
            padding-left: 1.35rem;
            color: var(--text-faint);
        }
        .menu-item.moon::before {
            content: '· ';
        }

        .hint-bar {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 0.88rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-faint);
            pointer-events: none;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            backdrop-filter: blur(4px);
        }

        /* ---------- 时间控制面板 ---------- */
        #time-panel {
            top: 3.4rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            white-space: nowrap;
        }
        #time-panel .time-date {
            font-family: var(--font-serif);
            font-size: 1.02rem;
            color: rgba(200, 220, 255, 0.9);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.08em;
        }
        #time-panel .time-label {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        .time-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .speed-btn {
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--text-secondary);
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.6rem;
            border-radius: 14px;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.25s ease;
        }
        .speed-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .speed-btn.active {
            background: rgba(140, 180, 255, 0.18);
            border-color: rgba(160, 200, 255, 0.5);
            color: rgba(220, 235, 255, 1);
            box-shadow: 0 0 12px rgba(140, 180, 255, 0.15);
        }

        @media (max-width: 768px) {
            .panel {
                font-size: 0.92rem;
                padding: 0.7rem;
            }
            #info-panel {
                left: 0.6rem;
                bottom: 1.2rem;
                width: 220px;
            }
            #body-menu {
                right: 0.6rem;
                width: 148px;
                padding: 0.5rem 0.6rem;
            }
            #info-panel .body-stats {
                grid-template-columns: 1fr;
            }
            .hint-bar {
                font-size: 0.8rem;
                letter-spacing: 0.25em;
            }
            #time-panel {
                top: 3rem;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem;
                max-width: 94vw;
            }
            #time-panel .time-date {
                font-size: 0.9rem;
            }
            .speed-btn {
                padding: 0.25rem 0.45rem;
                font-size: 0.82rem;
            }
        }
        @media (max-width: 480px) {
            #info-panel {
                display: none;
            }
            .hint-bar {
                font-size: 0.75rem;
                letter-spacing: 0.2em;
                top: 0.6rem;
            }
            #time-panel {
                top: 2.4rem;
                padding: 0.35rem 0.6rem;
                gap: 0.3rem;
            }
            #time-panel .time-date {
                font-size: 0.85rem;
            }
            #time-panel .time-label {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="hint-bar">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击天体</div>

    <div class="panel" id="time-panel">
        <span class="time-label">模拟时间</span>
        <span class="time-date" id="sim-date">--</span>
        <div class="time-controls">
            <button class="speed-btn" data-mode="real">实时</button>
            <button class="speed-btn" data-mode="pause">暂停</button>
            <button class="speed-btn" data-mode="speed" data-days="1">1天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="10">10天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="30">30天/秒</button>
            <button class="speed-btn" data-mode="speed" data-days="365">1年/秒</button>
        </div>
    </div>

    <div class="panel" id="info-panel">
        <div class="body-name" id="body-name">太阳系</div>
        <div class="body-detail" id="body-detail">点击任意行星查看详细信息</div>
        <div class="body-intro" id="body-intro"></div>
        <div class="body-stats" id="body-stats"></div>
        <div class="hint-click">✦ 点击天体交互 ✦</div>
    </div>

    <div class="panel" id="body-menu">
        <button id="body-menu-toggle" type="button">☉ 天体列表</button>
        <div id="body-menu-list" class="menu-list hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- 常量 ----------
        const AU_KM = 149597870.7; // 1天文单位 = 公里
        const AU_SCALE = 10; // 场景单位：1 AU = 10 单位

        // 视觉放大因子（真实比例在太阳系尺度下不可见）：
        // 月球轨道实际约 0.026 场景单位，几乎贴着地球表面。为了可见性放大，
        // 但信息面板仍显示真实数据。
        const MOON_ORBIT_SCENE = 1.6;     // 月球轨道"可见半径"（场景单位）

        // 黄赤交角：黄道坐标(EclipticGeoMoon) → 赤道坐标(HelioVector 所在的 J2000 赤道系)
        // 的旋转角。八大行星位置直接使用 HelioVector（赤道系），所以月球必须旋转到同一
        // 坐标系，否则月球轨道面会与行星轨道面错开约 23.44°。
        const OBLIQUITY_DEG = 23.4393;

        // 黄道 → 赤道(J2000) 坐标旋转（绕 X 轴旋转 +ε）
        function eclToEqj(x, y, z) {
            const e = THREE.MathUtils.degToRad(OBLIQUITY_DEG);
            const ce = Math.cos(e), se = Math.sin(e);
            return new THREE.Vector3(x, ce * y - se * z, se * y + ce * z);
        }

        // 行星自转轴倾斜：以“黄道北极”(=行星轨道面法线，即黄道面法线)为基准，
        // 把自转轴按真实轴倾角 obliquityDeg 倾斜，而不是相对场景 +Y(赤道系Y)倾斜。
        // 原因：行星轨道面是黄道面，黄道北极在 EQJ 场景里方向为 (0,-sinε,cosε)，
        // 与场景 +Y 差 90°。若直接 rotation.x=轴倾角，轴会被渲染到黄道面内（地球躺平、土星环竖起来），
        // 与真实相差约 90°。本函数返回让自转轴正确指向的 rotation.x 角。
        // 旋转顺序 XZY 且 rotation.z=0 时，自转轴(本地+Y)方向 = Rx(tiltX)·(0,1,0) = (0,cos t,sin t)。
        // 取“黄道北极绕 X 轴旋转真实轴倾角”得到的期望轴方向 s=(0,sy,sz)，则 t=atan2(sz,sy)。
        function spinAxisTilt(obliquityDeg) {
            const eps = THREE.MathUtils.degToRad(OBLIQUITY_DEG);
            const del = THREE.MathUtils.degToRad(obliquityDeg || 0);
            const ny = -Math.sin(eps), nz = Math.cos(eps);   // 黄道北极(EQJ)
            const sy = Math.cos(del) * ny - Math.sin(del) * nz;
            const sz = Math.sin(del) * ny + Math.cos(del) * nz;
            return Math.atan2(sz, sy);
        }

        // ---------- 视角焦点状态 ----------
        let selectedObject = null;           // 当前选中的天体（视角围绕它旋转/平移）
        const tmpTarget = new THREE.Vector3(); // 临时向量
        let focusAnim = null;                // 平滑聚焦动画状态
        let earthCloud = null;               // 地球半透明云层球（独立自转，营造相对漂移）
        let lastFollowPos = new THREE.Vector3(); // 跟随模式中天体上一帧的世界位置
        let followInitialized = false;       // 跟随平移是否已初始化（避免首次大跳）

        // ---------- 初始化场景 ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);

        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(70, 45, 95);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.15;
        // 降低鼠标灵敏度：视角转动/缩放更细腻，避免轻轻一动就大幅晃眼
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.8;
        controls.panSpeed = 0.6;
        controls.minDistance = 5;
        controls.maxDistance = 500;
        controls.maxPolarAngle = Math.PI;
        controls.target.set(0, 0, 0);
        controls.update();

        // 用户手动操作视角时，取消平滑聚焦动画
        controls.addEventListener('start', () => { focusAnim = null; });

        // ---------- 光照 ----------
        const ambientLight = new THREE.AmbientLight(0x111122, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5e6, 3.0, 200, 1);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899cc, 0.4);
        fillLight.position.set(10, 15, 10);
        scene.add(fillLight);

        // ---------- 星空背景粒子 ----------
        function createStarfield() {
            const starCount = 12000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 400 + Math.random() * 200;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const temp = Math.random();
                if (temp > 0.7) {
                    colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.9; colors[i * 3 + 2] = 0.8;
                } else if (temp > 0.3) {
                    colors[i * 3] = 0.85; colors[i * 3 + 1] = 0.88; colors[i * 3 + 2] = 0.95;
                } else {
                    colors[i * 3] = 0.7; colors[i * 3 + 1] = 0.75; colors[i * 3 + 2] = 0.9;
                }
                sizes[i] = Math.random() * 2.0 + 0.5;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            return stars;
        }
        const starField = createStarfield();

        // ---------- 太阳 ----------
        function createSun() {
            const sunGeo = new THREE.SphereGeometry(2.2, 64, 64);
            const sunTex = createSunTexture();
            // 太阳自发光：用 MeshBasicMaterial 直接显示亮黄表面纹理，
            // 不依赖点光源照亮，避免在光源处算光照导致的黑面/黑框。
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTex });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.castShadow = false;
            sunMesh.userData = { name: '太阳', detail: 'G型主序星 · 太阳系中心恒星', type: 'star' };
            scene.add(sunMesh);

            const glowTexture = createGlowTexture();
            // 两层柔和光晕。关键：depthWrite:false —— 否则这些大 Sprite 的
            // 透明区域会把深度写进缓冲，把身后更远的星空背景遮挡成“大黑框”。
            const layers = [
                { scale: 5.4, opacity: 0.55, color: 0xffe0a0 },
                { scale: 9.0, opacity: 0.24, color: 0xffaa55 },
            ];
            for (const layer of layers) {
                const spriteMat = new THREE.SpriteMaterial({
                    map: glowTexture,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false,
                    depthTest: true,
                    opacity: layer.opacity,
                    color: new THREE.Color(layer.color),
                });
                const sprite = new THREE.Sprite(spriteMat);
                const baseScale = layer.scale;
                sprite.userData = { isGlow: true, baseScale: baseScale };
                sprite.scale.set(baseScale, baseScale, 1);
                sunMesh.add(sprite);
            }
            return sunMesh;
        }

        function createGlowTexture() {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 232, 176, 0.55)');
            gradient.addColorStop(0.55, 'rgba(255, 170, 80, 0.18)');
            gradient.addColorStop(0.85, 'rgba(255, 120, 40, 0.05)');
            gradient.addColorStop(1, 'rgba(255, 120, 40, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const sun = createSun();

        // ---------- 程序化纹理生成（基于分形噪声）----------
        function mulberry32(a) {
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // 2D 值噪声 + 分形布朗运动（fbm），用固定种子保证同一颗星每次加载纹理一致
        function makeNoise2D(seed) {
            const rand = mulberry32(seed);
            const base = [];
            for (let i = 0; i < 256; i++) base[i] = i;
            for (let i = 255; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const t = base[i]; base[i] = base[j]; base[j] = t;
            }
            const perm = new Uint8Array(512);
            for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
            const grad = (h, x, y) => {
                switch (h & 3) {
                    case 0: return x + y;
                    case 1: return -x + y;
                    case 2: return x - y;
                    default: return -x - y;
                }
            };
            const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
            function noise(x, y) {
                const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
                const xf = x - Math.floor(x), yf = y - Math.floor(y);
                const u = fade(xf), v = fade(yf);
                const a = perm[xi] + yi, b = perm[xi + 1] + yi;
                const n00 = grad(perm[a], xf, yf);
                const n10 = grad(perm[b], xf - 1, yf);
                const n01 = grad(perm[a + 1], xf, yf - 1);
                const n11 = grad(perm[b + 1], xf - 1, yf - 1);
                return (n00 * (1 - u) + n10 * u) * (1 - v) + (n01 * (1 - u) + n11 * u) * v;
            }
            function fbm(x, y, oct, lacunarity, gain) {
                lacunarity = lacunarity || 2; gain = gain || 0.5;
                let amp = 0.5, freq = 1, sum = 0, norm = 0;
                for (let i = 0; i < oct; i++) {
                    sum += noise(x * freq, y * freq) * amp;
                    norm += amp; amp *= gain; freq *= lacunarity;
                }
                return sum / norm;
            }
            return { noise, fbm };
        }

        function mix3(a, b, t) {
            return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t,
            ];
        }

        // 生成程序化纹理：pixelFn 填充 RGBA 像素数组
        function proceduralTexture(width, height, pixelFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(width, height);
            pixelFn(img.data, width, height);
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // 太阳表面：明亮的米粒组织（对流胞）——只有亮暗起伏，绝无黑色斑点
        function createSunTexture() {
            const W = 384, H = 192;
            const n = makeNoise2D(7);
            const nFine = makeNoise2D(8);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        // 大尺度亮度起伏：从亮黄到橙黄的柔和渐变
                        const g = n.fbm(x / w * 14, y / h * 7, 3);
                        const t = Math.max(0, Math.min(1, (g + 0.6) / 1.2));
                        let r = 255;
                        let gg = 214 + t * 41;
                        let b = 148 + t * 107;
                        // 高频米粒组织：对流胞中心略亮、边缘略暗（仅 ±7% 起伏）
                        const fine = nFine.fbm(x / w * 60, y / h * 30, 2);
                        const gran = Math.max(0, Math.min(1, (fine + 0.4) * 1.4));
                        const brighten = (gran - 0.5) * 0.14;
                        r = Math.min(255, r + r * brighten);
                        gg = Math.min(255, gg + gg * brighten);
                        b = Math.min(255, b + b * brighten);
                        d[i] = Math.round(r); d[i + 1] = Math.round(gg); d[i + 2] = Math.round(b); d[i + 3] = 255;
                    }
                }
            });
        }

        function createPlanetTexture(name) {
            const W = 512, H = 256;
            switch (name) {
                case '水星': return mercuryTexture(W, H);
                case '金星': return venusTexture(W, H);
                case '地球': return earthTexture(W, H);
                case '火星': return marsTexture(W, H);
                case '木星': return jupiterTexture(W, H);
                case '土星': return saturnTexture(W, H);
                case '天王星': return uranusTexture(W, H);
                case '海王星': return neptuneTexture(W, H);
                case '月球': return moonTexture(W, H);
                default: return proceduralTexture(W, H, (d, w, h) => {
                    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        d[i] = 150; d[i + 1] = 150; d[i + 2] = 150; d[i + 3] = 255;
                    }
                });
            }
        }

        // 水星：灰褐地表 + 密布陨石坑（暗坑底 + 亮边缘）+ 少数亮射线坑
        function mercuryTexture(W, H) {
            const n = makeNoise2D(21);
            const craters = [];
            const rng = mulberry32(221);
            for (let i = 0; i < 120; i++) {
                const r = Math.pow(rng(), 1.7) * W * 0.018 + 1.2;
                craters.push({ x: rng() * W, y: rng() * H, r });
            }
            // 少量大型亮射线坑（如哥白尼/第谷那样的辐射纹）
            const rays = [];
            for (let i = 0; i < 2; i++) {
                const spokes = [];
                for (let s = 0; s < 6; s++) spokes.push(rng() * Math.PI * 2);
                rays.push({ x: rng() * W, y: rng() * H, r: rng() * W * 0.05 + 0.03, spokes });
            }
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const v = n.fbm(x / w * 9, y / h * 4.5, 3);
                    let base = 108 + v * 52;
                    for (const c of craters) {
                        const dx = x - c.x, dy = y - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < c.r * 0.85) base *= 0.5;
                        else if (dist < c.r * 1.18) base *= 1.14;
                    }
                    for (const r of rays) {
                        const dx = x - r.x, dy = y - r.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < r.r) {
                            const ang = Math.atan2(dy, dx);
                            for (const sp of r.spokes) {
                                const diff = Math.abs(((ang - sp + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
                                if (diff < 0.07) {
                                    base += 55 * (1 - dist / r.r);
                                    break;
                                }
                            }
                        }
                    }
                    base = Math.min(255, base);
                    d[i] = base; d[i + 1] = base * 0.96; d[i + 2] = base * 1.05; d[i + 3] = 255;
                }
            });
        }

        // 金星：奶油黄浓厚云层 + 湍流涡旋云带（云带随纬度呈波浪走向）
        function venusTexture(W, H) {
            const n = makeNoise2D(31);
            const base = [214, 178, 114];
            const bright = [252, 226, 170];
            const dark = [168, 132, 88];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    // 云带随纬度起伏 + 湍流扭曲
                    const band = Math.sin(v * Math.PI * 6) * 0.5 + 0.5;
                    const turb = n.fbm(u * 4 + Math.sin(v * 10) * 0.2, v * 6, 3) * 0.5 + 0.5;
                    let c = mix3(dark, base, band * 0.6 + turb * 0.4);
                    // 柔和的大尺度亮暗（硫酸云反射差异）
                    const soft = n.fbm(u * 2.2, v * 1.8, 2) * 0.5 + 0.5;
                    c = mix3(c, bright, soft * 0.35);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 地球：海洋深浅 + 大陆地貌（沙漠/草原/森林/山地）+ 海岸浅滩 + 极地冰盖
        function earthTexture(W, H) {
            const nLand = makeNoise2D(41);
            const nTer = makeNoise2D(42);
            const nDeep = makeNoise2D(44);
            const nBio = makeNoise2D(45);
            const ocean = [14, 38, 96];
            const oceanLight = [36, 116, 188];
            const shore = [48, 132, 176];
            const sand = [198, 176, 118];
            const grass = [76, 118, 56];
            const forest = [42, 90, 42];
            const rock = [128, 118, 104];
            const snow = [246, 249, 252];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const lat = (y / h - 0.5) * Math.PI;
                    const u = x / w * 2, v = y / h;
                    const land = nLand.fbm(u * 2.0 + 0.4, v * 1.0 + 0.2, 4);
                    // fbm 输出约 ±0.6，映射为“陆地度”，约 1/3 面积为陆地
                    const landT = Math.max(0, Math.min(1, (land + 0.05) * 3.0));
                    let c;
                    if (landT > 0.30) {
                        const ele = nTer.fbm(u * 4.0, v * 2.0, 2);
                        const t = Math.max(0, Math.min(1, landT + (ele - 0.5) * 0.35));
                        // 植被分布：低地沙漠/草原，丘陵森林，高山岩石+雪
                        const bio = nBio.fbm(u * 3 + 9, v * 1.5, 2) * 0.5 + 0.5;
                        if (t < 0.55) {
                            c = mix3(sand, grass, bio);
                            c = mix3(c, forest, Math.max(0, t - 0.35) * 2.5);
                        } else {
                            c = mix3(forest, rock, Math.min(1, (t - 0.55) * 2.5));
                        }
                        if (t > 0.75) c = mix3(c, snow, Math.min(1, (t - 0.75) * 4));
                    } else {
                        const dep = Math.max(0, 1 - landT / 0.30);
                        const depthVar = 0.75 + nDeep.noise(u * 3, v * 1.5) * 0.45;
                        c = mix3(ocean, oceanLight, Math.min(1, dep * depthVar));
                    }
                    // 海岸线浅滩：紧贴陆地边缘提亮
                    if (landT > 0.20 && landT < 0.42) {
                        c = mix3(c, shore, (0.42 - landT) * 1.5);
                    }
                    const pole = Math.max(0, Math.abs(lat) - 1.18);
                    if (pole > 0) c = mix3(c, snow, Math.min(1, pole * 8));
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 地球半透明云层（白色 + 云密度 alpha，作为独立球体叠加在陆地上方）
        function createCloudTexture(W, H) {
            const n = makeNoise2D(87);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const a = n.fbm(u * 4.0 + 3.0, v * 2.0, 3);
                    // fbm 实际输出约 ±0.5：a<-0.12 无云，a>0.15 全云，覆盖约 50-60%
                    const t = Math.max(0, Math.min(1, (a + 0.12) / 0.27));
                    const s = t * t * (3 - 2 * t);
                    const alpha = s * 0.95;
                    d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = Math.floor(alpha * 255);
                }
            });
        }

        // 火星：红色沙漠 + 暗色玄武岩区 + 亮色尘暴带 + 极冠（带暗色边缘）
        function marsTexture(W, H) {
            const n = makeNoise2D(51);
            const n2 = makeNoise2D(52);
            const n3 = makeNoise2D(53);
            const red = [205, 100, 48];
            const dark = [116, 52, 30];
            const light = [232, 162, 106];
            const cap = [248, 243, 238];
            const capDark = [180, 130, 96];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const lat = (y / h - 0.5) * Math.PI;
                    const u = x / w * 2, v = y / h;
                    const vv = n.fbm(u * 2.6, v * 1.3, 3);
                    const dd = n2.fbm(u * 4 + 5, v * 2, 2);
                    // fbm 约 ±0.6，映射到 0..1 拉开明暗
                    const t = Math.max(0, Math.min(1, (vv + 0.6) * 0.9));
                    let c = mix3(dark, red, t);
                    if (dd > 0.05) c = mix3(c, light, Math.min(0.75, (dd - 0.05) * 3.0));
                    // 细碎陨石坑 / 岩层斑点
                    const speck = n3.fbm(u * 12, v * 6, 2);
                    c = mix3(c, dark, Math.max(0, (speck - 0.55) * 0.3));
                    // 极冠：白色冰盖 + 边缘暗色圈（火星极冠特有的季节性边缘）
                    const pole = Math.max(0, Math.abs(lat) - 1.18);
                    if (pole > 0) c = mix3(c, cap, Math.min(1, pole * 8));
                    const fringe = Math.max(0, 1 - Math.abs(Math.abs(lat) - 1.16) * 30);
                    c = mix3(c, capDark, fringe * 0.5);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 木星：多条云带（亮区/暗带交替）+ 带内湍流 + 大红斑（椭圆涡旋 + 外缘亮环）
        function jupiterTexture(W, H) {
            const n = makeNoise2D(61);
            const nS = makeNoise2D(62);
            const bandCols = [
                [202, 160, 118], [168, 118, 80], [228, 196, 150],
                [148, 98, 64], [238, 208, 164], [184, 132, 90],
                [212, 172, 132], [158, 110, 74],
            ];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const bands = bandCols.length;
                    const bandPos = v * bands;
                    const bi = Math.floor(bandPos) % bands;
                    const fr = bandPos - Math.floor(bandPos);
                    const smooth = Math.sin(Math.PI * fr);
                    let c = mix3(bandCols[bi], bandCols[(bi + 1) % bands], smooth * 0.5);
                    // 带内湍流：水平拉长的卷云
                    const turb = nS.fbm(u * 5 + Math.sin(v * 30) * 0.5, v * 12, 2) * 0.5 + 0.5;
                    c = mix3(c, bandCols[(bi + 3) % bands], (turb - 0.5) * 0.4);
                    // 大红斑：扁平椭圆，内部旋涡 + 外缘亮环
                    const gx = (x - W * 0.72) / (W * 0.10);
                    const gy = (y - H * 0.66) / (H * 0.045);
                    const gd = gx * gx + gy * gy;
                    if (gd < 1.4) {
                        const ring = 1 - Math.min(1, gd);
                        c = mix3(c, [210, 84, 50], ring * 0.95);
                        if (gd < 0.5) {
                            const swirl = 0.5 + 0.5 * Math.sin((gx * 6 + gy * 8) * Math.PI);
                            c = mix3(c, [232, 130, 92], swirl * 0.4);
                        }
                        if (gd > 1.15 && gd < 1.4) c = mix3(c, [240, 214, 170], 0.5);
                    }
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 土星：柔和的浅金色云带（奶油色系）+ 极区渐暗
        function saturnTexture(W, H) {
            const n = makeNoise2D(71);
            const a = [234, 214, 172];
            const b = [202, 172, 132];
            const dark = [176, 148, 110];
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 12) * 0.5 + 0.5;
                    const band2 = Math.sin(v * Math.PI * 5 + 1.3) * 0.5 + 0.5;
                    const turb = n.fbm(u * 3 + Math.sin(v * 20) * 0.3, v * 8, 2) * 0.5 + 0.5;
                    let c = mix3(b, a, band * 0.45 + turb * 0.25);
                    c = mix3(c, dark, band2 * 0.22);
                    const lat = (y / h - 0.5) * 2;
                    c = mix3(c, dark, Math.abs(lat) * 0.18);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 天王星：淡青色 + 极淡的云带
        function uranusTexture(W, H) {
            const n = makeNoise2D(81);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 5) * 0.5 + 0.5;
                    const t = n.fbm(u * 2, v * 3, 2) * 0.5 + 0.5;
                    const c = mix3([106, 186, 198], [152, 224, 228], band * 0.35 + t * 0.25);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 海王星：深蓝 + 亮甲烷云带 + 大暗斑
        function neptuneTexture(W, H) {
            const n = makeNoise2D(91);
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    const band = Math.sin(v * Math.PI * 8) * 0.5 + 0.5;
                    const t = n.fbm(u * 3, v * 5, 2) * 0.5 + 0.5;
                    let c = mix3([32, 56, 148], [70, 116, 226], band * 0.55 + t * 0.25);
                    // 高纬亮甲烷云
                    if (t > 0.72) c = mix3(c, [210, 226, 255], (t - 0.72) * 1.8);
                    // 大暗斑
                    const gx = (x - W * 0.55) / (W * 0.1);
                    const gy = (y - H * 0.62) / (H * 0.06);
                    const gd = gx * gx + gy * gy;
                    if (gd < 1) c = mix3(c, [18, 28, 88], (1 - gd) * 0.85);
                    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
                }
            });
        }

        // 月球：灰色月海（暗色低洼）+ 亮色高地 + 密布陨石坑
        function moonTexture(W, H) {
            const n = makeNoise2D(101);
            const nM = makeNoise2D(102);
            const craters = [];
            const rng = mulberry32(333);
            for (let i = 0; i < 90; i++) {
                const r = Math.pow(rng(), 1.6) * W * 0.02 + 1.2;
                craters.push({ x: rng() * W, y: rng() * H, r });
            }
            return proceduralTexture(W, H, (d, w, h) => {
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const u = x / w * 2, v = y / h;
                    // 月海（暗）vs 高地（亮）
                    const m = nM.fbm(u * 2.5, v * 1.3, 3) * 0.5 + 0.5;
                    const mT = Math.max(0, Math.min(1, m * 1.6 - 0.3));
                    let base = 116 + mT * 54;
                    const v2 = n.fbm(x / w * 7, y / h * 3.5, 3);
                    base += v2 * 14;
                    for (const c of craters) {
                        const dx = x - c.x, dy = y - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < c.r * 0.85) base *= 0.55;
                        else if (dist < c.r * 1.18) base *= 1.12;
                    }
                    base = Math.min(255, base);
                    d[i] = base; d[i + 1] = base; d[i + 2] = base * 1.01; d[i + 3] = 255;
                }
            });
        }

        // ---------- 行星配置（含公转周期）----------
        const planetConfigs = [
            { name: '水星', body: Astronomy.Body.Mercury, color: 0x8c8c8c, radius: 0.35, orbitAU: 0.39, detail: '最小的行星 · 表面布满陨石坑', periodDays: 87.97, spinPeriodHours: 1407.6, axialTiltDeg: 0.03, texture: () => createPlanetTexture('水星') },

        // ---------- 真实椭圆轨道线 ----------
        // 用 HelioVector 在“一个完整轨道周期”的时间窗口内采样真实位置，
        // 画出的就是行星的真实椭圆轨道（而非示意正圆），与行星当前位置完全自洽。
        function createOrbitLine(config) {
            const segments = 512;
            const periodMs = config.periodDays * 86400000;
            const halfPeriodMs = periodMs / 2;
            const center = new Date(); // 以当前真实时间为采样中心
            const points = [];
            for (let i = 0; i < segments; i++) {
                const t = new Date(center.getTime() - halfPeriodMs + (i / segments) * periodMs);
                let vec;
                try {
                    vec = Astronomy.HelioVector(config.body, t);
                } catch (e) {
                    vec = { x: 0, y: 0, z: 0 };
                }
                points.push(new THREE.Vector3(vec.x * AU_SCALE, vec.y * AU_SCALE, vec.z * AU_SCALE));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: config.color,
                transparent: true,
                opacity: 0.22,
                depthWrite: false,
            });
            const line = new THREE.LineLoop(geometry, material);
            line.userData = { name: config.name };
            scene.add(line);
            orbitLines.push(line);
            return line;
        }

        function createPlanet(config) {
            // 每颗行星都绘制真实椭圆轨道线（含地球）
            createOrbitLine(config);

            const geo = new THREE.SphereGeometry(config.radius, 64, 64);
            const texture = config.texture();
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.7,
                metalness: 0.1,
                emissive: new THREE.Color(config.color).multiplyScalar(0.1),
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                name: config.name,
                detail: config.detail,
                type: 'planet',
                body: config.body,
                orbitAU: config.orbitAU,
                periodDays: config.periodDays,
                radius: config.radius,
                spinPeriodHours: config.spinPeriodHours,
                axialTiltDeg: config.axialTiltDeg,
            };
            // 真实自转轴倾角：以黄道北极(轨道面法线)为基准倾斜，使自转轴方向与真实一致。
            // order='XZY' 且 rotation.z 恒为 0 时，旋转矩阵 = Rx(倾斜) * Ry(自转)，
            // 即先绕本地 Y 自转、再整体绕 X 倾斜，自转轴被真实地倾斜。
            // 轴倾角 >90°（金星 177.4°、天王星 97.77°）自然表现为逆行。
            mesh.rotation.order = 'XZY';
            mesh.rotation.x = spinAxisTilt(config.axialTiltDeg);
            scene.add(mesh);
            planetMeshes.push(mesh);

            if (config.name === '土星') {
                // 光环平面垂直于自转轴（真实土星环在赤道平面内）。
                // rotation.x = -π/2 使环的法线指向本地 +Y（自转轴），随轴倾角一起倾斜。
                const ringGeo = new THREE.TorusGeometry(config.radius * 1.6, 0.12, 16, 200);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xd4c09a,
                    roughness: 0.6,
                    metalness: 0.0,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.userData = { isRing: true };
                mesh.add(ring);

                const ring2Geo = new THREE.TorusGeometry(config.radius * 1.9, 0.06, 16, 200);
                const ring2 = new THREE.Mesh(ring2Geo, ringMat.clone());
                ring2.material.opacity = 0.4;
                ring2.rotation.x = -Math.PI / 2;
                ring2.userData = { isRing: true };
                mesh.add(ring2);
            }

            // 地球：半透明云层球，叠加在陆地上方（云层独立缓慢自转，营造相对漂移）

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;

            return raycaster.intersectObjects(targets, true);

            return `${au.toFixed(2)} AU`;

            if (km >= 1e6) return `${(km / 1e6).toFixed(2)}M km`;
            if (km >= 1e3) return `${(km / 1e3).toFixed(2)}k km`;
            return `${km.toFixed(0)} km`;
        }

        function computeHelioSpeed(body, now, deltaSeconds = 3600) {
            const vec1 = Astronomy.HelioVector(body, now);
            const vec2 = Astronomy.HelioVector(body, new Date(now.getTime() + deltaSeconds * 1000));
            const dx = (vec2.x - vec1.x) * AU_KM;
            const dy = (vec2.y - vec1.y) * AU_KM;
            const dz = (vec2.z - vec1.z) * AU_KM;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            return dist / deltaSeconds; // km/s

        function updateInfoPanel(hitObject) {
            const nameEl = document.getElementById('body-name');
            const detailEl = document.getElementById('body-detail');
            const introEl = document.getElementById('body-intro');
            const statsEl = document.getElementById('body-stats');

            if (!hitObject || !hitObject.userData || !hitObject.userData.name) {
                nameEl.textContent = '太阳系';
                detailEl.textContent = '点击任意行星查看详细信息';
                introEl.textContent = '';
                statsEl.innerHTML = '';
                return;
            }

            const ud = hitObject.userData;
            const fact = BODY_FACTS[ud.name] || {};
            nameEl.textContent = ud.name;
            detailEl.textContent = ud.detail || '';
            introEl.textContent = fact.intro || '';

            const now = simTime; // 用模拟时间，跟随时间加速/暂停
            const earthVec = Astronomy.HelioVector(Astronomy.Body.Earth, now);

            let distanceToSunAU = 0;
            let distanceToEarthAU = 0;
            let parentDistKM = null;      // 卫星距母星的半长轴距离（km）
            let speedKmS = null;
            let periodDisplay = '—';

            if (ud.type === 'star') {
                distanceToSunAU = 0;
                distanceToEarthAU = Math.sqrt(earthVec.x*earthVec.x + earthVec.y*earthVec.y + earthVec.z*earthVec.z);
                periodDisplay = fact.orbit || '—';
                speedKmS = null;
            } else if (ud.type === 'planet') {
                const vec = Astronomy.HelioVector(ud.body, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(ud.body, now);
                if (ud.periodDays) {
                    periodDisplay = ud.periodDays >= 365 ? `${(ud.periodDays/365.25).toFixed(1)} 年` : `${ud.periodDays.toFixed(1)} 天`;
                }
            } else if (ud.type === 'moon') {
                // 卫星：天文引擎支持该卫星 body 则直接用其日心位置，
                // 否则（火卫一/火卫二）用母行星位置近似
                const vec = ud.body
                    ? Astronomy.HelioVector(ud.body, now)
                    : Astronomy.HelioVector(ud.parentBody, now);
                distanceToSunAU = Math.sqrt(vec.x*vec.x + vec.y*vec.y + vec.z*vec.z);
                const dx = vec.x - earthVec.x;
                const dy = vec.y - earthVec.y;
                const dz = vec.z - earthVec.z;
                distanceToEarthAU = Math.sqrt(dx*dx + dy*dy + dz*dz);
                speedKmS = computeHelioSpeed(ud.body || ud.parentBody, now);
                if (ud.periodDays) periodDisplay = `${ud.periodDays.toFixed(1)} 天`;
                if (ud.semiMajorKm) parentDistKM = ud.semiMajorKm;
            }

            const distSunKM = distanceToSunAU * AU_KM;
            const distEarthKM = distanceToEarthAU * AU_KM;

            // 统一样式生成一条统计项
            const stat = (label, value, sub) => `
                <div class="stat-item">
                    <span class="stat-label">${label}</span>
                    <span class="stat-value">${value}</span>
                    ${sub ? `<span class="stat-value" style="font-size:0.85rem;color:var(--text-faint)">${sub}</span>` : ''}
                </div>`;

            // 太阳没有"距太阳"的概念，用光谱类型替代
            const distSunItem = ud.type === 'star'
                ? stat('光谱类型', fact.spectrum || 'G2V 黄矮星')
                : stat('距太阳', formatDistanceAU(distanceToSunAU), formatDistanceKM(distSunKM));

            statsEl.innerHTML = [
                distSunItem,
                stat('距地球', formatDistanceAU(distanceToEarthAU), formatDistanceKM(distEarthKM)),
                ...(parentDistKM ? [stat('距母星', formatDistanceKM(parentDistKM))] : []),
                stat('温度', fact.temp || '—', fact.tempSub || ''),
                stat('直径', fact.diameter || '—'),
                stat('质量', fact.mass || '—'),
                stat('自转一周', fact.spin || '—'),
                stat('公转周期', periodDisplay),
                stat('卫星', fact.moons || '—'),
                stat('轨道速度', speedKmS === null
                    ? (ud.type === 'star' ? (fact.orbitSpeed || '—') : '—')
                    : `${speedKmS.toFixed(2)} km/s`),
            ].join('');
        }

        // 平滑地把视角中心移到指定天体，保持当前缩放距离
        function focusOn(obj) {
            if (!obj || typeof obj.getWorldPosition !== 'function') return;
            obj.getWorldPosition(tmpTarget);
            const dir = camera.position.clone().sub(controls.target);
            if (dir.lengthSq() === 0) dir.set(0, 0, 1);
            const dist = Math.max(camera.position.distanceTo(controls.target), 3);
            focusAnim = {
                start: performance.now(),
                dur: 700,
                fromCam: camera.position.clone(),
                fromTgt: controls.target.clone(),
                toCam: tmpTarget.clone().add(dir.normalize().multiplyScalar(dist)),
                toTgt: tmpTarget.clone(),
            };
        }

        // 统一"选中并聚焦"逻辑：鼠标点击 / 右侧菜单共用
        function selectAndFocus(obj) {
            if (!obj) return;
            updateInfoPanel(obj);
            selectedObject = obj;
            followInitialized = false;   // 重新聚焦新天体，重置跟随基准
            focusOn(obj);
        }

        renderer.domElement.addEventListener('click', (event) => {
            const intersects = getIntersects(event);
            if (intersects.length > 0) {
                let hitObject = null;
                for (const intersect of intersects) {
                    let obj = intersect.object;
                    while (obj) {
                        if (obj.userData && obj.userData.name && obj.userData.type !== 'glow') {
                            hitObject = obj;
                            break;
                        }
                        obj = obj.parent;
                    }
                    if (hitObject) break;
                }
                if (hitObject) {
                    selectAndFocus(hitObject);
                    setMenuActive(hitObject.userData.name);
                }
            } else {
                updateInfoPanel(null);
                selectedObject = null;
                focusAnim = null;
                followInitialized = false;
                setMenuActive(null);
            }
        });

        renderer.domElement.addEventListener('mousemove', (event) => {
            const intersects = getIntersects(event);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        // ---------- 右侧天体列表菜单 ----------
        const bodyMenu = document.getElementById('body-menu');
        const bodyMenuList = document.getElementById('body-menu-list');
        const bodyMenuToggle = document.getElementById('body-menu-toggle');

        function setMenuActive(name) {
            if (!bodyMenuList) return;
            bodyMenuList.querySelectorAll('.menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.body === name);
            });
        }

        function closeBodyMenu() {
            if (bodyMenuList) bodyMenuList.classList.add('hidden');
        }

        bodyMenuToggle.addEventListener('click', () => {
            bodyMenuList.classList.toggle('hidden');
        });

        // 构建列表：太阳 + 八大行星，每颗行星下嵌套它的卫星
        function buildBodyMenu() {
            const items = [];
            items.push('<div class="menu-item star" data-body="太阳">☀ 太阳</div>');
            planetMeshes.forEach(p => {
                const pname = p.userData.name;
                items.push(`<div class="menu-item planet" data-body="${pname}">${pname}</div>`);
                moonMeshes.forEach(m => {
                    if (m.userData.parentName === pname) {
                        items.push(`<div class="menu-item moon" data-body="${m.userData.name}">${m.userData.name}</div>`);
                    }
                });
            });
            bodyMenuList.innerHTML = items.join('');
            // 点击行星 / 卫星 → 与鼠标点击完全相同的聚焦逻辑
            bodyMenuList.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', () => {
                    const name = el.dataset.body;
                    let target = null;
                    if (name === '太阳') target = sun;
                    else {
                        target = planetMeshes.find(x => x.userData.name === name)
                              || moonMeshes.find(x => x.userData.name === name);
                    }
                    if (target) {
                        selectAndFocus(target);
                        setMenuActive(name);
                        closeBodyMenu();
                    }
                });
            });
        }
        buildBodyMenu();

        // 点击菜单以外的空白处时收起菜单
        document.addEventListener('click', (event) => {
            if (bodyMenu && !bodyMenu.contains(event.target)) closeBodyMenu();
        });

        // ---------- 时间控制 ----------
        let simTime = new Date();          // 模拟时间
        let timeMode = 'real';             // 'real' 实时 | 'pause' 暂停 | 'speed' 加速
        let speedDaysPerSec = 1;           // 加速档位（天/秒）

        function setTimeMode(mode, days) {
            timeMode = mode;
            if (mode === 'speed') speedDaysPerSec = days;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                const isActive = btn.dataset.mode === mode &&
                    (mode !== 'speed' || parseFloat(btn.dataset.days) === days);
                btn.classList.toggle('active', isActive);
            });
        }

        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                if (mode === 'real') setTimeMode('real');
                else if (mode === 'pause') setTimeMode('pause');
                else setTimeMode('speed', parseFloat(btn.dataset.days));
            });
        });
        setTimeMode('real');

        function formatSimDate(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function updateTimeDisplay() {
            document.getElementById('sim-date').textContent = formatSimDate(simTime);
        }

        // ---------- 更新行星位置 ----------
        function updatePlanetPositions(simTime, dtSec) {
            if (!window.Astronomy) return;
            const now = simTime;

            // 自转视觉倍率：各行星按“真实自转周期”转动，统一放大到肉眼可辨但平缓的节奏。
            // 500 倍下：地球约 3 分钟一圈、木星约 1 分 12 秒一圈（快 2.4 倍）、
            // 水星/金星因真实周期极长而几乎静止，符合真实对比。
            const SPIN_VISUAL = 500;
            // 暂停时自转同步冻结
            const spinDt = timeMode === 'pause' ? 0 : dtSec;

            for (const mesh of planetMeshes) {
                const body = mesh.userData.body;
                if (!body) continue;
                try {
                    const vec = Astronomy.HelioVector(body, now);
                    mesh.position.set(vec.x * AU_SCALE, vec.y * AU_SCALE, vec.z * AU_SCALE);
                    // 文字标注保持竖立在行星正上方（世界坐标，不受自转轴倾斜影响）
                    const labelRef = mesh.userData.labelRef;
                    if (labelRef) {
                        labelRef.position.set(
                            vec.x * AU_SCALE,
                            vec.y * AU_SCALE + mesh.userData.radius + 0.6,
                            vec.z * AU_SCALE
                        );
                    }
                    // 真实自转：角速度 = 2π / 真实自转周期（小时），方向由轴倾角表达
                    const spinHours = mesh.userData.spinPeriodHours;
                    if (spinHours && spinDt > 0) {
                        const dTheta = spinDt * (2 * Math.PI) / (spinHours * 3600) * SPIN_VISUAL;
                        // 选中的天体冻结自转：视角保持稳定，不会感觉被天体表面带着转
                        if (selectedObject && selectedObject === mesh) {
                            // 冻结自转
                        } else {
                            mesh.rotation.y += dTheta;
                            // 云层比地表略快一点，形成云层相对地面漂移的效果
                            if (mesh.userData.name === '地球' && earthCloud) {
                                earthCloud.rotation.y += dTheta * 0.12;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('计算行星位置失败', mesh.userData.name, e);
                }
            }

            // 太阳自转：赤道自转周期约 25.05 天（此处忽略纬度差动自转）
            if (sun && spinDt > 0 && !(selectedObject && selectedObject === sun)) {
                const sunHours = 25.05 * 24;
                sun.rotation.y += spinDt * (2 * Math.PI) / (sunHours * 3600) * SPIN_VISUAL;
            }

            // 卫星位置：真实方向来自天文引擎，视觉距离按 visualOrbit 放大
            moonMeshes.forEach(moonMesh => {
                const ud = moonMesh.userData;
                const parent = planetMeshes.find(p => p.userData.name === ud.parentName);
                if (!parent) return;
                try {
                    let offset = null;
                    if (ud.name === '月球') {
                        // 月球：地心黄道经纬度 + 真实距离变化（近地点/远地点 ±11%）
                        const mvec = Astronomy.EclipticGeoMoon(now);
                        const lat = mvec.lat;
                        const lon = mvec.lon;
                        // 真实地月距离（EclipticGeoMoon 的 dist 单位是 AU，随近地点/远地点变化 ~±11%），
                        // 缩放到场景尺度：平均距离保持在 MOON_ORBIT_SCENE 附近，但还原真实远近变化。
                        const MEAN_MOON_DIST_AU = 0.0025696; // 平均地月距离 384400 km
                        const sceneDist = mvec.dist / MEAN_MOON_DIST_AU * MOON_ORBIT_SCENE;
                        // 先算黄道面内的地心偏移，再旋转到与行星一致的赤道坐标系（eclToEqj）
                        const xe = sceneDist * Math.cos(lat) * Math.cos(lon);
                        const ye = sceneDist * Math.sin(lat);
                        const ze = sceneDist * Math.cos(lat) * Math.sin(lon);
                        offset = eclToEqj(xe, ye, ze);
                        // 潮汐锁定：自转周期 = 公转周期，始终以同一面朝向母星
                        // 选中月球时冻结自转，便于观察
                        if (!(selectedObject && selectedObject === moonMesh)) {
                            moonMesh.rotation.y = -lon;
                        }
                    } else if (ud.body && ud.parentBody) {
                        // 其它卫星：HelioVector 相对位置确定方向（AU），缩放到视觉轨道半径
                        const sv = Astronomy.HelioVector(ud.body, now);
                        const pv = Astronomy.HelioVector(ud.parentBody, now);
                        const dx = sv.x - pv.x;
                        const dy = sv.y - pv.y;
                        const dz = sv.z - pv.z;
                        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        if (len > 1e-12) {
                            offset = new THREE.Vector3(
                                dx / len * ud.visualOrbit,
                                dy / len * ud.visualOrbit,
                                dz / len * ud.visualOrbit
                            );
                        }
                    } else {
                        // 手动圆形轨道（火卫一 / 火卫二）：真实公转周期
                        const t = now.getTime() / 86400000;
                        const angle = ud.phase0 + 2 * Math.PI * t / ud.periodDays;
                        const r = ud.visualOrbit;
                        offset = eclToEqj(r * Math.cos(angle), 0, r * Math.sin(angle));
                    }
                    if (offset) {
                        moonMesh.position.copy(parent.position).add(offset);
                        const labelRef = moonMesh.userData.labelRef;
                        if (labelRef) {
                            labelRef.position.copy(moonMesh.position);
                            labelRef.position.y += ud.radius + 0.4;
                        }
                    }
                } catch (e) {
                    console.warn('计算卫星位置失败', ud.name, e);
                }
            });
        }

        // ---------- 动画循环 ----------
        let lastFrameTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const nowMs = performance.now();
            const dtSec = Math.min((nowMs - lastFrameTime) / 1000, 0.5); // 防止切后台后 dt 过大
            lastFrameTime = nowMs;

            // 推进模拟时间
            if (timeMode === 'real') {
                simTime = new Date();
            } else if (timeMode === 'speed') {
                simTime = new Date(simTime.getTime() + dtSec * speedDaysPerSec * 86400000);
            }
            // 'pause'：时间静止

            updatePlanetPositions(simTime, dtSec);
            updateTimeDisplay();

            // 视角中心：选中天体则围绕它旋转/平移，否则围绕太阳（原点）
            if (selectedObject && typeof selectedObject.getWorldPosition === 'function') {
                if (focusAnim) {
                    // 平滑聚焦过渡（缓动）；动画期间持续记录天体位置，
                    // 结束后无缝切换为跟随模式，避免相机跳变。
                    selectedObject.getWorldPosition(lastFollowPos);
                    const t = Math.min((performance.now() - focusAnim.start) / focusAnim.dur, 1);
                    const e = t * t * (3 - 2 * t);
                    camera.position.lerpVectors(focusAnim.fromCam, focusAnim.toCam, e);
                    controls.target.lerpVectors(focusAnim.fromTgt, focusAnim.toTgt, e);
                    if (t >= 1) focusAnim = null;
                    followInitialized = true;
                } else {
                    // 跟随天体：相机与视角中心一起平移（保持相对视角不变）。
                    // 这样天体公转/加速时，背景星空与太阳在画面中相对静止，
                    // 不会出现相机被“拽着甩”的剧烈晃动，大幅减轻眩晕。
                    selectedObject.getWorldPosition(tmpTarget);
                    if (followInitialized) {
                        camera.position.x += tmpTarget.x - lastFollowPos.x;
                        camera.position.y += tmpTarget.y - lastFollowPos.y;
                        camera.position.z += tmpTarget.z - lastFollowPos.z;
                    }
                    lastFollowPos.copy(tmpTarget);
                    controls.target.copy(tmpTarget);
                    followInitialized = true;
                }
            } else {
                // 未选中任何天体：保持自由视角。不再强制把旋转/平移中心
                // 拉回太阳（否则右键平移会被立刻重置，感觉“默认锁定太阳”）。
                focusAnim = null;
                followInitialized = false;
            }

            // 未选中天体时星空才缓慢旋转；跟随天体时暂停，避免背景转动加剧眩晕
            if (!selectedObject) {
                starField.rotation.y += 0.0001;
                starField.rotation.x += 0.00003;
            }

            sun.children.forEach(child => {
                if (child.isSprite && child.userData.isGlow) {
                    const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.05;
                    const s = child.userData.baseScale * pulse;
                    child.scale.set(s, s, 1);
                }
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ---------- 窗口调整 ----------
        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }
        window.addEventListener('resize', onResize);

        // ---------- 启动 ----------
        animate();
        onResize();
        updatePlanetPositions(simTime, 0);

        console.log('🌌 3D宇宙沙盒已启动 (精确天体位置 + 时间控制 + 真实轨道线)');
        console.log('🖱️ 拖拽旋转 | 滚轮缩放 | 右键平移 | 点击天体');
        console.log('⏱️ 顶部面板可切换 实时 / 暂停 / 加速');
    </script>
</body>
</html>
