<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>太阳系沙盒 · 3D Solar System</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="loading">🌌 太阳系沙盒加载中…</div>
  <div id="main-container"></div>

  <!-- 氛围层：星芒闪烁 / 氛围光 / 暗角（纯 CSS，指针穿透） -->
  <div id="fx-stars"></div>
  <div id="fx-glow"></div>
  <div id="fx-vignette"></div>

  <div id="title">SOLAR SYSTEM · 太阳系</div>
  <div id="hint"><b>拖动</b>旋转 · <b>滚轮</b>缩放 · <b>点击</b>行星查看信息</div>

  <!-- 时间控制面板（默认收起，点击右上 ⏱ 展开） -->
  <button id="time-toggle" class="panel" title="时间控制">⏱</button>

  <!-- 行星栏（默认收起，点击右下 🪐 展开） -->
  <button id="planet-bar-toggle" class="panel" title="行星列表">🪐</button>

  <!-- 时间控制面板 -->
  <div id="time-ctl" class="panel">
    <div class="ttl"><span class="clock">⏱</span> 模拟时间</div>
    <div id="time-date">⏳ 加载中…</div>
    <div id="time-btns">
      <button id="t-realtime" class="on">▸ 实时</button>
      <button id="t-pause">⏸ 暂停</button>
    </div>
    <div class="t-row">
      <label>倍速</label>
      <input type="range" id="t-slider" min="0" max="100" value="0" />
      <span class="t-val" id="t-val">实时</span>
    </div>
  </div>

  <!-- 信息面板 -->
  <div id="info-panel" class="panel">
    <button id="info-close" title="关闭">✕</button>
    <div class="ip-name"><span class="ip-dot" id="ip-dot"></span><span id="ip-name">-</span></div>
    <div class="ip-desc" id="ip-desc">-</div>
    <div class="ip-grid">
      <div class="ip-cell"><div class="k">距太阳</div><div class="v" id="ip-dist">-</div></div>
      <div class="ip-cell"><div class="k">距地球</div><div class="v" id="ip-earth">-</div></div>
      <div class="ip-cell"><div class="k">平均温度</div><div class="v" id="ip-temp">-</div></div>
      <div class="ip-cell"><div class="k">公转速度</div><div class="v" id="ip-orb">-</div></div>
      <div class="ip-cell"><div class="k">自转周期</div><div class="v" id="ip-rot">-</div></div>
      <div class="ip-cell"><div class="k">公转周期</div><div class="v" id="ip-per">-</div></div>
      <div class="ip-cell"><div class="k">直径</div><div class="v" id="ip-diam">-</div></div>
      <div class="ip-cell"><div class="k">质量</div><div class="v" id="ip-mass">-</div></div>
      <div class="ip-cell"><div class="k">表面重力</div><div class="v" id="ip-grav">-</div></div>
      <div class="ip-cell"><div class="k">已知卫星</div><div class="v" id="ip-moons">-</div></div>
    </div>
  </div>

  <div class="moon-overlay-label hidden" id="moon-overlay-label" title="点击聚焦月球">月球</div>

  <div id="planet-bar"><button id="planethome" title="回到全景">🌌 全景</button></div>

  <!-- ============================================================ -->
  <!-- JS 模块加载（按依赖顺序）                                       -->
  <!-- ============================================================ -->
  <!-- 1. SpaceKit 3D 库 -->
  <script src="./build/spacekit.js"></script>
  <!-- 2. 行星数据（纯数据，无依赖） -->
  <script src="./js/planets-data.js"></script>
  <!-- 3. 月球轨道计算（Schlyter 截断月球理论，无依赖） -->
  <script src="./js/moon-orbit.js"></script>
  <!-- 4. 时间工具函数（jdToGMST 运行时依赖全局 THREE） -->
  <script src="./js/time-utils.js"></script>
  <!-- 5. 3D 场景初始化（依赖 Spacekit + PLANETS，设置 viz/objects/window.THREE） -->
  <script src="./js/scene-init.js"></script>
  <!-- 6. 交互 + 时间控制 + 自转 + tick循环（依赖 viz/objects/PLANETS/THREE/computeMoonOrbitState/toJd等） -->
  <script src="./js/app.js"></script>
  <!-- 7. 移动端 UI（独立 IIFE） -->
  <script src="./js/mobile-ui.js"></script>
  <!-- 8. 星芒闪烁层（独立 IIFE） -->
  <script src="./js/stars-fx.js"></script>
</body>
</html>
